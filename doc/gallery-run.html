<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loft Graphics — Runner</title>
<style>
:root {
  --bg: #1e1e2e;
  --panel: #181825;
  --surface: #11111b;
  --border: #313244;
  --text: #cdd6f4;
  --subtext: #6c7086;
  --accent: #89b4fa;
  --green: #a6e3a1;
  --red: #f38ba8;
  --yellow: #f9e2af;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
header h1 { font-size: 16px; color: var(--accent); font-weight: 600; }
.toolbar { display: flex; gap: 8px; align-items: center; }
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 4px;
  background: var(--surface);
  color: var(--text);
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.back-link:hover { background: var(--panel); color: var(--accent); border-color: var(--accent); }
.nav-link {
  color: var(--subtext);
  text-decoration: none;
  padding: 5px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  transition: background 0.12s, color 0.12s;
}
.nav-link:hover { background: var(--surface); color: var(--text); }
.current-label {
  font-size: 12px;
  color: var(--subtext);
  margin-left: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 360px;
}
.current-label strong { color: var(--text); font-weight: 600; }
.spacer { flex: 1; }
button {
  background: var(--accent);
  color: var(--surface);
  border: none;
  padding: 5px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
button:hover { filter: brightness(1.1); }
button:disabled { opacity: 0.4; cursor: default; }
select {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
}
.main {
  flex: 1;
  display: flex;
  min-height: 0;
  background: #000;
  align-items: center;
  justify-content: center;
}
#gl-canvas { max-width: 100%; max-height: 100%; }
#output {
  background: var(--surface);
  color: var(--text);
  font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 12px;
  line-height: 1.5;
  padding: 6px 10px;
  max-height: 120px;
  overflow: auto;
  white-space: pre-wrap;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#output:empty { display: none; }
.status-bar {
  padding: 3px 10px;
  font-size: 11px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 16px;
  flex-shrink: 0;
}
.status-bar .ok { color: var(--green); }
.status-bar .err { color: var(--red); }
.status-bar .info { color: var(--subtext); }
#loading {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--accent);
  z-index: 100;
}
</style>
</head>
<body>
<div id="loading">Loading Loft runtime...</div>

<header>
  <h1>Loft Graphics</h1>
  <div class="toolbar">
    <a class="back-link" href="gallery.html">&larr; Back to Gallery</a>
    <button id="run-btn" onclick="runExample()" disabled>&#9654; Run</button>
    <button id="stop-btn" onclick="loftGL.shouldClose=true">&#9632; Stop</button>
    <span id="current-label" class="current-label"></span>
    <span class="spacer"></span>
    <a id="view-source" class="nav-link" href="#" target="_blank" rel="noopener" style="display:none">View source</a>
  </div>
</header>

<div class="main">
  <canvas id="gl-canvas" width="800" height="600"></canvas>
</div>
<div id="output"></div>

<div class="status-bar">
  <span id="status" class="info">Ready</span>
  <span id="timing" class="info"></span>
</div>

<script type="module">
import init, { compile_and_start, resume_frame } from './pkg/loft.js?v=ec8343fdbebc';
import { initLoftGL } from './loft-gl.js?v=6925fdf3267a';
import { GALLERY_EXAMPLES, GALLERY_LIST } from './gallery-examples.js?v=22370b4f0b1f';
import { createHost } from './loft-rt.js?v=6e9d35fa9f8f';

// ── The page's own filesystem and host ───────────────────────────────────────
//
// The wasm module reaches files through `globalThis.loftHost.fs_*`, and this page
// used to define none of them.  A method the host lacks is NOT an error: `host_call`
// resolves it with `Reflect::get`, gets `undefined`, and answers `undefined`, so
// every file operation became a silent no-op and a program reading a pack drew
// nothing while every check passed (loft#1545).
//
// It is created HERE, at module top level, because it must exist before anything
// can call into it, and because `loft-gl.js` MERGES its `gl_*` methods onto
// whatever `window.loftHost` already is (`= window.loftHost || {}`, then
// `Object.assign`) — so the full host first, its WebGL half over the top, and the
// gl methods still win where both define a name.
const { host: pageHost, fs: pageFS } = createHost();
window.loftHost = pageHost;

// ── WebGL bridge from library ────────────────────────────────────────────────
const canvas = document.getElementById('gl-canvas');
let loftGL = null;

// Asset map: example key → list of { name, type } to pre-load.
// type: 'image' = decode as HTMLImageElement, 'binary' = store as base64,
//       'store'  = a loft store image, written into the page's own filesystem.
//
// The three types differ in WHO reads the bytes.  An image and a binary are handed
// to the WebGL shim through `loftGL.assets`; a store is read by the loft program
// itself, through `store_load` and the paged loaders, so it has to land in the
// host filesystem under exactly the path the program passes.  `path` is that
// string: `assets::pack_read(pk, "assets/bb")` reads `assets/bb.meta.store`, and
// the pack's bulk half is paged out of `assets/bb.blobs.store` a key at a time.
const ASSET_MAP = {
  '04-textures': [{ name: 'wall.jpg', type: 'image' }],
  '20-textured-cube': [{ name: 'DejaVuSans-Bold.ttf', type: 'binary' }],
  '25-brick-buster': [
    { name: 'bb.meta.store', type: 'store', path: 'assets/bb.meta.store' },
    { name: 'bb.blobs.store', type: 'store', path: 'assets/bb.blobs.store' },
    // The layout sidecars beside each half.  A store whose recorded layout differs
    // from the one this program reads it with is refused rather than read at the
    // wrong stride, and an ABSENT sidecar reads as "no layout recorded" — which
    // passes.  Carrying them is what makes that gate a real check here.
    //
    // `text`, not `store`, and the distinction is load-bearing: the page's
    // filesystem types every file it holds, and `fs_read_text` answers NULL for a
    // node written as binary.  A sidecar written the wrong way is not a smaller
    // check — it is no check, because an unreadable sidecar is indistinguishable
    // from an absent one and both let the load proceed.
    { name: 'bb.meta.store.dschema', type: 'text', path: 'assets/bb.meta.store.dschema' },
    { name: 'bb.blobs.store.dschema', type: 'text', path: 'assets/bb.blobs.store.dschema' },
  ],
};
const ASSET_BASE = './assets/';
// Font search: example 20 tries system paths; map them to our served file.
const FONT_ALIASES = {
  '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf': 'DejaVuSans-Bold.ttf',
  '/usr/share/fonts/TTF/DejaVuSans-Bold.ttf': 'DejaVuSans-Bold.ttf',
  'C:/Windows/Fonts/arial.ttf': 'DejaVuSans-Bold.ttf',
};

// Cache fetched assets across runs — only fetch once per session.
const assetCache = {};

async function preloadAssets(exampleKey) {
  if (!loftGL) return;
  loftGL.assets = {};
  const entries = ASSET_MAP[exampleKey];
  if (!entries) return;
  for (const entry of entries) {
    const cacheKey = entry.name;
    // A filesystem entry is deliberately NOT cached.  The cache holds what
    // `loftGL.assets` needs, and these contribute nothing to it — so the cached
    // value is an empty object, which is truthy, and a second run would
    // short-circuit here and never write the file into the filesystem at all.  It
    // survives today only because the page's FS outlives the run, which is luck
    // rather than a design.
    const intoFS = entry.type === 'store' || entry.type === 'text';
    if (!intoFS && assetCache[cacheKey]) {
      Object.assign(loftGL.assets, assetCache[cacheKey]);
      continue;
    }
    const registered = {};
    if (entry.type === 'image') {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise(resolve => {
        img.onload = resolve;
        img.onerror = () => { console.warn('Failed to load:', entry.name); resolve(); };
        img.src = ASSET_BASE + entry.name;
      });
      registered[entry.name] = { image: img };
      registered['examples/' + entry.name] = { image: img };
    } else if (entry.type === 'binary') {
      try {
        const resp = await fetch(ASSET_BASE + entry.name);
        const bytes = new Uint8Array(await resp.arrayBuffer());
        registered[entry.name] = { bytes };
        for (const [alias, target] of Object.entries(FONT_ALIASES)) {
          if (target === entry.name) {
            registered[alias] = { bytes };
          }
        }
      } catch (e) {
        console.warn('Failed to load binary asset:', entry.name, e);
      }
    } else if (entry.type === 'store') {
      // Into the page's FILESYSTEM, not into `loftGL.assets`: the reader is the
      // loft program, which asks the host for this path by name.  A failure here
      // is reported rather than swallowed — a pack that does not arrive makes the
      // example draw an empty atlas, which is precisely the failure that is
      // invisible from the outside.
      const url = ASSET_BASE + entry.name;
      const resp = await fetch(url);
      if (!resp.ok) {
        throw new Error(`asset ${url} → HTTP ${resp.status}`);
      }
      const bytes = new Uint8Array(await resp.arrayBuffer());
      pageFS.writeBinary(entry.path, bytes);
    } else if (entry.type === 'text') {
      // Same journey as a store, one type over.  The page's filesystem keeps text
      // and binary as different node kinds and `fs_read_text` refuses the wrong
      // one, so what a file is WRITTEN as decides whether the reader can see it.
      const url = ASSET_BASE + entry.name;
      const resp = await fetch(url);
      if (!resp.ok) {
        throw new Error(`asset ${url} → HTTP ${resp.status}`);
      }
      pageFS.writeText(entry.path, await resp.text());
    }
    if (!intoFS) {
      assetCache[cacheKey] = registered;
    }
    Object.assign(loftGL.assets, registered);
  }
}

// ── UI ───────────────────────────────────────────────────────────────────────
const outputEl = document.getElementById('output');
const statusEl = document.getElementById('status');
const timingEl = document.getElementById('timing');
const runBtn = document.getElementById('run-btn');
const currentLabel = document.getElementById('current-label');
const viewSourceLink = document.getElementById('view-source');

let currentSource = '';
let currentKey = '';
let loftReady = false;

// URL parameters drive the runner:
//   ?example=KEY  load that example's source for execution
//   ?autorun=1    start the example as soon as the runtime is ready
//
// The on-page UI is canvas-dominant — visual is the point of the
// gallery.  Users who want to read the source follow the
// "View source" link in the toolbar, which lands them on the GitHub
// view of the .loft file (with Rust syntax highlighting via the
// .gitattributes Linguist override).
const urlParams = new URLSearchParams(window.location.search);
const preselect = urlParams.get('example');
const autorun = urlParams.get('autorun') === '1';

if (preselect && GALLERY_EXAMPLES[preselect]) {
  currentKey = preselect;
  currentSource = GALLERY_EXAMPLES[preselect];
  const meta = GALLERY_LIST.find((ex) => ex.key === preselect);
  if (meta) {
    currentLabel.innerHTML = `Example: <strong>${meta.name}</strong>`;
  }
  viewSourceLink.href = `https://github.com/loft-lang/loft/blob/main/lib/graphics/examples/${encodeURIComponent(preselect)}.loft`;
  viewSourceLink.style.display = '';
}

// ── Init ─────────────────────────────────────────────────────────────────────
//
// Friendly-error guard — the native error surface for a stale gallery
// build is `LinkError: WebAssembly.instantiate(): Failed to grow table`
// or `ImportObject ... function import mismatch`.  Those messages do
// not tell the user what to do.  We catch them here and print the
// actionable recovery steps.
function explainLoadError(e) {
  const msg = String(e && e.message || e);
  if (msg.includes('grow table') || msg.includes('function import') ||
      msg.includes('imported function') || msg.includes('link error')) {
    return (
      'The gallery\u2019s WASM bundle and JS glue are out of sync ' +
      '(classic "failed to grow table" error). This usually means ' +
      'the deployed build is stale. On a local clone, run ' +
      '"make gallery" to rebuild both together. If you are on the ' +
      'deployed site and still see this, please file an issue.'
    );
  }
  return 'Failed to load: ' + msg;
}

async function initLoft() {
  try {
    const wasm = await init();
    // @PLN117 — real Web Worker threads for par() when the host is cross-origin
    // isolated (COOP/COEP -> SharedArrayBuffer).  Inert on the single-threaded
    // bundle (which ships no loft-thread.js) and on non-isolated hosts: par()
    // stays sequential — never breaks.  Threaded gallery: `make gallery-mt` +
    // COOP/COEP.
    try {
      if (self.crossOriginIsolated) {
        const mainJS = new URL('./pkg/loft.js', import.meta.url).href;
        const { startLoftWorkers } = await import('./pkg/loft-thread.js');
        await startLoftWorkers(wasm, navigator.hardwareConcurrency, { memory: wasm.memory, mainJS });
      }
    } catch (e) { console.warn('loft: thread pool init skipped —', e); }
    loftReady = true;
    runBtn.disabled = false;
    document.getElementById('loading').style.display = 'none';
    loftGL = initLoftGL(canvas);
    statusEl.textContent = 'Ready';
    statusEl.className = 'ok';
    if (autorun && currentKey) {
      window.runExample();
    }
  } catch (e) {
    document.getElementById('loading').textContent = explainLoadError(e);
    statusEl.textContent = 'Failed';
    statusEl.className = 'err';
  }
}

// ── Run with frame yield ─────────────────────────────────────────────────────
let animFrame = 0;
let frameCount = 0;

window.runExample = async function() {
  if (!loftReady || !currentSource) return;
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = 0; }
  loftGL.shouldClose = false;
  outputEl.textContent = '';
  statusEl.textContent = 'Loading assets...';
  statusEl.className = 'info';
  timingEl.textContent = '';
  frameCount = 0;

  // Pre-load assets for this example.  A pack that does not arrive is reported
  // HERE, where the reason is still known.  Left to run, the program reads an
  // empty pack, draws a 1x1 atlas and finishes cleanly — a page that looks like
  // it worked, which is the failure this whole path exists to stop being silent.
  const selectedKey = currentKey;
  try {
    await preloadAssets(selectedKey);
  } catch (e) {
    outputEl.textContent = 'Asset load failed: ' + ((e && e.message) || e);
    statusEl.textContent = 'Failed';
    statusEl.className = 'err';
    return;
  }

  statusEl.textContent = 'Compiling...';
  const files = JSON.stringify([{ name: 'main.loft', content: currentSource }]);
  let result;
  try {
    result = JSON.parse(compile_and_start(files));
  } catch (e) {
    outputEl.textContent = 'Internal error: ' + e.message;
    statusEl.textContent = 'Error';
    statusEl.className = 'err';
    return;
  }

  if (!result.ok) {
    outputEl.textContent = result.error || 'Compilation failed';
    statusEl.textContent = 'Failed';
    statusEl.className = 'err';
    return;
  }

  if (!result.running) {
    outputEl.textContent = result.output || '';
    statusEl.textContent = 'Ok';
    statusEl.className = 'ok';
    return;
  }

  statusEl.textContent = 'Running';
  statusEl.className = 'ok';
  canvas.focus();

  function frame() {
    frameCount++;
    let r;
    try {
      r = JSON.parse(resume_frame());
    } catch (e) {
      outputEl.textContent = 'Runtime error: ' + e.message;
      statusEl.textContent = 'Error';
      statusEl.className = 'err';
      animFrame = 0;
      return;
    }
    // A running frame may carry what the program printed during it.  The wasm
    // side CLEARS its buffer as it hands the text over, so this is the only
    // copy — append it, never replace, or the last frame would be the only
    // thing a reader ever saw.  This is what makes a long-lived program's own
    // report visible at all: a game never "finishes", so anything it said used
    // to arrive only at a moment that does not come.
    if (r.output) {
      outputEl.textContent += r.output;
    }
    if (r.running && !loftGL.shouldClose) {
      timingEl.textContent = `frame ${frameCount}`;
      animFrame = requestAnimationFrame(frame);
    } else {
      animFrame = 0;
      outputEl.textContent = r.output || r.error || '';
      statusEl.textContent = r.error ? 'Error' : 'Done';
      statusEl.className = r.error ? 'err' : 'ok';
      timingEl.textContent = `${frameCount} frames`;
    }
  }
  animFrame = requestAnimationFrame(frame);
};

initLoft();
</script>
</body>
</html>
