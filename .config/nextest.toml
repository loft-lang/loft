# cargo-nextest configuration.
#
# The `ci` profile used in .github/workflows/ci.yml tunes nextest for
# GitHub Actions: retry flaky tests once, cap parallelism to the
# runner's reported threads, and use the JUnit reporter so the
# Actions UI can surface failures.

[profile.default]
# Local runs: fail fast, no retries.
failure-output   = "immediate"
success-output   = "never"
status-level     = "pass"
# @PLAN49 T4 — kill a hung test process after 300s (terminate-after = 1 ->
# warn-and-kill at the same period).  Localizes a hung script in loft_suite
# / a hung native binary spawn / a stuck wasm build to ONE test process;
# the rest of the suite continues.  Per-process slow-timeout via nextest;
# stronger guarantee than the in-process `loft --timeout` because nextest
# escalates to SIGKILL if the process ignores SIGTERM.
slow-timeout     = { period = "300s", terminate-after = 1 }

[profile.ci]
# CI runs: retry flaky tests once, emit JUnit for the Actions UI.
retries          = 1
failure-output   = "immediate-final"
success-output   = "never"
status-level     = "pass"
final-status-level = "slow"
# @PLAN49 T4 — same slow-timeout as default; CI hosts are typically slower
# so give 600s (the long-running tests like p137_html_* + audience_crystal
# already run 60-120s on slow runners).
slow-timeout     = { period = "600s", terminate-after = 1 }

[profile.ci.junit]
# RELATIVE TO THE PROFILE STORE DIR (`target/nextest/<profile>/`), not to the
# repo root — so this writes `target/nextest/ci/junit.xml`.  It previously read
# `target/nextest/junit.xml`, which looks repo-rooted and is not: the report
# landed at `target/nextest/ci/target/nextest/junit.xml` while every consumer
# looked at the repo-rooted spelling, found nothing, and said nothing.  Keep
# this a bare filename so the two can't drift apart again.
path = "junit.xml"

# P137 / html_wasm test serialisation.
#
# Every `--html` invocation writes the generated Rust to a fixed path
# (`/tmp/loft_html.rs` / `/tmp/loft_html.wasm`) in the loft driver
# (src/main.rs:1753, 1789).  The in-process `Mutex` in
# tests/html_wasm.rs::build_lock guards parallel *threads* in one
# cargo-test process, but nextest spawns a separate process per test
# — each process has its own `OnceLock`-managed mutex, so the shared
# temp files race and one test's rustc invocation reads the partially
# overwritten intermediate source of another.  Symptoms were flaky
# "loft --html failed for …" and mismatched stdout ("sum=45" vs
# "total=60") across `p137_html_*` runs.
#
# Binding all html_wasm tests to a single-slot test-group serialises
# them at the nextest dispatcher level, crossing the process boundary
# the Rust Mutex can't.  The Mutex remains as belt-and-suspenders for
# plain `cargo test` / developer loops.
#
# Same shape applied to multiplayer_v2 when every scenario bound the example v2
# server on the fixed port 7878.  THAT REASON IS GONE: P231 moved v2 and v3 to
# `pick_free_port()` (bind 127.0.0.1:0), so two scenarios can no longer race for
# the same bind.  They stay in the group below for the OTHER reason — starvation
# under a rustc storm — not for ports.  Do not cite the port race as
# justification; it no longer exists.

[test-groups]
html-wasm-serial = { max-threads = 1 }
# Serialise the CPU-heavy native-build tests (each spawns many concurrent rustc)
# TOGETHER WITH the timing-sensitive networked tests (multiplayer websocket
# games; the wasm debug relay), so a native rustc storm never runs alongside —
# and starves into an empty response / timeout — a server test.  Only one test
# from this group runs at a time; everything else stays fully parallel.  Subsumes
# the old `multiplayer-v2-serial`.  (The markdown viewer smoke test runs in its
# own isolated advisory job instead — see ci.yml.)
#
# wasm_debug_relay is BOTH a builder and a victim: it does a `--html --debug`
# wasm build AND spawns a `--native` engine_host server, then runs a timing-
# sensitive agent→server→client relay (a 15s server-accept deadline + the node
# driver's relay handshake).  Under parallel rustc-storm load the handshake
# starves ("agent did not receive the relayed reply") — the multiplayer-class
# flake — so it joins the group.  It passes in isolation; this closes the
# starvation window (it still gets the ci profile's one retry on top).
#
# multiplayer_v5 is deliberately NOT in this group — it stays fully parallel.
# It had the same exposure (its `use web` triggers a COLD loft_web cdylib build
# ~23s via a spawned `cargo build` grandchild; under heavy build-lock contention
# that could blow the 60s listen cap, the harness kills the loft child, the
# grandchild survives holding the stdout pipe, and the drain blocked to the 600s
# TMT — probe data, ci-probe.yml v5-alone/v5-vs-native, 2026-06-13).  Fixed at
# the root instead: drain_with_timeout bounds its wait (JOIN_CAP), so a held-open
# pipe is a ~45s fail-and-retry, not a 600s hang — keeping v5 parallel without
# paying the serial cost.
#
# MEASURED 2026-07-26 — do NOT widen this group expecting a speedup.  Widening it
# to 4 locally took the `native` binary 32.8s → 9.6s (3.4×), which looks compelling
# and is irrelevant: this box has many cores, `macos-latest` has 3.  What decides
# it is which chain is CRITICAL:
#
#   serial chain, all 7 members (macOS):  288s  [native 240 + n3_parity 20 +
#                                                n3_use_native 14 + n2_cdylib 9 +
#                                                relay 5 + v2/v3 <1]
#   general pool:                        ~1662s at ~2 effective threads ≈ 831s
#
# The pool is ~3× longer, so this group is NOT the critical path: widening it buys
# ≈0 wall-clock while re-opening the starvation flake it exists to close.  The leg
# is bound by TOTAL WORK ÷ PARALLELISM.  See doc/claude/CI_BUDGET.md.
#
# RE-MEASURED LOCALLY 2026-08-21, on 24 cores, because "that reasoning is about a
# 3-core runner" is the obvious objection and it deserved a number rather than an
# argument.  Same eight binaries, serial vs widened (4/6):
#
#   serial (ci profile)     122.5s
#   widened (6 threads)     103.5s     -> 19s, and that is the group IN ISOLATION
#
# Against a 572s full run, on the leg that is not the critical path.  So the
# conclusion holds on a big box too: this group is not where local time goes.
# ⚠ Where it actually goes: `ir_schema_roundtrip`, in the general POOL, whose two
# `stdlib_*_round_trip` tests measure 136s EACH ALONE with every core free — real
# work, not contention.  They are the wall-clock floor of any schedule here.
#
# If v2/v3 are ever to leave this group the way v5 did, they need v5's JOIN_CAP
# bounded drain FIRST — they currently carry their own UNBOUNDED copies of
# drain_with_timeout, so today they would be exposed to the same 600s-TMT hang.
heavy-serial = { max-threads = 1 }
# Widened twins of the two serial groups, used ONLY by `[profile.fast]` below.
heavy-wide = { max-threads = 6 }
html-wasm-wide = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(html_wasm)'
test-group = 'html-wasm-serial'

[[profile.default.overrides]]
filter = 'binary(native) + binary(n2_cdylib) + binary(n3_parity) + binary(n3_use_native) + binary(multiplayer_v2) + binary(multiplayer_v3) + binary(wasm_debug_relay)'
test-group = 'heavy-serial'

[[profile.ci.overrides]]
filter = 'binary(html_wasm)'
test-group = 'html-wasm-serial'

[[profile.ci.overrides]]
filter = 'binary(native) + binary(n2_cdylib) + binary(n3_parity) + binary(n3_use_native) + binary(multiplayer_v2) + binary(multiplayer_v3) + binary(wasm_debug_relay)'
test-group = 'heavy-serial'

# The profile every sanitizer leg runs under: `miri.yml`'s nightly ASan sweep and leak gate,
# and `ci.yml`'s per-PR ASan sweep since 2026-09-15 (that one sat at 587 s of `ci`'s 600 s
# and was killed at 600 s by the next commit that added a corpus script — run 34980517571).
#
# It is `ci` with ONE difference: `loft_suite`, which runs every `tests/scripts` program
# serially inside one test process, gets a longer ceiling.  Under `-Zsanitizer=address` that
# one test is the whole leg's clock, and it grows with the corpus rather than with any hang:
# measured on GitHub's ubuntu runner, 577.5 s of a 600 s ceiling at 1356 scripts (green,
# 5cd4785c9) and killed at 600 s at 1371 (loft#1527), while the uninstrumented `ci` run of
# the same test takes a fraction of that.  So the ceiling is raised HERE, for the build that
# is slow by construction, and not in `ci`, where 600 s still catches a hung script.  Every
# other test keeps `ci`'s 600 s.
[profile.sanitizer]
retries          = 1
failure-output   = "immediate-final"
success-output   = "never"
status-level     = "pass"
final-status-level = "slow"
slow-timeout     = { period = "600s", terminate-after = 1 }

[profile.sanitizer.junit]
path = "junit.xml"

[[profile.sanitizer.overrides]]
filter = 'binary(wrap) & test(loft_suite)'
slow-timeout = { period = "1800s", terminate-after = 1 }

[[profile.sanitizer.overrides]]
filter = 'binary(html_wasm)'
test-group = 'html-wasm-serial'

[[profile.sanitizer.overrides]]
filter = 'binary(native) + binary(n2_cdylib) + binary(n3_parity) + binary(n3_use_native) + binary(multiplayer_v2) + binary(multiplayer_v3) + binary(wasm_debug_relay)'
test-group = 'heavy-serial'

# @PLN-speed — the profile `scripts/test_speed.py` runs under.
#
# It exists for ONE reason: a machine-readable per-test duration.  The human log
# is a UI, and `find_problems.sh` legitimately runs with `--status-level fail`,
# which prints no timing at all for a passing test — so the speed report reads
# the JUnit report instead, where every case carries its `time`.
#
# Deliberately NOT the `ci` profile: `retries = 1` would time a flaky test's
# SECOND attempt, and a retried test is the one case whose duration means
# nothing.  Same slow-timeout as `default`, because a hung test should be killed
# on the same terms whichever profile found it.
[profile.speed]
status-level       = "fail"
final-status-level = "slow"
slow-timeout       = { period = "300s", terminate-after = 1 }

[profile.speed.junit]
# Relative to `target/nextest/speed/`, like the `ci` profile above — keep it a
# bare filename so the two cannot drift apart.
path = "junit.xml"

# ---- `fast` — the LOCAL gate, 1.9x quicker, and NOT what CI runs ----
#
# The two serial groups above exist for a 3-core CI runner, and the note there is right
# that widening them buys ~0 on `macos-latest`.  On a 24-thread developer box the same
# change is worth almost half the wall clock, because the denominator moved: when the
# suite was ~570s the 122s serial chain was noise, and after the JSON parser fix
# (loft#1057, `json::parse` 124s -> 123ms on a single-line document) the suite is ~153s
# and that same chain is most of it.
#
# ⚠ A RECORDED "NOT WORTH IT" IS A RATIO, AND RATIOS HAVE DENOMINATORS THAT MOVE.  The
# July measurement was correct when taken and expired without saying so — re-measure a
# conclusion when the thing it was measured against changes.
#
# MEASURED 2026-08-21, 24 threads, warm, claimed box, ALTERNATED ci/fast/ci/fast/ci/fast
# so drift lands on both arms rather than on whichever went second:
#
#   ci     152.78s  153.71s              mean 153.2s
#   fast    82.00s   81.48s   80.89s     mean  81.5s      -> 1.88x
#
# (A seventh run of `fast` confirmed 4375 passed / 0 failed in 86.0s.  A first run of
# 381s was discarded: 3253s of user time says it paid for the build, which
# `cargo build --release --tests` had not covered — nextest builds its own test profile.)
#
# ⚠⚠ WHAT THIS IS NOT: proof it is safe under load.  The serial groups close a STARVATION
# window — `wasm_debug_relay` and the multiplayer suites pass in isolation and fail when a
# rustc storm runs beside them — and a quiet box is the least likely place to see that.
# Four green runs on an idle machine is evidence, not a guarantee.  So this is opt-in and
# `ci` is untouched: if you see a networked test fail here, re-run under `--profile ci`
# before believing it, exactly as you would a failure from a shared box.
[profile.fast]
failure-output = "immediate"
success-output = "never"
status-level   = "fail"
slow-timeout   = { period = "300s", terminate-after = 1 }

[[profile.fast.overrides]]
filter = 'binary(html_wasm)'
test-group = 'html-wasm-wide'

[[profile.fast.overrides]]
filter = 'binary(native) + binary(n2_cdylib) + binary(n3_parity) + binary(n3_use_native) + binary(multiplayer_v2) + binary(multiplayer_v3) + binary(wasm_debug_relay)'
test-group = 'heavy-wide'
