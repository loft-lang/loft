[package]
name    = "loft-native-scalar"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"

# cdylib (the C-ABI artifact `--native` links + the interpreter dlopens) + rlib
# (the rlib-path fallback for platforms where the C-ABI path is off).  Plan-74:
# the scalar `#native` now dispatches through a generated `#[loft_native]` bridge
# on `--interpret` (the legacy raw-ptr arms are gone), so it deps loft-ffi +
# loft-ffi-macros and source-scans the register list via loft-ffi-build — still
# the cheapest native fixture (one no-arg fn).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
loft-ffi = { path = "../../../../loft-ffi" }
loft-ffi-macros = { path = "../../../../loft-ffi-macros" }
# A registry crate loft itself links, at the version loft's own Cargo.lock holds: a static
# link then carries ONE copy of it only when the package was built with the flags loft was
# (`a_static_link_ships_one_file_that_runs_alone`).  A path dependency cannot show that —
# the path remap never touches its sources — and a different version is a different crate.
cfg-if = "=1.0.4"

[build-dependencies]
loft-ffi-build = { path = "../../../../loft-ffi-build" }
