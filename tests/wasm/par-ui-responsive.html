<!-- @PLN117 E1 — off-main-thread UI responsiveness.  A requestAnimationFrame
     loop advances an animation and runs one heavy par() per frame for a fixed
     window.  With the Web Worker pool each frame's par finishes ~N x faster, so
     the main thread is BLOCKED for less of every frame — that shorter block is
     what "the UI stays responsive" means, and it is what this page measures.

     It reports both halves.  `block` is the time spent inside compile_and_run,
     i.e. the span the main thread cannot service input or paint: it is decided
     by the work, so it measures par and nothing else.  `frames` and `gap` are
     how often rAF actually fired, which the BROWSER decides — a page it treats
     as hidden gets rAF at ~1 Hz however fast the work underneath is, so a frame
     count reads that throttle rather than the compute.  Both are reported;
     only `block` is safe to gate on.  ?threads=P (0 = sequential), ?work,
     ?elems, ?window (ms).

     The FIRST frame's block is reported apart (`first_block_ms`) and kept out
     of `max_block_ms` and `p90_block_ms`, exactly as the first gap is kept out
     of `max_gap_ms`: it is a one-time cold start, not responsiveness.  Measured
     (loft#1832): a warm-up `compile_and_run` of an empty program absorbs ~100 ms
     of it in BOTH legs (the first compile), and the threaded leg carries ~50 ms
     more on its first heavy par (the workers' first real work); every later
     frame is steady.  `max_block_ms` compared those two cold starts, which is
     why its verdict flipped from run to run while the average never did. -->
<meta charset=utf-8><title>loft par UI responsiveness</title>
<style>#box{width:24px;height:24px;background:#3a7;position:absolute}</style>
<pre id=out>running…</pre><div id=box></div>
<script>
const q = new URLSearchParams(location.search);
const report = m => { document.getElementById('out').textContent = m; fetch('/report?r=' + encodeURIComponent(m)).catch(()=>{}); };
window.addEventListener('error', e => report('winerror=' + (e.message||e.filename||e)));
window.addEventListener('unhandledrejection', e => report('reject=' + ((e.reason&&e.reason.message)||e.reason)));
</script>
<script type=module>
import init, { compile_and_run } from './pkg-mt/loft.js';
import { startLoftWorkers } from './pkg-mt/loft-thread.js';
const report = m => { document.getElementById('out').textContent = m; fetch('/report?r=' + encodeURIComponent(m)).catch(()=>{}); };
const P      = q.has('threads') ? (parseInt(q.get('threads'),10) || 0) : 8;
const work   = parseInt(q.get('work')  || '40000', 10);
const elems  = parseInt(q.get('elems') || '48', 10);
const WINDOW = parseInt(q.get('window')|| '2500', 10);
const box = document.getElementById('box');
const SRC = `fn heavy(x: integer) -> integer { acc = 0; for i in 0..${work} { acc += (x * i + i) % 7; } acc % 1000 + x }
fn main() { data = [0]; for i in 1..${elems} { data += [i]; } total = 0; for a in data par(b = heavy(a), 8) { total += b; } println("total={total}"); }`;
(async () => {
  try {
    const wasm = await init();
    if (!self.crossOriginIsolated) return report('FAIL coi=false');
    if (P > 0) await startLoftWorkers(wasm, P, { memory: wasm.memory, mainJS: new URL('./pkg-mt/loft.js', import.meta.url).href });
    let frames = 0, last = performance.now(), maxGap = 0, value = '?';
    let workMs = 0, firstBlock = -1;
    const blocks = [];  // every frame after the first, for max and p90
    const start = last;
    const frame = () => {
      const now = performance.now();
      const gap = now - last; last = now;
      if (frames > 0 && gap > maxGap) maxGap = gap;  // skip the first (init) gap
      frames++;
      box.style.left = (frames % 40) * 6 + 'px';     // advance the animation
      // The main thread is blocked for exactly this span — the measurement the
      // gate reads, and the only one the browser's frame scheduling cannot move.
      const b0 = performance.now();
      const res = JSON.parse(compile_and_run(JSON.stringify([{name:'main.loft', content: SRC}])));
      const block = performance.now() - b0;
      workMs += block;
      if (firstBlock < 0) firstBlock = block; else blocks.push(block);
      value = (res.output||'').match(/total=(\d+)/)?.[1] || value;
      if (performance.now() - start < WINDOW) requestAnimationFrame(frame);
      else {
        const sorted = blocks.slice().sort((a, b) => a - b);
        const maxBlock = sorted.length ? sorted[sorted.length - 1] : firstBlock;
        // Nearest-rank 90th percentile of the steady frames.
        const p90 = sorted.length ? sorted[Math.max(0, Math.ceil(0.9 * sorted.length) - 1)] : firstBlock;
        report(`E1 threads=${P} window=${WINDOW} frames=${frames} fps=${(frames/(WINDOW/1000)).toFixed(1)}`
          + ` max_gap_ms=${maxGap.toFixed(0)} avg_block_ms=${(workMs/frames).toFixed(1)}`
          + ` first_block_ms=${firstBlock.toFixed(0)} max_block_ms=${maxBlock.toFixed(0)}`
          + ` p90_block_ms=${p90.toFixed(0)} work_ms=${workMs.toFixed(0)} value=${value}`);
      }
    };
    requestAnimationFrame(frame);
  } catch (e) { report('caught=' + ((e && e.message) || String(e))); }
})();
</script>
