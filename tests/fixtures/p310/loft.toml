#
# @P310 regression fixture — a vector<integer> argument to a vec<i64>
# FFI wrapper must lower to *const i64.  This mini-package is driven by
# `tests/codegen_emitter.rs::p310_graphics_vector_ffi_checks_clean`
# (native --check, no run).  It depends on the registry-published
# `graphics` chunk; auto-install handles fetch on first use.

[package]
name    = "p310_save_png"
version = "0.0.0"
loft    = ">=0.8"

# Pin the FULL tree with EXACT (`=`) versions so this codegen guard validates
# the FFI stride against a fixed, compiling consumer and can't be broken by
# unrelated registry churn.  graphics does `use glb;` at source level, so glb
# resolves transitively; a root pin now overrides that (loft honours declared
# constraints for auto-installs, direct AND transitive).  This matters because
# glb-0.1.1 (republished 2026-07-18) is broken (`use mesh;`/`use scene;` ->
# Library not found), whereas 0.1.0 correctly uses `use mesh3d;`.  Bump these
# deliberately when the graphics FFI surface the guard exercises changes.
#
# graphics 0.9.3 is the first release that declares its read-only parameters `const`,
# which C124 requires (0.3.0 passed a `const` to a plain parameter and is now refused).
# graphics 0.9.4, glb 0.1.3 and mesh3d 0.1.2 are the C98 releases: mesh3d passes its
# modules' names on with `pub use` (so it, and every consumer of it, needs loft 2026.10.0).
# graphics 0.9.10, glb 0.1.6 and mesh3d 0.1.4 are the C140 releases: a field read outside its
# file needs `pub`, and mesh3d reads its own `math` module's fields from `mesh`.
[dependencies]
graphics = "=0.9.10"
glb = "=0.1.6"
mesh3d = "=0.1.4"
