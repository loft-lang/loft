# The web library's natives as the web library declares them on loft's `net` component
# (`[native] component = "net"`), for tests/web_natives.rs: the natives are loft's own
# (src/c/components/net.c over src/c/loft_web.h), so the guard needs only their declarations,
# not the library.
[package]
name = "web_natives"
version = "0.1.0"
loft = ">=2026.10.0"

[library]
entry = "src/web_natives.loft"

[native]
component = "net"
