# The ssh library's natives as the ssh library declares them on loft's `net` component
# (`[native] component = "net"`), for tests/ssh_natives.rs and the OpenSSH probe: the natives are
# loft's own (src/c/loft_ssh.h and src/c/tls/loft_ssh.c in src/c/components/net.c), so a test
# needs only their declarations, not the library.
[package]
name = "ssh_natives"
version = "0.1.0"
loft = ">=2026.10.0"

[library]
entry = "src/ssh_natives.loft"

[native]
component = "net"
