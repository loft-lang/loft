#
# @PLAN12 Phase 6b — integration-test manifest for monorepo
# harnesses (`tests/multiplayer_v{2,3,5}.rs` +
# `codegen_emitter.rs::p244`) that previously read scripts out of
# `lib/game_protocol/examples/` and `lib/server/tests/`.  After
# Stage B removed those library directories from the monorepo,
# the scripts moved here and depend on the published `web` /
# `server` / `game_protocol` packages via the loft package
# registry.

[package]
name    = "loft_integration_tests"
version = "0.0.0"
loft    = ">=0.8"

[dependencies]
# Floors at the first releases that carry `pub` on what this reads: a field is private
# to its file without it (C140).
web           = ">=0.4.5"
server        = ">=0.7.4"
game_protocol = ">=0.1.7"
hex_world     = ">=0.2.3"
