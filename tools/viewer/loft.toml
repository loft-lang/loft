# @PLAN12 Phase 6b — loft.toml for the branch-review viewer tool
# (`tools/viewer/`).  Uses the registry `server` library for HTTP serving, the
# registry `markdown` library for content rendering, and `html` for escaping.

[package]
name    = "loft_viewer"
version = "0.0.0"
loft    = ">=0.8"

[library]
entry = "src/main.loft"

[dependencies]
# Floors at the first releases that carry `pub` on what this reads: a field is private
# to its file without it (C140).
# ⚠ Each floor states something this viewer cannot work without, so a resolver cannot pick
# a version where it is absent: `server::listen_on` binds LOOPBACK (plain `listen` binds
# 0.0.0.0 and would publish `/raw/<path>` on every interface), and `respond_bytes` answers
# an image byte-safe.
server   = ">=0.7.4"
markdown = ">=0.2.5"
html     = ">=0.1.3"
# Resolved and used transitively through `server`; declared so the manifest says so
# (the `undeclared-dependency` advice, loft#968).
web      = ">=0.4.5"
