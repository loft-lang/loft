# @PLAN12 Phase 6b — loft.toml for the audience-demo tool tree.
# Scripts here use `web` / `server` for protocol/transport,
# `audience_crystal` + `gridmesh` for the rendering data model,
# and `graphics` for the actual canvas drawing.
#
# `web` + `server` + `gridmesh` + `graphics` resolve via the loft
# package registry.  `audience_crystal` is the monorepo-paired demo
# library and stays path-resolved (Phase 8 will retire it as a
# `tools/audience-demo/` test dir).

[package]
name    = "audience_demo"
version = "0.0.0"
loft    = ">=2026.10.0"

[dependencies]
# Floors at the first releases that carry `pub` on what this reads: a field is private
# to its file without it (C140).
web                = ">=0.4.5"
server             = ">=0.7.4"
audience_crystal   = { path = "../../lib/audience_crystal" }
gridmesh           = ">=0.2.6"
graphics           = ">=0.9.10"
