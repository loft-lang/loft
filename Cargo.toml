[package]
name = "loft"
version = "2026.9.0"
edition = "2024"
authors = ["Jurjen Stellingwerff"]
license = "LGPL-3.0-or-later"
description = "The loft scripting language interpreter"
homepage = "https://github.com/loft-lang/loft"
repository = "https://github.com/loft-lang/loft"
keywords = ["language", "interpreter", "scripting"]
categories = ["command-line-utilities", "compilers"]

[lib]
name = "loft"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "loft"
path = "src/main.rs"

[[bin]]
name = "gendoc"
path = "src/gendoc.rs"
# The doc site's library tiers (@PLN149) are rendered from the registry index and the
# packages it names, so gendoc reads `loft::registry_index` and `loft::install` — both
# behind the `registry` feature.  Without this line `cargo clippy --no-default-features
# --all-targets` (the second variant `make ship` runs) tries to build gendoc without
# them and stops on E0433 before linting anything.
required-features = ["registry"]

[[bin]]
name = "loft-keygen"
path = "src/bin/loft-keygen.rs"
required-features = ["registry"]

# @PLN63 — the loft Language Server (LSP over JSON-RPC/stdio).  Links the loft
# rlib for parser/typecheck; no extra features (wire JSON is loft's own json mod).
[[bin]]
name = "loft-lsp"
path = "src/bin/loft-lsp.rs"

# @PLN63 LSP.3 — the loft Debug Adapter (DAP over JSON-RPC/stdio).  Links the loft
# rlib and translates DAP requests to/from the `--rpc` debug engine (rpc::DebugDriver);
# wire JSON is loft's own json mod, same "own your dependencies" rule as loft-lsp.
[[bin]]
name = "loft-dap"
path = "src/bin/loft-dap.rs"

[features]
default      = ["mmap", "random", "threading", "registry", "native-extensions", "remote-store"]
threading    = ["dep:rayon"]
wasm         = ["dep:wasm-bindgen", "dep:serde", "dep:serde-wasm-bindgen",
                "dep:js-sys", "dep:web-sys", "png", "dep:fontdue",
                "dep:console_error_panic_hook"]
# @PLN117 — the gallery bundle: wasm-bindgen PLUS loft's own browser thread
# pool.  The pool is not wasm-bindgen's and never was loft-specific glue on top of
# a crate; it is the same runtime the raw `--html` bundle links, so `par` behaves
# identically in both.
wasm-threads = ["wasm", "wasm-native-threads"]
# @PLN117 — loft's OWN browser threading: rayon over Web Workers the host spawns,
# with no wasm-bindgen anywhere, so it links into both the wasm-bindgen gallery
# bundle and the raw `loft --html` one.
# `rayon/web_spin_lock` is not optional: without it rayon reaches a `std` lock
# from the calling thread on every `par` and the browser main thread — which may
# not block — throws "Atomics.wait cannot be called in this context".  The
# `wasm_sync` that feature pulls is loft's own (see `[patch.crates-io]`).
wasm-native-threads = ["threading", "rayon/web_spin_lock", "dep:wasm_sync"]
png          = ["dep:png"]
# @PLN53 F1 — expose the raw-source fuzz oracle (src/fuzz_oracle.rs) for the
# cargo-fuzz `program_source` target. Also compiled under `cfg(test)`, so the
# seed-corpus replay runs without this flag.
fuzzing      = []
mmap         = ["dep:mmap-storage"]
random            = ["dep:rand_core", "dep:rand_pcg"]
native-extensions = ["dep:libloading"]
# @PLN97 arc G — the remote/paged working-set store loader. In `default` so
# dev/test builds compile+exercise it; a lean `--no-default-features` build
# compiles NONE of the paged/remote machinery (the zero-cost-to-non-users
# invariant). The HTTP `Range` page provider (Phase 5) pulls in `ureq`; the
# local-file provider (Phases 2–4) is dependency-free.
remote-store      = ["dep:ureq"]
# sha2 is a base (non-optional) dependency — used by the startup-cache key
# (@PLAN28) — so it is no longer listed as `dep:sha2` under `registry`.
registry     = ["dep:ureq", "dep:zip", "dep:tar", "dep:flate2", "dep:ed25519-dalek"]
# @PLAN53 cluster 2 / S4 — arm the homegrown stack-alignment guards (frame
# `stack_pos % 8` + per-access slot alignment).  Off by default → zero hot-path
# cost.  NOT gated on debug_assertions: [profile.dev.package.loft] disables
# those.  Run the aligned-stack work with `cargo test --features stack_align_guard`.
stack_align_guard = []
# Development aid — when set, `tests/testing.rs::Test::drop` writes each
# test's assembled loft source to `/tmp/loft-repro/<test_name>.loft`
# *before* running it, with a `fn main() { test(); }` tail appended so
# the file is directly runnable via `target/release/loft <path>`.  Useful
# for failing `issues.rs` / `expressions.rs` cases whose `code!`/`expr!`
# macros hide the full source — grab it off disk, run it standalone,
# iterate.  No runtime impact when the feature is off (default).
emit-repro   = []

[dependencies]
rand_core          = { version = "0.9", optional = true }
rand_pcg           = { version = "0.9", optional = true }
png                = { version = "0.17", optional = true }
fontdue            = { version = "0.9", optional = true }
mmap-storage       = { version = "0.10", optional = true }
crc32fast          = "1"
dirs               = "5"
wasm-bindgen       = { version = "0.2", optional = true }
serde              = { version = "1", optional = true, features = ["derive"] }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys             = { version = "0.3", optional = true }
web-sys            = { version = "0.3", optional = true, features = ["console"] }
rayon              = { version = "1.10", optional = true }
libloading         = { version = "0.8", optional = true }
loft-ffi           = { path = "loft-ffi" }
# @PLN117 — loft's main-thread-safe locks.  A direct dependency as well as a
# `[patch]` target: loft itself calls `set_can_block(false)` on the browser main
# thread, and the patch is what puts the same crate under rayon's spin locks.
wasm_sync          = { path = "wasm-sync", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
ureq               = { version = "2", optional = true }
zip                = { version = "2", optional = true, default-features = false, features = ["deflate"] }
tar                = { version = "0.4", optional = true }
flate2             = { version = "1", optional = true }
sha2               = { version = "0.10" }
ed25519-dalek      = { version = "2", optional = true, default-features = false, features = ["std"] }

# @PLN117 — rayon's `web_spin_lock` feature hard-codes a dependency on the
# crates.io `wasm_sync`, whose main-thread detection needs wasm-bindgen.  loft's
# raw browser wasm must not import wasm-bindgen at all (`--html` rejects such a
# bundle), so every build resolves `wasm_sync` to loft's own drop-in instead.
# Off wasm the replacement is a straight `std` pass-through, so native builds are
# unaffected whether or not the feature is on.
[patch.crates-io]
wasm_sync = { path = "wasm-sync" }

[target.'cfg(unix)'.dependencies]
libc               = "0.2"

# Line editor for the interactive REPL (arrow-key history, in-line editing).
# Non-wasm only: the browser playground supplies its own editing, and rustyline
# does not build for wasm32.  It reads the terminal directly; piped/file/test
# input uses the plain reader in src/repl.rs, so this never affects captured
# output.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline          = "14"

[dev-dependencies]
stdext = "0.3"
png    = "0.17"

[profile.test]
# Line tables only (`debug = 1`), the SAME value `[profile.dev]` sets below — and it
# must stay the same.  Cargo hashes a profile's VALUES, not its name, so `dev` and
# `test` share every artifact only while their settings are equal.  When this was 1
# and dev kept the default 2, every gate built all 267 test binaries TWICE: once for
# `cargo build --all-targets` (dev) and again for nextest (test) — 4m05s per CI
# shard, 1m13s per local `make ci`, and two copies of each binary on disk (197 MB
# and 93 MB for `wrap`).  Verified 2026-09-08 with `CARGO_PROFILE_DEV_DEBUG=1 cargo
# build --test wrap`, which wrote the test-profile artifact rather than a third one.
# @PLN159 phase A.
debug = 1

# Optimise the loft library and its dependencies even under
# `cargo test` (debug profile).  ⚠ `debug_assertions` do NOT stay on for
# the loft library — `[profile.dev.package.loft]` below turns them off and
# that reaches the test binaries too (measured 2026-08-25: the gated code
# is absent from `target/debug/deps/wrap-*`).  The leak-check survives
# because it is not gated at all, not because assertions are on.  What
# follows describes the intent for TEST CODE (`tests/*.rs`), where they
# genuinely are on.  Original note: (so the
# leak-check, addr/valid guards, and other safety nets that catch real
# bugs still fire), but the interpreter's hot inner loops
# (`Store::addr`, `Store::valid`, the opcode dispatch table) get
# inlined and devirtualised by LLVM.  Cuts loft-interpreter-heavy
# tests like `p122_gl_collision_struct_api` from ~67s to a few seconds.
# Test code itself stays at opt-level=0 so test compile time is
# unaffected (the test binaries themselves use [profile.test] above).
[profile.dev]
opt-level = 1
# Line tables only — equal to `[profile.test]` above so the two profiles share
# artifacts (see the note there).  Backtraces keep file:line; `profile.profiling`
# below is untouched.  For a one-off full-DWARF dev binary (variable inspection in
# gdb) use `CARGO_PROFILE_DEV_DEBUG=2 cargo build`, which does not change this file.
debug = 1

# Strip debug_assertions specifically inside the loft library when
# tests are being built.  The hot-path `Store::addr` / `Store::valid`
# / `keys::store` guards add ~270x overhead to interpreter-heavy
# tests like `p122_gl_collision_struct_api` (67s with vs ~250ms
# without).  The genuinely-load-bearing safety checks (the store
# leak-check `check_store_leaks`, the leak-budget panics, the
# LOFT_LOG-driven traces) are unaffected because they are NOT gated on
# `debug_assertions` — being a real `panic!` is not what saves them, not
# being behind the cfg is.  ⚠ This DOES disable all 93 `#[cfg(debug_assertions)]`
# items in `src/`, including `check_arg_ref_allocs`, `check_ref_leaks` and the
# `LOFT_MAX_OPS` hang guard, in `cargo build` AND `cargo test` — see
# `doc/claude/TESTING.md` § Hang guard for how to turn them back on.
# (The line reference this note used to carry, `src/state/debug.rs:1045`,
# had drifted onto unrelated dump code.)  Test code itself (`tests/*.rs`) still
# has debug_assertions on via [profile.test].
[profile.dev.package.loft]
debug-assertions = false

# `scripts/profile.sh` builds here — release code, but with the line tables a
# profiler needs to name a LINE rather than only a function.  Separate from
# `[profile.release]` on purpose: RELEASE.md pins a release binary's sha256 and
# `make speed` measures release, so adding debug info there would change the
# artifact both of those are about.
#
# `debug = 1` is line tables only (no per-variable info) — enough for
# `perf annotate` and a fraction of full DWARF's size.  `strip = false` is
# explicit rather than inherited, because a future `strip` on release would
# otherwise silently take the symbols away here too.
[profile.profiling]
inherits = "release"
debug    = 1
strip    = false

[package.metadata.deb]
maintainer = "Jurjen Stellingwerff <j.stellingwerff@gmail.com>"
copyright = " 2026, Jurjen Stellingwerff <j.stellingwerff@gmail.com>"
extended-description = """A simple to use scripting language with rust-like syntax"""
license-file = ["LICENSE"]
assets = [
    ["target/release/loft", "usr/bin/", "755"],
]
depends = "$auto"
section = "development"
priority = "optional"

[package.metadata.rpm]
name = "loft"
version = "$version"
license = "LGPL-3.0-or-later"
requires = ["libc"]
assets = [
    ["target/release/your_app_name", "/usr/bin/your_app_name", "755"]
]



[package.metadata.wasm-pack.profile.release]
# wasm-opt strips the externref table's max field, so
# __wbindgen_init_externref_table's `table.grow(4)` call fails at
# instantiation time with "Failed to grow table" in browsers and Node.
# Skip wasm-opt to keep the table descriptor intact; the ~30 % size
# increase is acceptable compared to a non-functional deployed site.
wasm-opt = false
