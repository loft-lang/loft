# Nightly view of UNMERGED branches across the loft-libs-* repos.
#
# Branches accumulate on the lib repos because PRs land there, not on loft (whose
# CI is 20+ min). This surfaces what is stranded, using the squash-safe CONTENT
# check in scripts/lib-branch-audit.sh (commit ancestry is unreliable under
# squash-merge). Two outputs: a job SUMMARY (informational, never fails) and the
# committed doc/claude/LIBRARY_BRANCHES.md, refreshed via an idempotent bot PR so
# the library documentation shows in-flight branches without anyone running a
# command. Fast: gh API + shallow clones, no compile.
name: Lib branch report

on:
  schedule:
    - cron: '0 7 * * *'   # nightly 07:00 UTC — after the miri (04:00) / CI nightlies
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # @PLN184 D1 — Python decodes files as UTF-8 on every runner (Windows defaults to cp1252).
  PYTHONUTF8: '1'

jobs:
  report:
    # @windows-exempt: platform-free — lists library branches
    name: Unmerged branches across loft-libs-*
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit lib branches (job summary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          out="$(bash scripts/lib-branch-audit.sh)"
          # Orphans = UNMERGED work with no OPEN pr (no-PR / closed / merged-with-extra).
          # An active PR line carries " open" (covers "open" and "open/draft").
          orphans="$(printf '%s\n' "$out" | awk 'index($0,"UNMERGED") && !index($0," open")')"
          n="$(printf '%s\n' "$orphans" | grep -c 'UNMERGED' || true)"
          {
            echo "# Unmerged branches on loft-libs-* — $(date -u +%Y-%m-%d)"
            echo
            echo "**${n} branch(es) hold unmerged work with no open PR** — the actionable orphans."
            if [ "${n}" -gt 0 ]; then
              echo
              echo '```'
              printf '%s\n' "$orphans"
              echo '```'
            fi
            echo
            echo "<details><summary>Full audit — every non-default branch, all seven repos</summary>"
            echo
            echo '```'
            printf '%s\n' "$out"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh the committed in-flight-branches doc
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/lib-branch-audit.sh --markdown doc/claude/LIBRARY_BRANCHES.md
      - name: Open / update the doc PR on change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          f=doc/claude/LIBRARY_BRANCHES.md
          # Idempotent: the doc has no timestamp, so it changes ONLY when the unmerged-branch
          # set changes -> no diff, no PR, no churn.
          if git diff --quiet -- "$f"; then
            echo "In-flight-branches doc unchanged — nothing to do."
            exit 0
          fi
          git config user.name "loft-catalogue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="lib-branches-refresh"
          git checkout -B "$branch" || exit 1
          git add "$f" || exit 1
          git commit -m "chore(@PLN112): refresh in-flight library-branches doc" || exit 1
          # The push is the step that must not fail: it is what preserves the refresh.
          git push -f origin "$branch" || exit 1
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR already open — updated by the force-push."
            exit 0
          fi
          if out="$(gh pr create --base main --head "$branch" \
              --title "chore(@PLN112): refresh in-flight library-branches doc" \
              --body "Automated refresh of \`doc/claude/LIBRARY_BRANCHES.md\` (unmerged branches across the loft-libs-* repos, squash-safe). Idempotent — this PR only exists because the in-flight branch set changed." 2>&1)"; then
            echo "$out"
            gh pr merge "$branch" --auto --squash || echo "auto-merge not enabled — PR left open for review."
            exit 0
          fi
          echo "$out"
          # "Allow GitHub Actions to create and approve pull requests" is a repo/org
          # SETTING, and with it off `createPullRequest` is refused however the workflow
          # is permissioned — so this nightly went red every night it had something to
          # report, which is the fastest way to teach everyone to ignore a nightly.
          # The refresh is NOT lost: the branch above is pushed, so opening the PR once
          # by hand makes every later run a force-push onto it (the branch above already
          # short-circuits on an open PR).  Surface the one command that does it and stay
          # green; any OTHER `gh pr create` failure is still a real red.
          if printf '%s' "$out" | grep -q 'not permitted to create or approve pull requests'; then
            {
              echo "### Library-branches doc refreshed on \`$branch\` — PR not opened"
              echo
              echo "\`gh pr create\` is refused by the repository setting *Allow GitHub"
              echo "Actions to create and approve pull requests*, so this run pushed the"
              echo "branch but could not open the PR. Nothing is lost. Either:"
              echo
              echo '```sh'
              echo "gh pr create --base main --head $branch \\"
              echo "  --title 'chore(@PLN112): refresh in-flight library-branches doc'"
              echo '```'
              echo
              echo "…once (later runs then force-push onto that PR), or enable the setting"
              echo "in Settings → Actions → General → Workflow permissions."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1
