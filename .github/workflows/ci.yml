name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily FULL run (03:00 UTC, clear of the 04:00 miri nightly).  Windows does
  # NOT run per-PR any more: the Windows leg costs ~30 min and almost never
  # regresses independently of the Linux/macOS legs that DO run per-PR.
  # push-to-main and this schedule run the WHOLE matrix on every OS, so Windows
  # is validated daily and on every merge; the non-required `Windows (daily)`
  # job mirrors the latest daily result onto each PR — visible, never blocking
  # (see that job + the `os` matrix in `changes`).
  schedule:
    - cron: '0 3 * * *'
  # Run the FULL matrix — macOS and Windows included — on any branch, on demand:
  #
  #   gh workflow run ci.yml --ref <branch> -f os=macos-latest
  #
  # Without this, the only ways to see a macOS result were push-to-main and the
  # daily schedule, so a macOS-only break could not be checked BEFORE merging
  # the thing that might fix it. The `Test (macos-latest)` job a PR shows is a
  # placeholder (macOS is off the PR matrix, as the notice it prints says), and
  # the two real per-PR macOS jobs — Miri-macOS and the ASan-macOS sweep — run
  # `--lib --test issues --test wrap --test strings --test frame_vars`, which
  # excludes `tests/native.rs`. A `#c` library declaration that resolved on
  # Linux and not on macOS therefore had no pre-merge signal at all, and sat
  # red on `main` (loft#739 neighbours, the `.so`/`.dylib` fallback).
  #
  # This is the macOS twin of `windows-probe.yml`, whose own comment gives the
  # reason: a 24-hour loop for a question you can usually answer in minutes.
  # A dispatch takes the same path as push-to-main, so it runs the non-PR
  # extras (stdlib round-trip, differential oracle) too — narrow it with `os`
  # when you only need one platform's answer.
  workflow_dispatch:
    inputs:
      os:
        description: 'Which runners: all, or one of ubuntu-latest / macos-latest / windows-latest'
        required: false
        default: 'all'
        type: choice
        options: [all, ubuntu-latest, macos-latest, windows-latest]
  # Called by `release-gate.yml`: one deliberate run of every nightly against ONE
  # commit, ending in one verdict (the release evidence — RELEASE.md § The nightlies).
  # A called workflow sees its CALLER's event, which is a dispatch or a probe push and
  # never `pull_request`, so it takes the same full path the schedule takes.
  # `os` mirrors the dispatch input so the gate can narrow to one platform's answer.
  workflow_call:
    inputs:
      os:
        description: 'Which runners: all, or one of ubuntu-latest / macos-latest / windows-latest'
        required: false
        default: 'all'
        type: string

# A new push to the same PR/branch obsoletes the running matrix — cancel it
# instead of letting both compete for runners (three stacked full runs in one
# evening turned a 20-minute matrix into an hour of queueing).  Never cancel
# main builds.  The group carries the CALLER's workflow name: under
# `release-gate.yml` this file runs as a leg of that run, and its group must not
# collide with — or cancel — a standalone run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Harden crate downloads against the transient crates.io HTTP/2 flake
  # ("[16] Error in the HTTP2 framing layer" → "download of <crate> failed"),
  # which red-flagged the Browser `make gallery` wasm-pack build (a cold
  # rustyline/unicode-width fetch).  Disabling HTTP/2 multiplexing forces the
  # reliable HTTP/1.1 path; the retry count covers brief blips.  Worth a few
  # seconds on cold fetches to stop a network blip from costing a PR re-run.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Incremental compilation is useless in CI (every job is a fresh checkout; the
  # restored cache is from a different commit, so source fingerprints miss
  # anyway) yet it bloats `target/` by ~1.8 GB of tiny files — the dominant cost
  # of the Windows cache-SAVE step (~7m vs ~50s on Linux, where compressing that
  # many small NTFS files is an order of magnitude slower).  Off → a much
  # smaller cache, faster save/restore on every OS, negligible build impact.
  # This keeps the deliberate `run_id` save-key (native-fixture persistence)
  # intact — it only removes the incremental bloat from what gets compressed.
  CARGO_INCREMENTAL: "0"
  # BUILD2: keep loft's native-test binary cache inside target/ so
  # actions/cache (which persists ~/.cargo + target/) carries it across runs.
  # The in-run binary cache is keyed on the rlib's CONTENT hash (mtime-stable
  # across the per-run `cargo build --release --lib` no-op rebuild), so warm
  # runs skip the ~565s of native recompiles instead of redoing them.
  LOFT_TMPDIR: ${{ github.workspace }}/target/loft-native-cache
  # Side-channel ledger directory for environmental test skips (tests that
  # passed-by-skipping for a toolchain/OS reason — e.g. Windows LNK1181).
  # nextest hides a passing test's stdout, so a skip is otherwise an
  # invisible green; the "Surface environmental test skips" step drains this
  # into annotations + a job summary so reduced coverage is never silent.
  LOFT_SKIP_LEDGER: ${{ github.workspace }}/target/loft-skip-ledger
  # Side-channel ledger for loft's OWN native-compile timing (the Timing
  # object): one TSV row per cdylib build / fixture rustc — kind, name,
  # hit|miss, seconds.  Inherited by the spawned loft children, so the
  # "loft internal timing" step can report WHERE the native phase spent
  # time (which cdylibs built vs restored, per-package seconds) on every PR
  # run — the inside view the per-step timing can't see.  Outside the cached
  # native dir so it is reset cleanly each run.
  LOFT_TIMING_LEDGER: ${{ github.workspace }}/target/loft-timing-ledger

jobs:
  # Classify the diff so docs-only changes skip the heavy jobs entirely
  # (a one-line .md fix used to re-run the whole ~25-minute matrix).  The
  # complementary `test-skip` job below reports the required per-OS
  # `Test (<os>)` contexts as green on a docs-only diff: a matrix job skipped
  # before expansion only posts the un-expanded `Test (${{ matrix.os }})`
  # name, so without the shim the three required contexts never appear and the
  # PR sits BLOCKED forever.
  changes:
    name: Classify diff
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      legs: ${{ steps.osmatrix.outputs.legs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Per-PR the test matrix is Linux + macOS only; Windows runs the FULL leg
      # daily (schedule) and on push-to-main, never on a PR (see the `on:`
      # comment + the `windows-daily-status` mirror).  Emitted as a JSON array so
      # the `test` job's matrix consumes it via fromJSON.
      - id: osmatrix
        shell: bash
        run: |
          # @CI_BUDGET — a PR runs the full suite on UBUNTU ONLY.
          #
          # macOS moves to the same footing Windows has had: it duplicated ubuntu's
          # 3481 tests exactly, cost ~50% more to do it (25m35s vs 24m26s AFTER the
          # phase-1 cut), and was the run's critical path.  Measured asymmetry was
          # not enough on its own — the platform-AGNOSTIC families total only ~412s,
          # so trimming them still left ~21m.
          #
          # What makes dropping it honest rather than a coverage cut is that the
          # macOS-specific risk is now gated per-PR by cheaper, targeted jobs: the
          # founding @P383 incident was ARM-only MEMORY corruption, and #646 put
          # Miri-macOS (1m29s) and the ASan-macOS UAF/OOB sweep (7m34s) on every PR.
          # A pure-interpreter test cannot fail on macOS alone; a memory bug can, and
          # that is exactly what those two catch — for 9 minutes instead of 25.
          #
          # The FULL macOS suite still runs on every push-to-main and on the daily
          # schedule, so a genuine macOS-only functional break surfaces within one
          # merge, never at release.  Same trade, same reasoning, as Windows.
          # A manual dispatch picks its own runners, so one platform's answer
          # costs one platform's time (see the `workflow_dispatch` note above).
          #
          # The PR leg is additionally SPLIT IN TWO, along the `heavy-serial` test
          # group boundary (@CI_BUDGET "Where the 31 minutes actually are").  That
          # group is 77 of 3937 tests and 57% of the suite's COLD wall clock: it is
          # `max-threads = 1`, so it cannot overlap itself, and cold it does not
          # overlap the other 3860 either — measured 226s + 174s = 398s, additive.
          # Run as two jobs they are concurrent, so the leg costs the LONGER of the
          # two rather than their sum.  Two earlier sharding attempts failed because
          # they cut ACROSS this group, putting a serial slot in every shard; cutting
          # ALONG it is the untried axis.  Only the PR path is split — push/nightly
          # keeps one job per OS, so its three required contexts are unchanged.
          # `inputs.os` is set by a dispatch or by the release gate's call and is
          # empty on every other event, so the test needs no event name.
          if [ -n "${{ inputs.os }}" ] && [ "${{ inputs.os }}" != "all" ]; then
            echo 'legs=[{"os":"${{ inputs.os }}"}]' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'legs=[{"os":"ubuntu-latest","shard":"heavy"},{"os":"ubuntu-latest","shard":"rest-a"},{"os":"ubuntu-latest","shard":"rest-b"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'legs=[{"os":"ubuntu-latest"},{"os":"macos-latest"},{"os":"windows-latest"}]' >> "$GITHUB_OUTPUT"
          fi
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Unknown base (new branch / force-push history rewrite) → run everything.
          if ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base"...HEAD | grep -qvE '^(doc/|\.claude/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only diff — heavy jobs skipped"
          fi

  # Hard gate: fail the PR when it cannot merge into the base branch (conflicts
  # / "rebase issues").  A real 3-way merge in memory via `git merge-tree
  # --write-tree` — exit 1 on conflict, 0 when clean (no working tree, no
  # commit).  Runs on EVERY PR (independent of the `changes` skip — a docs-only
  # PR can conflict too) and is fast (~seconds).  Flags genuine CONFLICTS only:
  # a branch that is merely BEHIND main but still merges cleanly passes.  Add
  # the `mergeable into main` context to branch protection's required checks so
  # a red here blocks merge.
  mergeable:
    name: mergeable into main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch tip — NOT the default `refs/pull/N/merge`, which GitHub
          # leaves stale when the PR conflicts (so it would false-green).
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify the PR merges into ${{ github.base_ref }} without conflicts
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git merge-tree --write-tree "origin/${{ github.base_ref }}" HEAD >/dev/null 2>&1; then
            echo "✓ merges cleanly into ${{ github.base_ref }}"
          else
            echo "::error title=Merge conflict::This PR conflicts with ${{ github.base_ref }}; rebase/merge it and resolve the conflicts before it can land."
            echo "Conflicting paths:"
            git merge-tree --write-tree --name-only "origin/${{ github.base_ref }}" HEAD | tail -n +2 || true
            exit 1
          fi

  # @PLN78 — a release is two halves, and only the GitHub half fails loudly.  If the
  # registry entry never lands, `loft self-update` just reports "nothing published"
  # forever and nobody is paged by a feature quietly not existing.  So the drift is
  # caught on the release-prep PR: shipping N+1 while N never reached the registry is
  # how the gap becomes permanent, because N's assets freeze at publish and a release
  # that missed its entry can often never get a correct one afterwards.
  #
  # Deliberately gated on that PR alone.  Red on EVERY PR for the window between
  # publish and registry-merge would be red for hours after each release, across work
  # that has nothing to do with it — which teaches everyone to merge past a red check.
  release-published:
    name: previous release reached the registry
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - name: Check the last release is fully published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-published.py

  # Shim for the complementary (docs-only) case — see the `changes` comment.
  # Emits the required per-OS `Test (<os>)` contexts as trivially green so branch
  # protection is satisfied without spinning up the real matrix.  Windows is NOT
  # listed: it is no longer a required per-PR context (validated daily instead —
  # see the `on:` comment), so there is nothing to shim for it.  Both legs run on
  # ubuntu: the matrix value names the check, never runs anything OS-specific.
  test-skip:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - run: echo "docs-only diff — ${{ matrix.os }} test matrix skipped; reporting green for branch protection"

  # `Test (windows-latest)` is a branch-protection REQUIRED check, but Windows is
  # validated DAILY now (off the per-PR matrix — see the `on:` comment), so on a
  # PR this job reports that context green as a non-blocking PLACEHOLDER: the
  # required check is satisfied without spending the ~30-min Windows leg, and the
  # LIVE Windows state is surfaced by the non-required `Windows (daily)` job below
  # (which goes RED when the last daily run failed).  To drop this placeholder,
  # remove `Test (windows-latest)` from branch protection's required contexts —
  # a repo-settings change; left required here so this needs no settings change.
  windows-pr-placeholder:
    name: Test (windows-latest)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Windows is validated DAILY (off the PR matrix). Live state in the 'Windows (daily)' check. This required context is a non-blocking placeholder on PRs."

  # Same placeholder, same reason, for macOS (@CI_BUDGET): the full macOS leg left
  # the PR matrix because it duplicated ubuntu at ~50% higher cost and WAS the
  # critical path.  The macOS-specific risk it actually carried — ARM-only memory
  # corruption, the @P383 class — is gated per-PR by Miri-macOS and the ASan-macOS
  # sweep instead, at 9 minutes rather than 25.  The full suite runs on every
  # push-to-main and daily.  Left required here so no branch-protection change is
  # needed; drop the context from the required set to retire this job.
  macos-pr-placeholder:
    name: Test (macos-latest)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "macOS full suite runs on push-to-main + daily (off the PR matrix). Per-PR macOS coverage is Miri-macOS + the ASan-macOS UAF/OOB sweep. This required context is a non-blocking placeholder on PRs."

  test:
    name: Test (${{ matrix.os }})${{ matrix.shard && format(' [{0}]', matrix.shard) || '' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # SHARDED ON THE PR PATH ONLY, and only along the `heavy-serial` boundary.
      # Two earlier strategies were measured and REVERTED; read both before
      # changing this, because each failed for a reason the next one has to answer.
      #
      # 1. HASH partitioning (nextest --partition): balances by test COUNT, so the
      #    slow integration tests piled into one shard — macOS shard1 6m vs shard2
      #    20m.  Wall-clock stayed at the slow shard; runner-minutes doubled.
      #
      # 2. DURATION-balanced split by binary (#647, reverted here).  It fixed the
      #    count-vs-duration flaw and still failed, for a different reason:
      #
      #      shard 1 (7 heavy binaries, 871 tests): 1778s work / 526s wall = 3.38 threads
      #      shard 2 (the other 151,   2608 tests): 1261s work / 733s wall = 1.72 threads
      #
      #    Shard 2 had LESS work and took LONGER.  Parallelism is a property of the
      #    TEST MIX, not of the runner: splitting scattered the single-slot
      #    `heavy-serial` group (n2_cdylib, n3_parity, n3_use_native, multiplayer_v2/v3,
      #    wasm_debug_relay — see .config/nextest.toml) across shards while `native`,
      #    its biggest member, went to the other one.  The shard left holding the most
      #    serial constraints and the least work became the long pole.  Net result:
      #    24m11s versus 24m26s unsharded — FIFTEEN SECONDS for double the minutes.
      #
      # The fixed per-job overhead is what sharding multiplies and never amortises:
      # ~5m build + ~3.5m cache restore/save = ~8.5 min before a test runs.  It is
      # still paid twice here — what changed is that the thing being bought is now
      # worth more than 15 seconds.
      #
      # 3. THIS ONE: cut ALONG the group boundary, so every single-slot group is one
      #    whole shard (120 tests) and its complement the other.  Both failures above
      #    have the same root — a single-slot group SCATTERED across shards pins every
      #    shard to a serial floor while the work divides unevenly.  A cut that keeps
      #    the groups intact is the axis neither tried.
      #
      #    ⚠ It first cut along `heavy-serial` ALONE, which fixed that for one group and
      #    left `html-wasm-serial` (139s over 32 tests, `max-threads = 1`) inside `rest`
      #    — the same defect one group over, in the shard that is the critical path.
      #    `ci_test_filter.py`'s boundary is now EVERY single-slot group, and the two
      #    groups stay separate in nextest.toml: which JOB a binary runs in is a
      #    different question from whether a rustc storm may run beside a server test.  Cold, the
      #    two sides are additive (226s + 174s = 398s measured), which is exactly
      #    the condition under which running them concurrently pays; warm they
      #    overlap and it would not.  CI is always cold.
      #
      # 4. AND `rest` SPLIT BY DURATION on top of that (2026-08-28).  Strategy 2 was
      #    exactly this and was reverted — but for a reason that no longer holds: it
      #    scattered the single-slot group.  Every such group now lives whole in `heavy`,
      #    so `rest` has nothing left to scatter, which is the axis none of the three
      #    tried.  Measured halves: 1317s / 16 binaries against 1285s / 200 (1.2 % apart);
      #    the heavy half is NAMED and the light half is its COMPLEMENT, so a binary added
      #    later still runs.  Verified an exact, disjoint 3-way partition — 120 + 1431 +
      #    1850 = 3401 = the unsharded count, pairwise overlaps 0.
      #
      #    ⚠ This buys wall clock with runner-minutes, and the fixed ~526s per job is paid
      #    a third time.  It is worth it only while `rest` is the critical path; if the
      #    three legs converge on `heavy`'s ~20m (which is mostly that fixed cost, not
      #    tests), the next lever is the build, not another shard.
      #
      # An ARCHIVE (cargo nextest archive, build once + reuse) was evaluated and
      # rejected: it SERIALISES the build ahead of the shards, so the projection
      # was 23.5 min against 21.5 for two concurrent builds — it trades wall clock
      # for runner-minutes, the opposite of the goal.  It also cannot carry the
      # auto-native tests, which shell out to `rustc --extern loft` and need
      # `target/release/deps` (1412 rlibs, 1.8 GB) that the archive omits.
      #
      # Legs come from `changes.legs`: two ubuntu shards per-PR (macOS + Windows are
      # daily + push-to-main, with placeholder contexts on PRs), all three unsharded
      # otherwise.  A leg with no `shard` key runs the whole suite.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.legs) }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Windows Defender real-time scanning inspects every artifact rustc and
      # link.exe write — inflating both the Build step and every per-test
      # `--native` compile.  Exclude the workspace + cargo/loft homes so the
      # scan skips them.  GitHub-hosted Windows runners run elevated, so
      # Add-MpPreference works; tolerate failure so a policy change can't red a
      # PR.
      - name: Exclude build dirs from Defender (Windows only)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.loft"

      # `.cargo/config.toml` activates the `mold` linker on
      # x86_64-unknown-linux-gnu for a unified cache + slightly faster
      # link.  Mac / Windows runners use different target triples and
      # ignore that config — no install needed there.
      # `libasound2-dev` provides the ALSA headers that `alsa-sys`
      # (transitive dep of `rodio` in lib/graphics/native) builds against;
      # without it the crystal_render gold tests fail to compile on Linux.
      # `xvfb` + `libgl1-mesa-dri` give a headless software-GL (llvmpipe)
      # display so the GL-render golden
      # (graphics_gold::crystal_editor_gl_matches_gold) can run; the canvas
      # goldens need no display.
      # `libsqlite3-0` is what the lazy DATABASE source (@F108) is tested
      # against: `tests/lazy_sql_source.rs` drives it through `c_call::resolve`,
      # so it needs the shared library at runtime and no headers.  It is
      # installed rather than assumed because those tests SELF-SKIP when the
      # library is absent — a runner image that stopped shipping it would retire
      # that whole suite without turning anything red.  The Linux test step
      # pairs this with `LOFT_REQUIRE_SQLITE=1`, which makes that skip a failure.
      # binaryen supplies `wasm-opt`, which every `--html` build shells out to.
      # Without it the html tests still BUILD — `wasm-opt` is optional and the
      # build only warns — but the page skips optimisation, and loft#954's
      # `--names` guard then has nothing to assert on: `--names` works by passing
      # `-g --strip-dwarf` to `wasm-opt` instead of `--strip-debug`, so with the
      # tool absent the named and plain pages come out the same size (2107 KB vs
      # 2106 KB on the run that caught this) and the name section never appears.
      - name: Install mold + ALSA + headless GL + sqlite + binaryen (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold libasound2-dev xvfb libgl1-mesa-dri libsqlite3-0 binaryen

      # The native-fixture binary cache lives in `target/loft-native-cache`
      # (keyed INSIDE loft on the libloft.rlib content hash — see
      # native_utils::native_cache_key).  Its persistence was broken: the
      # actions/cache key was Cargo.lock-only, so a PR that changed lib SOURCE
      # (not Cargo.lock) rebuilt every fixture (rlib bytes changed → loft
      # correctly invalidated) but then could NOT save — the Cargo.lock key
      # already existed, and actions/cache skips save on an existing key.  The
      # rebuilt-and-validated binaries were discarded, so the NEXT run
      # restored the stale cache and rebuilt again (~15m, every run).
      #
      # Fix: a unique save key per job per run (run_id + job-index — the two
      # shards of one OS would otherwise collide on the same key).  Save now
      # always happens; restore falls back through prefix keys — same OS+shard
      # first (its own fixture set), then any same-OS, then any.  A run that
      # rebuilds fixtures now persists them, so a re-run / the merge-to-main
      # run / a follow-up non-rlib push restores them WARM.
      # `~/.loft/build-cache` holds the built NATIVE cdylibs (graphics, glb,
      # mesh3d, …) — the actual native-phase bottleneck (graphics alone is
      # ~80-90s of cargo build, and on the cold suite run graphics rebuilds
      # several times before the cache populates).  They link the PUBLISHED
      # `loft-ffi` (not the local rlib), so they are stable across loft source
      # changes — caching them is safe and they stay warm until a package
      # version bumps (loft's own build-cache keying rebuilds a changed package
      # even from a restored cache).  (A fixture rustc link is ~0.3s measured,
      # so combining fixtures would save <90s — the cdylib builds are the
      # minutes.)
      #
      # `~/.loft/registry` (the EXTRACTED package sources) is deliberately NOT
      # cached: on Windows, restoring that dir leaves files in place and loft's
      # tar unpack then fails to overwrite them through the `\\?\` verbatim path
      # (`failed to unpack …web-0.1.1\README.md` → `use server` won't resolve →
      # the multiplayer server never starts).  Re-extracting from scratch each
      # run works on every OS and costs only the small-tarball unpack — the
      # build-cache above is where the real time is.
      # `registry/src` + `git/checkouts` are EXCLUDED: they are the *extracted*
      # crate / git sources, regenerated on demand from `registry/cache/*.crate`
      # and `git/db`.  Caching them doubles the small-file work (restore writes
      # them, save re-reads them), and small NTFS files are the Windows tar long
      # pole — dropping them halves it.  cargo re-extracts on first use (a write
      # the build does anyway when they are absent), so it is a net win on
      # Windows and neutral elsewhere.
      #
      # Two variants, split by OS, because `target/` behaves opposite ways:
      #
      #   - non-Windows: keep `target/` — ext4 compresses it cheaply (~50s
      #     save) and a warm restore skips the dep recompile.
      #   - Windows: DROP `target/`.  Measured at ~4.5 GB; the GitHub cache
      #     budget is 10 GB/repo and the key is unique-per-run (`run_id`), so
      #     3 OSes × ~4.5 GB blows the cap every run → the entries LRU-evict
      #     before they can ever be restored (confirmed: the Windows leg hits
      #     a full cache MISS every run, i.e. caching was effectively dead).
      #     On top of that, compressing the millions of small NTFS files in
      #     `target/` costs ~9 min on the save step EVERY run, hit or miss.
      #     Dropping `target/` removes that 9-min tax AND shrinks the Windows
      #     cache to a few hundred MB (registry + cdylib build-cache), small
      #     enough to survive eviction and actually restore warm — which is
      #     what makes the expensive native cdylibs (`~/.loft/build-cache`)
      #     persist.  The trade is a cold dep recompile (~9 min) each Windows
      #     run; net Windows wall-clock still drops sharply (~30m → ~13m) once
      #     paired with the focused PR test set below.
      # RESTORE-only, with the save moved to the end of the job (see "Save cargo
      # cache" below).  The two PR shards run on the same OS in the same run, so
      # they compute the SAME key — and with a combined restore+save the faster
      # `rest` shard reaches its post-step first, takes the key, and the `heavy`
      # shard's save is skipped as already-existing.  That is the wrong way round:
      # `~/.loft/build-cache` and `target/loft-native-cache` are populated by the
      # native compiles that the `heavy-serial` group does almost all of, so the
      # leg whose artifacts matter would be the one that never persists them, and
      # the serial floor this split exists to shorten would stay permanently cold.
      - name: Restore cargo registry and build (non-Windows — keeps target/)
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.loft/build-cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-
      # Drops target/'s BULK (the 4.5 GB dep/build artefacts + the ~9-min NTFS
      # save) but KEEPS `target/loft-native-cache` — loft's native-test binary
      # cache (`LOFT_TMPDIR`, env above), keyed on the libloft.rlib content hash.
      # Dropping ALL of target/ (the first cut of this change) also dropped this,
      # so every per-test `--native` compile went cold and the Test step ballooned
      # ~700s → ~1200s, eating the cache-save win (measured on PR #413's Windows
      # leg).  This sub-path is small, so the Windows cache still fits under the
      # 10 GB eviction budget AND the test phase restores warm on repeat runs.
      - name: Restore cargo registry and build (Windows — drops target/ bulk, keeps native-test cache)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.loft/build-cache
            target/loft-native-cache
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets

      # Defensive build step: some integration tests spawn
      # `target/release/loft` directly (e.g. via Command::new helpers)
      # and assume the release binary exists.  `cargo build
      # --all-targets` builds dev profile only.
      #
      # `--lib` ensures the canonical `target/release/libloft.rlib`
      # is built (cargo only places the canonical artifact when
      # `--lib` is explicit; `--bin loft` alone only puts the
      # hashed version in `target/release/deps/`).  Without the
      # canonical lib, loft's `--native` mode falls back to the
      # deps directory and rustc can't resolve transitive deps
      # like rand_core (E0463 on macOS/Windows).
      - name: Build (release loft binary + lib for integration tests)
        run: cargo build --release --lib --bin loft

      # @P229 G3 reliability fix: pre-build every native lib package
      # SEQUENTIALLY here, before the parallel nextest run.  Root cause: tests
      # that run `loft --native`/`--check` call `auto_build_native`, which runs
      # an UNLOCKED `cargo build` that re-resolves the whole dep tree
      # ("Locking N packages / Adding ureq …").  Under parallel nextest, many
      # of these fire at once, churning the shared ~/.cargo + target while a
      # standalone `--check --lib lib` rustc link needs ureq/rustls rlibs →
      # "required to be available in rlib format" (G3).  Pre-building here means
      # `auto_build_native` sees the rlibs already exist and is a no-op during
      # the suite — no concurrent re-resolution.  Same command + manifest
      # `auto_build_native` uses, so the artefacts match.
      - name: Pre-build native lib packages (avoid concurrent auto_build — G3)
        # RESTORED 2026-08-28 at the new location.  The monorepo native libs moved to
        # their chunk repos (@PLAN12 5b) and this step became a stub — but the thing it
        # prevented came back with them.  A test that `use`s a native-backed package calls
        # `auto_build_native`, which takes ONE global exclusive lock around its cargo
        # build, so under parallel nextest many processes queue on it WHILE HOLDING a
        # runner slot.  Measured on `tuxedo-work-2026-08-28`: 13 cdylibs rebuilding
        # mid-suite and 85.1s of lock wait, worst single wait 26.9s — and a fresh loft
        # binary stamps every cdylib stale, so this happens on every run, not rarely.
        #
        # Two halves, because the packages now live in two places:
        #   in-tree  `tests/lib/*/native` — still here, still needed by the loader tests;
        #   installed `~/.loft/registry/<pkg>-<ver>/native` — the new location, built into
        #            `~/.loft/build-cache/<pkg>-<ver>/` by the 6b redirect.
        #
        # The second half goes through `loft --prebuild-natives` rather than a shell loop
        # ON PURPOSE: the redirect (`native_target_root`) and the `[library] native` stem
        # would both have to be re-derived here, and a second spelling of where a cdylib
        # lands is exactly how this step would silently stop matching what the tests
        # resolve.  The flag calls the same `resolve_native_lib` they do.
        #
        # Best-effort: a package that fails to build here is not fatal — the test that
        # needs it retries and reports properly.  `|| true` keeps a warm-up from turning a
        # green suite red.
        #
        # `shell: bash` because this body IS bash — a glob `for`, `[ -f … ]`, a subshell and
        # `./target/release/loft`.  Windows defaults to PowerShell, which parses `for d in …`
        # as its own `for` and stops at *"Missing opening '(' after keyword 'for'"*, so the
        # step failed before running a single build and took `Install cargo-nextest` and
        # `Test` down with it.  Invisible until now only because the job died two steps
        # earlier, at Build.
        shell: bash
        run: |
          set -u
          # Half 1 — the in-tree native test packages, sequentially.
          for d in tests/lib/*/native; do
            [ -f "$d/Cargo.toml" ] || continue
            echo "prebuild (in-tree): $d"
            ( cd "$d" && cargo build --release -q ) || echo "  warn: $d failed — tests will retry"
          done
          # Half 2 — every installed registry package's cdylib, through the same
          # resolver the tests reach (so the artefact and its freshness stamp match).
          ./target/release/loft --prebuild-natives || true

      # no-default-features check only needs to run on one OS — ubuntu
      # covers it at a fraction of the Windows job's time.  Use `cargo
      # check`, NOT `cargo build`: a `build --no-default-features` rewrites
      # the canonical `target/debug/libloft.rlib` WITHOUT the
      # `native-extensions` feature, dropping `loft::native_call`.  The
      # native-library suite then spawns the debug `loft`, whose
      # `--native` codegen links that clobbered rlib and fails
      # `error[E0433]: cannot find native_call in loft` (Linux-only,
      # because this step is Linux-only).  `cargo check` validates the
      # no-default-features compile without producing the polluting rlib.
      - name: Check (no default features)
        if: runner.os == 'Linux'
        run: cargo check --no-default-features

      # The `html_wasm` / `--html` tests build a wasm32-unknown-unknown rlib
      # and compile against it.  Build it on ALL three OS: wasm32 is
      # host-independent, and GitHub's macOS/Windows runner images now SHIP the
      # wasm target pre-installed, so the test's "target not installed"
      # self-skip no longer fires there — `loft --html` runs and fails E0463
      # (rlib never built) instead of skipping.  Building everywhere closes
      # that gap and actually exercises `--html` cross-platform.
      - name: Install wasm target (for html_wasm tests)
        run: rustup target add wasm32-unknown-unknown

      - name: Build wasm rlib (for html_wasm tests)
        run: cargo build --release --target wasm32-unknown-unknown --lib --no-default-features --features random

      # graphics_gold tests skip on CI now that lib/graphics is extracted
      # — the gold-image comparison runs against the libloft_graphics_native.so
      # the test itself can't build because the monorepo no longer has the
      # graphics native source.  Re-enable if a future monorepo-side
      # smoke needs it.  (Phase 5b removed lib/graphics/.)
      - name: Build graphics native cdylib (Linux only) — stub
        if: false
        run: echo "graphics moved to loft-libs-graphics; skip"

      # cargo-nextest runs each test in its own process with better
      # scheduling than cargo test — typically 30-50 % faster on this
      # suite.  Tests that rely on WRAP_LOCK to serialise file-system
      # state still serialise per-process, but the rest parallelise
      # across cores.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Clear the ledgers restored from the cached target/ so the surface +
      # timing steps report only THIS run.
      - name: Reset ledgers
        shell: bash
        run: rm -rf "$LOFT_SKIP_LEDGER" "$LOFT_TIMING_LEDGER"

      - name: Test
        # `index_hygiene` and `viewer_markdown` are extracted to their own advisory
        # ubuntu jobs (and the nightly): both are platform-independent — a whole-repo
        # doc-link check, and the markdown renderer's HTML output — so there is no
        # value running them 3× in the required matrix.  `viewer_markdown` is also an
        # HTTP smoke test whose interpreted viewer gets starved by this suite's
        # parallel native-build load (empty response under contention), so it runs
        # ISOLATED in the `viewer-smoke` job where it's reliable.
        #
        # Windows runs the FULL set whenever it runs (push-to-main + the daily
        # schedule only — it is off the PR matrix entirely, see the `os` output
        # in `changes`).  The previous per-PR Windows focused-subset is gone with
        # the per-PR Windows leg: there is no Windows PR run left to trim.
        shell: bash
        env:
          # Linux installs libsqlite3 above, so the lazy database source's tests
          # have no excuse to self-skip there — and this turns the skip into a
          # failure, which is what makes a green Linux run EVIDENCE that they
          # ran rather than evidence that nothing complained.  Not set on
          # macOS/Windows: those resolve the library differently (or not at all),
          # and a skip there is surfaced by the ledger rather than enforced.
          LOFT_REQUIRE_SQLITE: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          # The exclusions and the shard boundary both live in the script — the
          # sharded PR legs and the unsharded push/nightly legs have to agree on
          # them, and a filter spelled twice drifts into a phantom flake.  It reads
          # the `heavy-serial` membership straight out of .config/nextest.toml
          # rather than restating it.
          FILTER="$(python3 scripts/ci_test_filter.py "${{ github.event_name }}" ${{ matrix.shard }})"
          # A PR run is FEEDBACK — stop at the first failure, the author fixes it
          # and pushes again, and the runner minutes go to the next PR.  The
          # nightly and push-to-main runs are REPORTS: they are nobody's inner
          # loop, and fail-fast makes them surface at most ONE break per run.
          # Windows pays for that worst of all — it runs on these events only, so
          # every Windows bug costs a whole night, and the 2026-07-21 nightly
          # stopped with 875 of 3029 tests unrun.  Drain the whole set instead.
          FAILFAST=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            FAILFAST="--no-fail-fast"
          fi
          echo "nextest filter: $FILTER${FAILFAST:+ (}${FAILFAST}${FAILFAST:+)}"
          cargo nextest run --profile ci $FAILFAST -E "$FILTER"

      # Browser-render cross-check (Chrome + SwiftShader): the GPU/headless-browser
      # tests demoted off the per-PR path just above.  Runs on the DAILY schedule +
      # push-to-main ONLY, Linux-only, retry-tolerant (the `ci` profile's retries=1),
      # so a real WebGL/asyncify regression is visible within a day without the flaky
      # browser render ever blocking a PR.  Self-skips cleanly when the runner has no
      # chrome/node (recorded in the skip ledger surfaced below).
      # The exhaustive stdlib round-trips, excluded from the suite filter above.  Runs
      # on push-to-main + the daily schedule, on EVERY platform in the matrix (the
      # serialiser is layout-sensitive, so an ARM/x86 difference is exactly the kind
      # of thing this pair exists to catch).  ~6m on macOS, ~5m on ubuntu, in
      # parallel with nothing else — it is the last thing this job does.
      #
      # `!cancelled()` rather than a bare event check, because this is the ONLY leg
      # that runs the pair: `ci_test_filter.py` excludes them everywhere else, so a
      # skip here means format stability went unverified on that push.  A step with
      # no `if:` is skipped when an earlier one fails, which is precisely what
      # happened while the Test step was red — three consecutive pushes reported
      # nothing about the round-trips at all.  A failure that is invisible is worse
      # than one that is loud, so this reports even when the suite above is already
      # failing.
      - name: Stdlib round-trip (the exhaustive pair, off the PR path)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        shell: bash
        run: >
          cargo nextest run --profile ci --no-fail-fast
          -E 'test(stdlib_load_compares_equal_to_fresh) or test(stdlib_whole_data_round_trip)'

      # `html_render` is NOT run here: it gates the committed
      # `doc/brick-buster.html`, and this job never rebuilds it, so the artefact is
      # always older than the wasm rlib built above and the test always self-skips.
      # It ran in the `gallery` job instead, right after `make game` produces a fresh
      # bundle (and where binaryen supplies the `wasm-opt` that build needs).
      # `html_asyncify` builds its own artefact, so it belongs here.
      - name: Browser asyncify (nightly — off the flaky PR path)
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: cargo nextest run --profile ci -E 'binary(html_asyncify)'

      # @PLN89 differential oracle (formal/operational.md D-op-1/2): the full
      # cross-backend agreement sweep — every `tests/oracle/*.loft` run on BOTH
      # backends, asserting value / halt / leak AND accept-vs-reject (driver)
      # agreement across `--dump` / `--interpret` / `--native`.  It is `#[ignore]`
      # in the default suite (rustc per program is too heavy for the per-PR path),
      # so it runs HERE on the DAILY schedule + push-to-main ONLY — never on a PR —
      # and Linux-only (the comparison is platform-independent, no value 3×).  A
      # caught divergence fails the nightly, visible within a day and off the PR
      # critical path.  This is the automatic gate for the oracle that the manual
      # `-- --ignored` run was standing in for.
      # Headless-WASM toolchain for the oracle's THIRD backend (wasm32-wasip2 / wasmtime).
      # The oracle's wasm leg self-skips without these, so installing them is what makes
      # interp == native == WASM an actual nightly gate (the lib-tested-on-3-backends gap).
      # Nightly + push-to-main only, Linux only — mirrors the oracle step below.
      - name: Install wasip2 target (oracle wasm leg)
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        run: rustup target add wasm32-wasip2
      - name: Install wasmtime (oracle wasm leg)
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: wasmtime

      - name: Differential oracle (nightly cross-backend sweep)
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: cargo test --release --test differential_oracle -- --ignored --nocapture

      # A test that passed only on retry (`retries = 1` in the ci profile) is
      # a FINDING, not noise: the retry converted an intermittent real bug
      # into a green run (the scratch-reclaimer race was nearly invisible this
      # way — one test happened to fail both tries).  Surface every flaky pass
      # as a workflow warning so it lands on the PR checks page.
      - name: Surface flaky tests (passed only on retry)
        if: always()
        shell: bash
        run: |
          python3 - <<'EOF'
          import pathlib
          import xml.etree.ElementTree as ET
          # nextest resolves the junit `path` relative to the profile's STORE dir
          # (`target/nextest/<profile>/`), so glob for it rather than spelling a
          # path that looks repo-rooted but isn't — the previous
          # `target/nextest/junit.xml` never matched, and the silent exit below
          # meant this step reported nothing for its entire life.
          p = next(iter(sorted(pathlib.Path("target/nextest").glob("*/junit.xml"))), None)
          if p is None:
              # NEVER silent: a detector that cannot find its input must say so,
              # or "no flaky tests" and "no report" look identical.
              print("::warning title=Flaky detection did not run::no nextest JUnit report "
                    "under target/nextest/*/junit.xml — flaky passes were NOT checked")
              raise SystemExit(0)
          root = ET.fromstring(p.read_text())
          for tc in root.iter("testcase"):
              if any(c.tag in ("flakyFailure", "rerunFailure") for c in tc):
                  name = f"{tc.get('classname', '?')}::{tc.get('name', '?')}"
                  print(f"::warning title=Flaky test (passed only on retry)::{name} — "
                        "a retried pass can mask a real intermittent bug; treat as a finding")
          EOF

      # Drain the environmental-skip ledger (written by tests that
      # passed-by-skipping for a toolchain/OS reason) into annotations + a job
      # summary, so a green run never hides reduced coverage.  Does NOT fail
      # the job — these skips are known-environmental (e.g. Windows LNK1181);
      # the point is visibility, not blocking.  A regression that makes MORE
      # tests skip then shows up as new annotations.
      - name: Surface environmental test skips
        if: always()
        shell: bash
        run: |
          dir="$LOFT_SKIP_LEDGER"
          [ -d "$dir" ] || { echo "no environmental skips this run"; exit 0; }
          n=0
          {
            echo "### Environmental test skips (green, but coverage was reduced)"
            echo
            echo "| Suite | Reason | Test | Detail |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in "$dir"/*.tsv; do
            [ -e "$f" ] || continue
            while IFS=$'\t' read -r suite reason test detail; do
              [ -z "$suite" ] && continue
              n=$((n + 1))
              echo "::warning title=Environmental skip ($reason)::$suite: $test — $detail"
              echo "| $suite | $reason | $test | ${detail} |" >> "$GITHUB_STEP_SUMMARY"
            done < "$f"
          done
          echo "$n environmental skip(s) surfaced (annotations + job summary)."

      # loft's OWN per-event native-compile timing (the Timing object): the
      # inside view of where the native phase spent time on THIS run — which
      # cdylibs built (miss) vs restored (hit), per-package seconds, and the
      # fixture rustc total.  Statistics on every PR run, not just the manual
      # ci-probe.  Never fails the job — pure reporting.
      - name: loft internal native-compile timing
        if: always()
        shell: bash
        run: |
          dir="$LOFT_TIMING_LEDGER"
          if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
            echo "no loft timing ledger this run"; exit 0
          fi
          all=$(cat "$dir"/*.tsv)
          {
            echo "### loft internal native-compile timing (${{ matrix.os }})"
            echo
            echo "| cdylib | builds (miss) | restored (hit) | build secs |"
            echo "|---|---:|---:|---:|"
            for pkg in $(echo "$all" | awk -F'\t' '$1=="cdylib"{print $2}' | sort -u); do
              miss=$(echo "$all" | awk -F'\t' -v p="$pkg" '$1=="cdylib"&&$2==p&&$3=="miss"' | wc -l)
              hit=$(echo "$all" | awk -F'\t' -v p="$pkg" '$1=="cdylib"&&$2==p&&$3=="hit"' | wc -l)
              secs=$(echo "$all" | awk -F'\t' -v p="$pkg" '$1=="cdylib"&&$2==p{s+=$4} END{printf "%.1f", s}')
              printf '| %s | %s | %s | %s |\n' "$pkg" "$miss" "$hit" "$secs"
            done
            fixn=$(echo "$all" | awk -F'\t' '$1=="fixture"' | wc -l)
            fixs=$(echo "$all" | awk -F'\t' '$1=="fixture"{s+=$4} END{printf "%.1f", s}')
            echo
            echo "**fixtures:** ${fixn} compiled, ${fixs}s total rustc"
            # Build-lock contention — the prime suspect for a multiplayer TMT.
            # Each ledger file is one pid (timing-<pid>.tsv), so a file with
            # more `lockwait` rows than `lockheld` = a process that blocked on
            # the global build-lock and was KILLED before acquiring it (or is
            # still stuck): the exact shape of a 600s hang behind another
            # process's cold build.  `longest acquired wait` shows how bad the
            # contention got for the builds that DID get through.
            maxwait=$(echo "$all" | awk -F'\t' '$1=="lockheld"{if($4>m)m=$4} END{printf "%.1f", m+0}')
            stuck=0
            for f in "$dir"/*.tsv; do
              lw=$(awk -F'\t' '$1=="lockwait"' "$f" | wc -l)
              lh=$(awk -F'\t' '$1=="lockheld"' "$f" | wc -l)
              [ "$lw" -gt "$lh" ] && stuck=$(( stuck + 1 ))
            done
            echo
            echo "**build-lock:** longest acquired wait ${maxwait}s · ${stuck} process(es) killed/stuck while waiting (never acquired)"
            # Wasted rebuilds — the cdylib-cache headline cost.  A `cdylibstale`
            # event = a cached cdylib REJECTED on a fingerprint mismatch and
            # rebuilt (vs a genuine cold miss).  The event name is
            # `<pkg>|stamped=<fp>|cur=<fp>`; sum the `cdylib miss` seconds of the
            # rejected packages = time reclaimable by re-keying the gate on the
            # stable published loft-ffi version instead of the libloft.rlib hash.
            # A `cur=` that changes between two runs of the SAME commit would mean
            # a second, non-reproducible-build instability on top of the
            # per-commit flip.
            stalen=$(echo "$all" | awk -F'\t' '$1=="cdylibstale"' | wc -l)
            wasted=$(echo "$all" | awk -F'\t' '
              $1=="cdylibstale"{split($2,a,"|"); stale[a[1]]=1}
              $1=="cdylib"&&$3=="miss"{secs[$2]+=$4}
              END{w=0; for(p in stale) w+=secs[p]; printf "%.1f", w}')
            echo
            echo "**stale cdylib rebuilds:** ${stalen} cached-but-fingerprint-rejected = ${wasted}s wasted"
            echo "$all" | awk -F'\t' '$1=="cdylibstale"{print "  - "$2}' | sort -u
          } >> "$GITHUB_STEP_SUMMARY"
          echo "===== loft timing (cdylib) ====="; echo "$all" | awk -F'\t' '$1=="cdylib"' | sort | uniq -c
          echo "===== loft timing (build-lock) ====="; echo "$all" | awk -F'\t' '$1=="lockwait"||$1=="lockheld"' | sort | uniq -c
          echo "===== loft timing (stale cdylib rebuilds, with fp) ====="; echo "$all" | awk -F'\t' '$1=="cdylibstale"{print $2}' | sort | uniq -c

      # BUILD2: reap ABANDONED native-binary cache entries.  Each fixture keeps
      # a single fixed-named binary (overwritten on change, not duplicated), so
      # the live set is self-bounding (~300 binaries, ~300MB); the dir only
      # creeps when a fixture is deleted/renamed and leaves an orphan.  The
      # cache-HIT path touches each binary's mtime (see compile_native_job), so
      # mtime = last-USE: a 30-day threshold reaps only genuinely-dead orphans
      # and can never delete a binary the suite still hits (even fixtures that
      # run on only one OS are touched well within 30 days).  Deliberately NOT
      # an aggressive per-run prune — that would delete long-lived warm entries
      # whose whole purpose is to survive across runs.  Best-effort; skipped on
      # Windows (find(1) differs) — the Linux/macOS runs keep the shared dir
      # trimmed for everyone.
      - name: Reap abandoned native-binary cache entries
        if: runner.os != 'Windows'
        continue-on-error: true
        run: find "${{ github.workspace }}/target/loft-native-cache" -type f -mtime +30 -delete || true

      # The save half of the restore steps above.  Exactly ONE leg per (os, run)
      # may write the run-scoped key, and on a sharded PR that leg is `heavy`: it
      # holds the native-compile caches, and it is the long pole whose warmth is
      # the whole point of the split.  An unsharded leg (`shard` unset — every
      # push/nightly/dispatch leg, and every non-ubuntu one) saves as before.
      # Accepted trade: native artifacts that only `rest` produces are not
      # persisted, so those recompile each run.  One cache lineage is kept rather
      # than two because `target/` is the bulk of it and a second copy competes
      # for the repo's 10 GB eviction budget with seven other job caches.  If
      # `rest` is later seen drifting slower run-over-run, that is the thing to
      # revisit — measure it, do not assume it.
      #
      # Saves on RED as well as green — a failing test must not throw away a cold
      # build, or every red PR pays the full rebuild on its next push.  But NOT on
      # cancelled: `cancel-in-progress` kills the previous run on every new push,
      # and that run's `target/` is mid-build.  The key is run-scoped, so a partial
      # tree saved there becomes the newest prefix match and would be restored by
      # everything after it — `always()` would quietly poison the cache lineage.
      - name: Save cargo cache
        if: "!cancelled() && (matrix.shard == '' || matrix.shard == 'heavy')"
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.loft/build-cache
            ${{ runner.os == 'Windows' && 'target/loft-native-cache' || 'target' }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}

  # `Test (ubuntu-latest)` is a branch-protection REQUIRED context, and on a PR no
  # single job produces it any more — the leg is three shards (`[heavy]`, `[rest-a]`,
  # `[rest-b]`).  `needs.test.result` aggregates every matrix cell, so adding a shard
  # needs no change here.
  # Renaming the required context would mean a repo-settings change that blocks
  # every open PR the moment it lands and unblocks nothing if the split is later
  # reverted, so the shards report under their own names and this job re-publishes
  # the required one from their combined result.
  #
  # Attribution is exact because the PR matrix is ubuntu-ONLY: `needs.test.result`
  # aggregates precisely the two ubuntu shards and nothing else.  That is also why
  # the split stops at the PR path — on push/nightly the matrix spans three OSes,
  # `needs` cannot address individual matrix CELLS, and one aggregate result would
  # red all three contexts over one platform's failure.
  #
  # `always()` so a failed shard reaches the check instead of skipping it (a
  # skipped required check is not a red one).  Mirrors `test`'s `code == 'true'`
  # condition so it stays mutually exclusive with the `test-skip` shim, which
  # publishes this same context on a docs-only diff.
  test-pr-gate:
    name: Test (ubuntu-latest)
    needs: [changes, test]
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "heavy + rest-a + rest-b shards: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]

  # @PLAN53 — the cheap per-PR sanitizer.  `stack_align_guard` asserts every
  # typed eval-stack access lands on its alignment boundary; it runs at normal
  # test speed (just offset checks), so it is the per-PR gate for the
  # alignment-UB class — the class a stack/codegen change is most likely to
  # regress.  The heavier Miri hard-UB sweep (UAF/uninit/leak/OOB) runs NIGHTLY
  # (see miri.yml), not per-PR.  Ubuntu-only: the guard is an arch-independent
  # offset check, so one platform suffices.  Only the in-process interpreter
  # suites are run — the guard cannot see the separate binaries that native /
  # wasm / html tests spawn, so running those here would add cost without
  # coverage.
  guard:
    name: stack_align_guard sweep (ubuntu)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-guard-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ubuntu-guard-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ubuntu-guard-cargo-
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # Goal A wants the guard silent across EVERY test binary — but it only
      # fires IN-PROCESS: a test that shells out to a spawned `--native`/`--wasm`
      # binary (every `cross_mode!` matrix cell, the mixed-boundary suites) runs
      # the guarded code in a child the sweep can't observe (see
      # `tests/n3_parity.rs` — "the stack_align_guard sweep can't see spawned
      # binaries").  So the reachable corpus is the in-process interpreter test
      # binaries.  This sweep runs 16 of them, NOT all: `tests/data_structures.rs`
      # spawns nothing and is still absent, so the list below is a working set to
      # extend, not the whole reachable corpus.  `expressions` /
      # `expressions_auto_convert` (expression-eval eval-stack), `slots` /
      # `slot_v2_baseline` / `value_struct_alloc` (slot & value-struct layout),
      # `dispatch_reentry`, and `format` join `issues`/`wrap`/`strings`/
      # `frame_vars` — each verified zero-fires under the feature.
      #
      # `wrap::library_suite` stays excluded: it builds/runs the lib/* NATIVE
      # suites (graphics/moros_*/shapes FFI), which need the GL/ALSA +
      # graphics-cdylib build-prep this lean job omits — and the guard can't see
      # those spawned native builds anyway; the full lib suite runs in `test`.
      # @PLN114 — the cross-mode matrices join the sweep.  They are the suites most
      # likely to trip an alignment fault (every cell builds a tuple and passes it
      # across a call on both backends), and the guard was blind to them because this
      # list is fixed and they were `#[ignore]`d.  Two SIGSEGVs, a silent `+1`
      # corruption and a par-worker corruption lived behind that gap.  ~10s for all
      # 201 cells.
      - name: Guard sweep (interpreter suites, zero fires expected)
        run: >
          cargo nextest run --profile ci --features stack_align_guard
          --lib --test issues --test wrap --test strings --test frame_vars
          --test expressions --test expressions_auto_convert --test slots
          --test slot_v2_baseline --test value_struct_alloc --test dispatch_reentry
          --test tuple_matrix --test closure_matrix --test mut_closure_matrix
          --test template_matrix --test coroutine_matrix --test binary_io_matrix
          -E 'not test(library_suite)'

  # Doc-index hygiene (plan-37) — `make index` + broken `@`-tag / markdown-link
  # checks.  Extracted from the per-platform `Test` job because it is whole-repo
  # and platform-independent.  ADVISORY: like `guard`/`asan` it is NOT in the
  # required-status-checks list, so it runs and is visible on every PR (red when
  # a doc ref/link breaks) but never blocks the merge.  The authoritative daily
  # catch runs nightly (miri.yml).
  index-hygiene:
    name: doc index hygiene (ubuntu, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-hygiene-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ubuntu-hygiene-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ubuntu-hygiene-cargo-
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build host loft binary (required by `make index`)
        # The index_hygiene test shells out to `make index`, whose
        # Makefile guard (`if [ ! -x target/release/loft ]`) demands a
        # pre-built release binary — nextest only compiles the test
        # binary, not `target/release/loft`.  Without this step the test
        # panics with `make index exited 2 / host loft binary missing`.
        run: cargo build --release --bin loft
      - name: Index hygiene (broken @-tags + markdown links)
        run: cargo nextest run --profile ci -E 'binary(index_hygiene)'
      - name: Feature-catalogue shadow in sync (@PLN92 strand 3)
        # Regenerates doc/features/ + tests/docs/features/ from the committed
        # index/features.json snapshot and fails on any diff — the no-drift
        # guard.  Reuses the release loft binary built above.  Advisory (this
        # whole job is), so drift shows red without blocking merge.
        run: make features-check

  # WASM node bridge — build the wasm-pack nodejs bundle and RUN the binary-I/O
  # bridge tests (tests/wasm/bridge.test.mjs).  The per-platform `Test` job's
  # `wasm_compile_and_run_smoke` self-SKIPS whenever tests/wasm/pkg/ is absent —
  # which is EVERY run, because nothing built it — so its green was a silent skip,
  # not a pass.  That silent skip hid that several bridge programs had rotted onto
  # the REMOVED `Nl` long-literal suffix (`42l`) and the old `Format.BigEndian`
  # spelling, so they no longer parsed and the wasm binary-I/O surface went
  # untested.  The programs are now ported to current syntax (bare `BigEndian`,
  # `f += … as i32`, plain int offsets); this job builds the bundle so they
  # actually RUN in CI and stay honest.  ADVISORY (not in required-status-checks):
  # visible on every PR without blocking; promote to required once it has proven
  # stable.  (The seeded-`rand` case was dropped — `rand` moved to the `random`
  # library, @PLAN12, and is not in the core bundle these tests drive.)
  wasm-bridge:
    name: wasm node bridge (ubuntu, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl -sSLf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build the node bridge bundle
        run: wasm-pack build --target nodejs --out-dir tests/wasm/pkg -- --no-default-features --features wasm
      - name: Run WASM bridge tests
        run: node tests/wasm/bridge.test.mjs

      # @PLN13 phase 5 — the browser half of script mode.  `tests/script_mode.rs`
      # covers the interpreter and `--native`; this covers the path the playground
      # actually uses (`compile_and_run` applying `script::script_desugar`), which
      # is the whole no-install funnel and was previously unguarded.
      - name: Run WASM script-mode tests
        run: node tests/wasm/script.test.mjs

  # Browser-bundle freshness — a change set that edits a committed browser
  # bundle's SOURCE (currently the Brick Buster .loft) must rebuild + commit the
  # bundle in the SAME set, or the deployed website goes stale — the recurring
  # failure documented in doc/claude/GALLERY_CI.md, and the reason the featured
  # doc/brick-buster.html has drifted behind its source before.  Deterministic +
  # git-only (no build, so it can NEVER flake on wasm build non-determinism, unlike
  # a byte-diff of a rebuilt bundle) and PR-scoped (fails only a set that itself
  # introduces staleness, never an innocent PR).  ADVISORY: not in the
  # required-status-checks list, so it shows red without blocking the merge until
  # an admin promotes it to required.  Catches staleness a change INTRODUCES; the
  # existing stale-bundle debt is a one-off rebuild (release checklist item B).
  bundle-fresh:
    name: browser bundle freshness (ubuntu, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Committed browser bundle rebuilt when its source changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            git fetch --no-tags origin main >/dev/null 2>&1 || true
            base="origin/main"
          fi
          scripts/check_bundle_fresh.sh "$base"

  # Markdown-renderer smoke test (the loft-view HTTP renderer).  Extracted from
  # the per-platform `Test` matrix: it tests platform-independent rendering (no
  # value running it 3×), and it is an HTTP smoke test whose interpreted viewer
  # gets starved by the full suite's parallel native-build load (it returns an
  # empty body under contention) — so it runs ISOLATED here (no contention →
  # reliable).  ADVISORY: not in the required-status-checks list, so a real
  # renderer regression shows red without blocking the merge (the rendering logic
  # is also covered by the lib/markdown unit tests in the required `Test` job).
  viewer-smoke:
    name: markdown viewer smoke (ubuntu, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-viewer-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ubuntu-viewer-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ubuntu-viewer-cargo-
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # The viewer test spawns `target/release/loft`; build it or the test skips.
      - name: Build release loft binary
        run: cargo build --release --bin loft
      - name: Markdown viewer smoke (isolated — no native-build contention)
        run: cargo nextest run --profile ci -E 'binary(viewer_markdown)'

  fixtures-check:
    name: lib fixtures vs pinned tags (ubuntu, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tests/fixtures/libs/ match sync-fixtures.sh PINNED_REFS
        # Clones each pinned <chunk>@<tag> and diffs the in-repo fixture against
        # it.  Advisory (not a required check): drift surfaces on the PR but does
        # not block — external chunk-repo availability is outside this repo's
        # control.  When the drift is intentional (a dogfood lib shipped a new
        # version), bump PINNED_REFS + re-sync in the same PR — see
        # LIBRARY_AUTHORING.md § 5d.
        run: scripts/sync-fixtures.sh --check

  fixtures-unreleased:
    name: fixture files the canonical repo lacks (ubuntu, GATED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refuse an undeclared fixture-only file
        # GATED, unlike `fixtures-check` above, and the split is deliberate.  A
        # fixture merely BEHIND its pinned tag is recoverable by re-syncing, so
        # that stays advisory.  A file the canonical repo has NEVER had is not
        # recoverable from anywhere: an installed package silently lacks whatever
        # it provides, while the fixture's own tests stay green and say nothing.
        # @PLN106's Android GL backend sat in the fixture proving the fixture,
        # while `loft install graphics` had no Android at all.
        #
        # Declaring the file in UNRELEASED_FILES (with a tracking ref) passes; a
        # row without a ref is refused, because knowing about it is what the
        # previous arrangement already had.  A chunk repo being unreachable
        # SKIPS with exit 0 — this must go red for a finding, never for someone
        # else's outage, which is the reason `fixtures-check` is advisory.
        #
        # ⚠ Add this job to branch protection's required checks — the YAML
        # cannot make itself required.
        run: scripts/sync-fixtures.sh --check-unreleased

  registry-coverage:
    name: library registry coverage (ubuntu, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Warn for org libraries missing from / newer than the registry
        # Advisory (not a required check): compares every loft-lang/loft-libs-*
        # library's loft.toml version against the published registry index.
        # Missing/stale entries surface as warning annotations, never block —
        # the fix is publishing (doc/claude/REGISTRY_SUBMIT.md), which happens
        # in the registry repo, not here.  Network trouble is a skip, not a red.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check_registry_coverage.sh

  comment-quality:
    name: comment quality vs baseline (ubuntu, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: New comment-quality flags beyond .lint_comments_baseline
        # Advisory (not a required check): lists comment lines matching the
        # history-stamp / change-narration patterns that are NOT already in
        # .lint_comments_baseline.  The script always exits 0 — new flags
        # surface as GitHub warning annotations, never block the PR.  Standard
        # + baseline ratchet + cleanup workflow: doc/claude/DOC_QUALITY.md § Check.
        run: scripts/lint_comments.sh --check

  # @PLAN53 Wave 2 — the per-PR ASan gate.  ASan is cheap enough (~few min,
  # ubuntu-only, parallel under the windows `Test` long pole) to gate every PR,
  # giving UAF / OOB / double-free detection at PR time — the @P383 founding bug
  # class.  Complements the `guard` (alignment) and the nightly Miri
  # (alignment / uninit / provenance, which ASan is blind to).
  #
  # Pinned nightly so a churny nightly day can't block PRs (ASan needs
  # -Zsanitizer, nightly-only).  Interpreter targets only — ASan can't see the
  # separate binaries native/wasm/html tests spawn.  Skips the lib-FFI
  # integration test (needs GL/ALSA build-prep) + the toolchain-sensitive
  # generated-code-freshness meta-tests (ci.yml validates those on stable).
  # detect_leaks=0 until the LeakSanitizer live-at-exit baseline is triaged.
  asan:
    name: ASan UAF/OOB gate (ubuntu)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust nightly (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-28
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-asan-pr-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ubuntu-asan-pr-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ubuntu-asan-pr-cargo-
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # nextest (not `cargo test`): it does NOT build doctests, which under
      # `--target` + `-Zsanitizer` fail to resolve the curve25519 proc-macro
      # (E0463) — and doctests aren't memory-safety-relevant anyway.  The
      # filter drops the lib-FFI integration test + the toolchain-sensitive
      # generated-code-freshness meta-tests.
      #
      # `+nightly-2026-05-28` is EXPLICIT: the repo's rust-toolchain.toml pins
      # `channel = "stable"`, which otherwise overrides the dtolnay nightly
      # install for `cargo` in the repo dir — and `-Zsanitizer` is nightly-only,
      # so a bare `cargo` here runs stable and errors "the option `Z` is only
      # accepted on the nightly compiler".
      - name: ASan sweep (UAF / OOB; leaks off pending triage)
        env:
          RUSTFLAGS: '-Zsanitizer=address'
          ASAN_OPTIONS: 'detect_leaks=0'
        run: >
          cargo +nightly-2026-05-28 nextest run --profile ci --release
          --target x86_64-unknown-linux-gnu
          --lib --test issues --test wrap --test strings --test frame_vars
          -E 'not (test(library_suite) | test(fill_rs_up_to_date) |
          test(n9_generated_fill_matches_src) | test(native_rs_functions_up_to_date) |
          test(loft_test_runs_admission_and_states_its_scope) |
          test(a_private_scope_end_hook_in_a_library_runs) |
          test(a_delegating_producer_binds_its_companion_cleanly))'
          # ^ excluded like the others above: each SPAWNS the `loft` binary as a
          #   subprocess, so the work runs OUTSIDE this ASan-instrumented binary — zero
          #   UAF/OOB coverage here — and each fails only under the ASan `--target` build
          #   (all pass on the normal Test ubuntu/macos jobs, which validate their logic),
          #   for an environment reason that never reproduces locally.
          #
          #   The last two spawn a run that BUILDS native artifacts (a library cdylib, the
          #   `--native` runtime), and that build cannot resolve loft's proc-macro deps
          #   under `-Zsanitizer` + `--target` — the same E0463 the doctest note above
          #   describes: `can't find crate for curve25519_dalek_derive`.
      # The interpreter LEAK GATE (detect_leaks=1, enforcing) is the nightly
      # `asan-leak-gate` job in miri.yml — kept off the per-PR path (its slow
      # single-threaded pass would bloat PR CI).  Its red/green surfaces onto PRs via
      # the nightly-status mechanism below, same as the other nightly gates.

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `.cargo/config.toml` activates mold on x86_64-unknown-linux-gnu
      # for build-script + proc-macro linking.  The clippy job needs
      # this even though it doesn't link the final binary — cargo
      # still compiles + links build scripts.
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ubuntu-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}-
            ubuntu-cargo-clippy-

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings

      - name: Clippy (all targets, all features, deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  # Prevent browser-side "Failed to grow table" / "import mismatch"
  # errors from reaching the deployed site by rebuilding BOTH browser
  # artefacts — the wasm-pack-based gallery+playground bundle and the
  # loft-native --html Brick Buster build — and probing every asset
  # each imports on every PR.  Both pipelines produce a wasm/js pair
  # that must agree; a partial rebuild silently breaks runtime loading.
  # Keeping them in one job reuses the wasm target cache for speed.
  gallery:
    name: Browser build + probe
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # `.cargo/config.toml` activates mold for native x86_64 builds
      # (the wasm target is unaffected, but the gallery job also
      # builds loft-native for the Brick Buster HTML pipeline).
      # binaryen provides `wasm-opt`, which `make game` / `loft --html`
      # require to inject asyncify (frame-yield) — without it the bundle's
      # self-validation gate (@P350) fails "no asyncify exports".
      # `libgl-dev` + `libasound2-dev` are the GL and ALSA HEADERS that
      # `graphics`' native library needs to build from source.  `make game`
      # reaches it through `brick-buster-pack` → `pack_atlas.loft`, which `use`s
      # `graphics` and therefore builds its cdylib on this runner — so the job
      # needs the same dev packages the Test job installs, even though nothing
      # here opens a window.  Without them `pkg_config` panics in the build
      # script and the failure surfaces four layers up as
      # `assertion failed: pack_atlas: could not write assets/bb`, which names
      # neither GL nor ALSA.
      - name: Install mold + binaryen (wasm-opt) + GL/ALSA headers
        run: sudo apt-get update && sudo apt-get install -y mold binaryen libgl-dev libasound2-dev

      - name: Install wasm-pack
        run: |
          curl -sSLf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-gallery-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ubuntu-cargo-gallery-${{ hashFiles('**/Cargo.lock') }}-
            ubuntu-cargo-gallery-

      # Instantiate the committed doc/pkg/{loft.js, loft_bg.wasm} pair
      # exactly as the browser would.  A drifted pair fails here with
      # the same LinkError ("Failed to grow table" / "Function import
      # mismatch") that users see on the deployed site — catches the
      # case where one of the two was re-committed without the other
      # (the cause of the PR #165 post-merge breakage).  Runs before
      # make gallery so the failure blames the committed state, not
      # the rebuild.
      - name: Probe committed wasm/js pair
        run: |
          # Instantiate the committed wasm using the committed JS glue
          # exactly as a browser would.  A drifted pair fails here with
          # the identical LinkError ("WebAssembly.Table.grow() failed"
          # or "Function import mismatch") that users see on the
          # deployed site — catches the case where one of the two files
          # was re-committed without the other.
          node --input-type=module -e "
            import { readFileSync } from 'fs';
            import { pathToFileURL } from 'url';
            import { resolve } from 'path';
            const wasm = await WebAssembly.compile(readFileSync('doc/pkg/loft_bg.wasm'));
            const glue = await import(pathToFileURL(resolve('doc/pkg/loft.js')).href);
            try {
              await glue.default(wasm);
              console.log('committed bundle instantiates OK');
            } catch (e) {
              console.error('Committed doc/pkg/loft.js and loft_bg.wasm are out of sync.');
              console.error('Browsers will show the same LinkError on the deployed site:');
              console.error('  ' + (e && e.message || e));
              console.error('Fix: run \`make gallery\` locally and commit BOTH files together.');
              process.exit(1);
            }
          "

      # Rebuilds doc/pkg/ (wasm-pack bundle behind gallery.html +
      # playground.html), verifies every asset HEAD-loads.
      - name: make gallery
        run: make gallery

      # Rebuilds doc/brick-buster.html via `loft --html` against a
      # freshly built wasm32-unknown-unknown libloft.rlib, sanity-checks
      # the output.  Protects the "click-to-play" experience just like
      # `make gallery` protects the demo grid.
      - name: make game
        run: make game

      # The browser RENDER gate, here rather than in the `test` job: it asserts against
      # `doc/brick-buster.html`, and `tests/html_render.rs` deliberately refuses to build
      # that itself (a `cargo build` inside `cargo test` races the parallel rustc in
      # `tests/native.rs` over `target/release/deps/`). So it can only do real work where
      # a fresh bundle already exists — which is here, immediately after `make game`.
      # Run anywhere else and it self-skips on staleness, which is how it went dormant:
      # a skipping gate and a passing one are indistinguishable in a green log.
      # Kept off the PR path, as it was before.
      # This job never installed nextest, while the step below has always been
      # able to run on any non-PR event.  It survived on push-to-main and the
      # schedule only because their warm cargo cache happened to carry a nextest
      # binary; the first COLD run on this job failed with `error: no such
      # command: nextest`, which is what a manual dispatch on a new branch is.
      # A gate that depends on a cache being warm is not a gate.
      - name: Install cargo-nextest
        if: github.event_name != 'pull_request'
        uses: taiki-e/install-action@nextest

      - name: Browser render (nightly — off the flaky PR path)
        if: github.event_name != 'pull_request'
        run: cargo nextest run --profile ci -E 'binary(html_render)'

      # NOTE: we deliberately do NOT byte-compare the CI rebuild to
      # the committed doc/pkg/ + doc/brick-buster.html.  Different
      # rustc / wasm-opt versions produce non-bit-identical wasm even
      # for identical source, so a strict diff check is
      # non-deterministic across environments.  The real deploy-time
      # protection lives in .github/workflows/release.yml's docs job
      # (and, long-term, a main-push workflow that rebuilds and
      # commits the bundle back).  What this CI job guarantees is
      # that both pipelines *build* and every asset loads — which
      # catches the common failure mode of a source change that
      # breaks the browser pipeline without the contributor noticing.

  # Doc hygiene — blocking CI gate (promoted 2026-05-18).
  #
  # Runs scripts/check_doc_drift.sh (paths / time / stale / roadmap /
  # refs / libs).  Fails on real drift (broken links, stale "is
  # current" claims, ROADMAP/disk mismatch, finished/deferred plan
  # refs from normal docs); warns on time projections + missing lib
  # READMEs.
  #
  # Originally `continue-on-error: true` (non-blocking) — promoted to
  # blocking because every PR-212 cycle that ignored the doc-drift
  # signal eventually surfaced as a downstream test failure
  # (broken-link assertion in index_hygiene_clean).  The checker
  # produces zero false positives on the loft tree; if it fires, the
  # author needs to fix the doc before merging.  The
  # `tests/index_hygiene.rs::index_hygiene_clean` assertion already
  # blocks merges on the same condition — making doc-check blocking
  # surfaces the failure earlier (8s job) and explains it more
  # clearly than the test panic.
  doc-check:
    name: Doc hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run drift checks
        run: scripts/check_doc_drift.sh

      # The label guard's parser (`.github/scripts/label-guard.js`) decides which
      # triage labels an issue body asks for.  Every way it can be wrong is
      # SILENT — "no label applied" is what an unanswered form looks like — and
      # nothing else exercises it: the workflow only runs on an issue event, long
      # after the PR that broke it.  Here, on the PR.  It found two live defects
      # on the way in (the `wa:` dropdown was never read; a freeform filer had no
      # channel), so this is not a formality.
      - name: Label-guard parser selftest
        run: node tools/label_guard_selftest.mjs

      # The same argument for the `Contract:` trailer parser: the push workflow
      # applies the `contract:` label off it, and a regex that stopped matching
      # would apply nothing — indistinguishable from a fix nobody judged, which
      # is the one reading that axis must never get wrong.
      - name: Contract-trailer parser selftest
        run: python3 scripts/contract_labels.py --self-test

      - name: Summary
        if: always()
        run: |
          {
            echo "Run \`make doc-check\` locally to reproduce."
            echo ""
            echo "Summary line:"
            echo '```'
            scripts/check_doc_drift.sh -q 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Feature catalogue — a standalone RED-but-non-blocking check (@PLN92 strands
  # 4 + 5), same posture as the Doc hygiene job above: NOT in the required-
  # status-checks list, so a failure shows red on the PR without blocking merge.
  #   Coverage (strand 4): red when a new implementation file lands with no @I
  #     subsystem / @F feature tag (not in .feature_coverage_baseline).  Fix: tag
  #     the file (see doc/claude/plans/92-feature-catalogue/) then run
  #     `scripts/feature_coverage.sh --prune`.
  #   Hygiene (strand 5): red on a dangling @F<n>/@I<n> tag — one referencing a
  #     number with no catalogue entry (a typo or stale number).
  # Both are pure shell — no build needed.
  feature-catalogue:
    name: Feature catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Coverage — every implementation file maps to a catalogue entry
        run: scripts/feature_coverage.sh --check
      - name: Hygiene — no dangling @F/@I tag
        run: scripts/feature_hygiene.sh --check

  # @PLAN53 — surface the latest nightly health as a sticky PR comment, from
  # BOTH nightly sources: miri.yml (Miri / ASan / toolchain-matrix) and the
  # scheduled daily full-matrix CI run (the only place Windows runs — a red
  # Windows leg must show up here, not only in the Actions tab).
  # INFORMATIONAL, never a merge gate:
  # the job always succeeds (continue-on-error + a try/catch that never throws),
  # and it is not a required check.  A red nightly is a fact the reviewer weighs
  # for THIS PR — not a block.  Reads per-JOB conclusions (not the run
  # conclusion) so the toolchain matrix's `continue-on-error` can't hide a red
  # beta/nightly behind a green run.
  nightly-status:
    name: Nightly health (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    continue-on-error: true
    steps:
      - name: Sticky-comment the latest nightly health
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- nightly-status-comment -->';
            let attentionNeeded = false;
            try {
              const icon = (c) => c === 'success' ? '✅'
                : (c === 'skipped' || c === 'cancelled') ? '⤵️' : '❌';
              const isBad = (j) => j.conclusion
                && !['success', 'skipped', 'cancelled'].includes(j.conclusion);
              // Ask for a WINDOW and pick the newest in it, rather than trusting
              // position 0 of a one-item page.  GitHub's run-list endpoint can answer a
              // STALE window at small `per_page`, and the staleness drifts rather than
              // being a fixed offset — owner-measured 2026-08-19: `per_page=1` handed
              // back a run from 08-07, `per_page=3` one from 08-15, `per_page=10` that
              // day's own; re-queried an hour later all three answered 08-19.  So it is
              // not reproducible on demand, which is exactly why position 0 cannot be
              // trusted and `max(created_at)` over a window is the shape that holds
              // whichever page the endpoint decides to serve.
              //
              // The cost of getting it wrong is not cosmetic: this reporter red-flagged
              // a TWELVE-DAY-OLD macOS failure on every PR, one that eleven consecutive
              // green scheduled runs had already superseded.  A health signal that cries
              // wolf is one nobody reads.
              const latestRun = async (workflow_id, extra) => {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id, branch: context.payload.repository.default_branch,
                  status: 'completed', per_page: 10, ...extra,
                });
                return runs.data.workflow_runs.reduce(
                  (newest, r) => (!newest || r.created_at > newest.created_at ? r : newest),
                  null,
                );
              };
              const runJobs = async (run) => (await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: run.id, per_page: 100,
              })).data.jobs;
              const sections = [];
              // miri.yml nightly — few jobs, show each one.
              const miri = await latestRun('miri.yml', {});
              if (miri) {
                const jobs = await runJobs(miri);
                if (jobs.some(isBad)) attentionNeeded = true;
                sections.push(`**miri nightly** (${miri.created_at.slice(0, 10)}): `
                  + jobs.map((j) => `${icon(j.conclusion)} ${j.name}`).join(' · ')
                  + ` — [run #${miri.run_number}](${miri.html_url})`);
              }
              // @PLN117 browser-threading gates (browser-threads.yml, nightly +
              // on threading-surface pushes) — the only place `par` on real Web
              // Worker threads is proven, so a red there is invisible anywhere
              // else.  Tolerates a missing workflow (not yet on main, renamed)
              // instead of losing the whole report to a 404.
              let threads = null;
              try { threads = await latestRun('browser-threads.yml', {}); } catch (e) { /* not on main yet */ }
              if (threads) {
                const jobs = await runJobs(threads);
                if (jobs.some(isBad)) attentionNeeded = true;
                sections.push(`**browser threading** (${threads.created_at.slice(0, 10)}): `
                  + jobs.map((j) => `${icon(j.conclusion)} ${j.name}`).join(' · ')
                  + ` — [run #${threads.run_number}](${threads.html_url})`);
              }
              // Scheduled daily full-matrix CI — the only place Windows runs.
              // ~20 jobs, so name the failures and count the rest.
              const daily = await latestRun('ci.yml', { event: 'schedule' });
              if (daily) {
                const jobs = await runJobs(daily);
                const bad = jobs.filter(isBad);
                if (bad.length) attentionNeeded = true;
                const okCount = jobs.filter((j) => j.conclusion === 'success').length;
                sections.push(`**daily full CI incl. Windows** (${daily.created_at.slice(0, 10)}): `
                  + (bad.length
                    ? bad.map((j) => `❌ ${j.name}`).join(' · ') + ` · ✅ ${okCount} green`
                    : `✅ all ${okCount} jobs`)
                  + ` — [run #${daily.run_number}](${daily.html_url})`);
              }
              let body;
              if (!sections.length) {
                body = `${marker}\n🌙 **Nightly health** — no completed nightly run yet. `
                  + `Informational; not a merge gate.`;
              } else {
                body = `${marker}\n🌙 **Nightly health**: `
                  + `${attentionNeeded ? '⚠️ needs attention' : 'all clear'}\n\n`
                  + sections.join('\n')
                  + `\n\nPer-*job* status (sees through the toolchain matrix's `
                  + `\`continue-on-error\`). Informational; **not a merge gate**.`;
              }
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, body,
                });
              }
              // A red nightly must be VISIBLE, not just a comment: the
              // nightly sat red for 10+ straight days (June 2026) and the
              // sticky comment alone never made anyone look.  Failing this
              // job paints a red ❌ on every PR's checks list until the
              // nightly is fixed — it is NOT in the required-checks set
              // (and the job is continue-on-error), so it never blocks a
              // merge; it just refuses to be ignored.
              if (attentionNeeded) {
                core.setFailed('Latest nightly on main is RED — see the sticky comment for the failing jobs.');
              }
            } catch (e) {
              // Informational only — never fail the PR over a reporting hiccup.
              core.warning(`nightly-status reporter skipped: ${e.message}`);
            }
