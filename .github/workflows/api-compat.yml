# @PLN102 C1 — the api-surface COMPATIBILITY check (the non-blocking PR check).
#
# Runs `make api-compat`: for each bundled baseline, `loft api-surface --check` reports whether
# the current source is still a drop-in — the API axis (strict, tier-aware) AND the @PLN97 layout
# axis (a value-type reshape is a silent data break). A break fails this job → a RED status on the
# PR. Keep this check OUT of the branch's required status checks so it is NON-BLOCKING: it INFORMS
# ("this PR is not backwards compatible"), it never blocks the merge — the doctrine is folding +
# hosting, not prevention (see doc/claude/COMPATIBILITY.md).
#
# Regenerate a baseline on an INTENTIONAL change:
#   loft api-surface <lib> --emit-baseline > <lib>.api-baseline
name: api-compat

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # @PLN184 D1 — Python decodes files as UTF-8 on every runner (Windows defaults to cp1252).
  PYTHONUTF8: '1'
  CARGO_TERM_COLOR: always

jobs:
  api-compat:
    # @windows-exempt: platform-free — compares the API surface as text
    name: API compatibility (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # `.cargo/config.toml` pins `-fuse-ld=mold`, so the runner needs it (as the main CI does).
      - name: Install mold
        run: timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -y && timeout 600 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y mold
      # Read-only, from ci.yml's `test` job cache (saved on main — CI_BUDGET.md § F).
      # The path list must stay IDENTICAL to that job's, or the restore never matches.
      - name: Restore cargo registry and build (ci.yml's test job's, read-only)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.loft/build-cache
            target
            !target/loft-native-cache
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-
      - name: Check api-surface compatibility
        run: make api-compat

  contract-goldens:
    # @windows-exempt: platform-free — compares contract goldens as text
    # @PLN102 arc-E flip-gate (Gate 1 + Gate 2) — a change to a frozen contract golden
    # (the LAYOUT of stored data or the observable BEHAVIOUR of valid programs) is a
    # silent break, so post-freeze it must land with a CONTRACT_VERSION bump. INERT
    # while CONTRACT_VERSION == 0 (this job passes trivially today); it arms
    # automatically at the 0 -> 1 flip. Non-blocking, like api-compat above.
    name: Contract goldens drift (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need history to diff the PR against its base
      - name: Fetch base
        run: git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
      - name: Golden-vs-contract drift gate
        run: BASE_REF="origin/${{ github.event.pull_request.base.ref }}" make check-contract-goldens
