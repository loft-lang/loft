# The acquisition chain as STANDING evidence (@PLN156 phase 2): the moment a release is
# published, verify the whole path a user takes to it — real transport, the version the
# binary claims, resolution against the signed index, the verify-self ANCHOR line, and
# a program executing.
#
# Two triggers, two questions:
#   release published — did THIS release ship acquirable?  The registry splice usually
#     lands after Publish, so this run typically ends at the resolution step with the
#     chain script's loudest failure ("the signed index resolves NOTHING") until the
#     splice lands — re-run it then (workflow_dispatch) for the green that counts.  The
#     checklist's A-acquisition item measures the same chain from the release box; this
#     job is the copy that survives on the record.
#   workflow_dispatch — re-verify any version by hand (`version` input), including the
#     PREVIOUS release mid-cycle: the live chain staying acquirable is a stability
#     property, not a release-day one.
name: post-publish-verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "release version to verify (e.g. 2026.9.0); empty = latest tag"
        required: false
        default: ""

permissions:
  contents: read

env:
  # Cargo 1.100 (stable since 2026-11-09) builds into a new build-dir layout with no
  # target/<profile>/deps/, which the native toolchain (src/toolchain.rs), make-release.sh
  # and the cdylib builds still read.  Its temporary opt-out keeps the old layout until they
  # read the new one; cargo drops the opt-out one release later (rust-lang/cargo#17182).
  __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT: "1"
  # @PLN184 D1 — Python decodes files as UTF-8 on every runner (Windows defaults to cp1252).
  PYTHONUTF8: '1'

jobs:
  acquisition-chain:
    # @windows-exempt: approved exemption — a clean-Windows install leg is future work outside @PLN184
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The C backend's compiler on Windows: MSYS2 gcc 16, not the runner's MinGW-Builds 15.2.
      # A no-op on this Linux job; the `if` keeps an older checkout's missing action unread.
      - if: runner.os == 'Windows'
        uses: ./.github/actions/windows-gcc
      - name: Resolve the version under test
        id: ver
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ] && [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
            v="${v#v}"
          fi
          if [ -z "$v" ]; then
            v=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "verifying loft $v"
      - name: The acquisition chain, end to end
        run: sh scripts/acquisition-chain.sh --version "${{ steps.ver.outputs.version }}"
