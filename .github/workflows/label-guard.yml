# Label guard — ensure every BUG-shaped issue carries the required triage labels.
#
# Two jobs in one: (1) auto-apply the `sev:` / `wa:` / `area:` labels a filer
# ASKED for in the issue body (form dropdown/checkbox answers land in the BODY,
# not as labels — GitHub does not label them for you, and a filer without triage
# permission cannot label at all); (2) if a required category is still missing,
# apply `needs:labels` + a one-time comment naming what is missing AND how to
# supply it.  Clears itself once the labels are set.
#
# The parsing lives in `.github/scripts/label-guard.js`, not inline here, because
# every way it can be wrong is SILENT — the failure is "no label applied", which
# is indistinguishable from "the filer did not answer".  It is a pure function of
# the body, and `tools/label_guard_selftest.mjs` holds it to real body shapes
# (`make label-guard-test`, run by `make ci`).  Two defects it found on the way
# in: the `wa:` dropdown was never read (the free-text `### Workaround` textarea
# shares the substring and comes first), and a freeform filer had no channel at
# all — see the script's own comments.
#
# Scope (#626): only DEFECTS carry the sev/wa/area contract.  Issues opened from
# the showcase / feature-request / library-proposal templates are exempt and have
# their stale `needs:labels` cleared — asking a showcase for a severity and a
# compiler area is unanswerable, and the only way to satisfy it was to attach a
# fake `sev:`/`wa:`/`area:`, which poisons the triage queries those labels exist
# to serve.  Enforcement still defaults ON for anything without a non-bug marker,
# so the freeform `gh issue create` case this guard exists for stays covered.
#
# Idempotence (#627): the guard reads LIVE labels via the API rather than the
# event payload, is serialised per issue by `concurrency`, and marks its own
# comment so it can recognise it.  Previously the check read `context.payload
# .issue.labels` — a snapshot from when the event fired.  A template's own
# `labels:` are applied by GitHub at creation, so that `labeled` event is NOT
# suppressed by the GITHUB_TOKEN rule below and races the `opened` event: both
# payloads predated `needs:labels`, both runs saw it as absent, and both
# commented.  Every showcase issue got two identical bot comments.
#
# Loop-safe: label edits made with GITHUB_TOKEN do not trigger new workflow runs,
# so the workflow's own add/remove of labels never re-fires it.  (That covers the
# workflow's OWN edits only — see the #627 note above for the events it does not.)
#
# The body is written by anyone who can open an issue, so it is UNTRUSTED input.
# It is read through the API into a JS string and never interpolated into a shell
# command, and only labels on the script's allowlist are ever applied — the worst
# a filer can do is mislabel their own issue, which is what the form already lets
# them do.
name: Label guard

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

permissions:
  issues: write

# #627 — serialise runs for the SAME issue so two events (e.g. `opened` racing
# the template's own `labeled`) cannot both pass the check-then-act below.
# `cancel-in-progress: false`: the second event is not redundant — it may carry
# the edit that supplies the missing labels, so it must run, not be dropped.
concurrency:
  group: label-guard-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  # @PLN184 D1 — Python decodes files as UTF-8 on every runner (Windows defaults to cp1252).
  PYTHONUTF8: '1'

jobs:
  guard:
    # @windows-exempt: platform-free — checks issue labels
    runs-on: ubuntu-latest
    steps:
      # The parser is repo content, so it has to be on disk to be required.
      # Pinned to the default branch: an issue event carries no ref, and the rule
      # a body is judged by must be the one that is merged.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        with:
          script: |
            const guard = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/label-guard.js`);
            const { owner, repo } = context.repo;
            const number = context.payload.issue.number;
            const NEEDS = "needs:labels";
            // Identifies this guard's own comment across runs, so a re-run can
            // recognise it without string-matching prose that may be reworded.
            const MARKER = "<!-- loft-label-guard -->";

            // #627 — read LIVE state.  `context.payload.issue.labels` is a
            // snapshot from when the event fired; two events seconds apart both
            // predate the label this guard adds, so both would act on it.
            const { data: live } = await github.rest.issues.get({
              owner, repo, issue_number: number,
            });
            const body = live.body || "";
            const labels = new Set(
              (live.labels || []).map(l => (typeof l === "string" ? l : l.name)),
            );

            // `next-release` parks work past a freeze and takes it off `make work`;
            // a DEFECT may never carry it (a bug is fixed before the release).
            // Judged before the non-bug exit, because a mislabelled enhancement
            // carrying `sev:` is exactly the case to catch.
            const conflicts = guard.nextReleaseConflicts([...labels]);
            if (conflicts.length) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: number, name: guard.NEXT_RELEASE,
              }).catch(() => {});
              labels.delete(guard.NEXT_RELEASE);
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `<!-- loft-label-guard:next-release -->\n`
                  + `\`${guard.NEXT_RELEASE}\` was removed: this issue carries `
                  + conflicts.map(l => `\`${l}\``).join(", ")
                  + `, so it is a defect, and a defect is fixed before the release rather `
                  + `than parked past it.  If it is not a defect, correct those labels first — see `
                  + `[\`.github/LABELS.md\` § Lifecycle](https://github.com/${owner}/${repo}/blob/main/.github/LABELS.md#lifecycle-where-the-fix-is-not-what-kind-of-bug).`,
              });
            }

            // #626 — a non-bug template's marker label.  These issues are not
            // defects, so the sev/wa/area contract does not apply to them.
            // Matched exactly or as a `prefix:` namespace (`showcase:pending`).
            const NON_BUG = ["showcase", "enhancement", "proposal"];
            const isNonBug = [...labels].some(l =>
              NON_BUG.some(p => l === p || l.startsWith(p + ":")),
            );
            if (isNonBug) {
              // Clear the flag if an earlier run (or the pre-#626 guard) set it.
              if (labels.has(NEEDS)) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: number, name: NEEDS,
                }).catch(() => {});
              }
              return;
            }

            // 1) Apply what the body asked for.
            const toApply = guard.applicable(guard.chooseLabels(body), [...labels]);
            if (toApply.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: toApply });
              toApply.forEach(l => labels.add(l));
            }

            // 2) Enforce: is each required category present now?
            const missing = guard.CATEGORIES.filter(
              c => ![...labels].some(l => l.startsWith(c.key)),
            );

            if (missing.length === 0) {
              if (labels.has(NEEDS)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: NEEDS })
                  .catch(() => {});
              }
              return;
            }

            // Adding an existing label is a no-op, so this is safe to repeat.
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [NEEDS] });

            // #627 — comment at most once, decided on the comment list itself
            // rather than on the label.  The label is the thing two racing runs
            // disagreed about; the comment's own presence cannot be raced away.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            if (comments.some(c => (c.body || "").includes(MARKER))) {
              return;
            }
            // The values are PLACEHOLDERS (`sev:<high|medium|low>`), and that is
            // deliberate: #626 was an issue whose body quoted this comment, and
            // a quoted example holding real tokens is a body asking for them.
            // `sev:<` cannot match the parser's `sev:[a-z0-9-]+`, so quoting this
            // applies nothing.
            const block = missing
              .map(c => `${c.key}<${c.values.map(v => v.slice(c.key.length)).join("|")}>`)
              .join("\n");
            const list = missing.map(c => `- **${c.name}**`).join("\n");
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: `${MARKER}\nThis issue is missing required triage labels:\n\n${list}\n\n`
                + `**If you can set labels**, apply one from each category — see `
                + `[\`.github/LABELS.md\`](https://github.com/${owner}/${repo}/blob/main/.github/LABELS.md).\n\n`
                + `**If you cannot** — GitHub only lets repository triagers label, so a reporter `
                + `usually cannot — say which you want and this guard will apply them for you. `
                + `Edit this issue's description and add a \`### Triage\` section naming one value `
                + `per line, replacing each placeholder below with a single choice:\n\n`
                + "```\n### Triage\n" + block + "\n```\n\n"
                + `The \`${NEEDS}\` flag clears automatically once they are set.`,
            });
