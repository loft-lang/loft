name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            # macos-15 is Apple Silicon, so this leg CROSS-builds and the bundle it
            # produces cannot run natively on the runner that made it.  Declared here
            # rather than discovered in the smoke step: which legs can run their own
            # artifact is a fact about the matrix, and a skip nobody chose is the kind
            # that goes unnoticed.
            os: macos-15
            cross: rosetta
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # scripts/make-release.sh needs `zip` to assemble the bundle; Linux also
      # needs musl-tools for the static target.  macOS ships zip already;
      # Windows runs the script under Git-Bash and gets zip from chocolatey.
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools zip unzip

      - name: Install packaging tools (Windows)
        if: runner.os == 'Windows'
        run: choco install zip unzip -y

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # One script builds the binary AND assembles the self-contained bundle:
      # bin/loft + default/ (the stdlib the binary loads at runtime) + examples
      # + reference PDF + stdlib.manifest + SHA256SUMS.  The native binary does
      # NOT embed the stdlib, so shipping the bare binary would be dead on
      # arrival — the bundle is the unit a programmer can actually run offline.
      - name: Build self-contained release bundle
        shell: bash
        run: scripts/make-release.sh ${{ matrix.target }}

      # Run the bundle we just built.  Everything before this proves the SOURCE
      # compiles; these are ARTIFACT properties, which only exist once the zip does —
      # so the tag pipeline is the only place they can be checked at all, and until
      # now it uploaded four bundles without executing a byte of one.
      #
      # It unpacks the ZIP rather than reusing make-release.sh's staging directory:
      # the zip is what a user downloads, and the round-trip is part of what is under
      # test (a lost executable bit is invisible in the stage).
      #
      # The stderr assertion is what keeps this from being vacuous.  A loft program
      # that cannot write its output file prints `... — write skipped` and still
      # exits 0, so an exit-code-only smoke passes on a bundle whose examples do
      # nothing — which is exactly what `examples/files.loft` did on Windows while it
      # hardcoded `/tmp`.  All seven examples are stderr-clean, so any byte there is
      # a real diagnostic from a program we ship.
      - name: Smoke-test the bundle
        shell: bash
        env:
          # CLAUDE.md § bound ad-hoc runs.  The examples finish in milliseconds; this
          # only bounds a hang, so a stuck leg fails instead of burning the job clock.
          LOFT_TIMEOUT: 60
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="loft-$version-${{ matrix.target }}"
          exe="bin/loft"
          case "${{ matrix.target }}" in *windows*) exe="bin/loft.exe";; esac

          # `make-release.sh` names the bundle from Cargo.toml while the tag names this
          # variable, so a version bump that never reached the manifest lands here as a
          # missing file.  `gen-toolchain-entry.py` catches the same mismatch, but only
          # after all four legs have built; saying it plainly here is the cheaper half.
          if [ ! -f "dist/$name.zip" ]; then
            echo "no dist/$name.zip — the tag says $version, but the bundle is named" >&2
            echo "from Cargo.toml, which says $(grep -m1 '^version = ' Cargo.toml)." >&2
            ls dist/ >&2
            exit 1
          fi

          # A leg that cross-builds cannot run its own artifact without an emulator.
          # Reported loudly and skipped rather than failed: no release should be
          # blocked because a runner image dropped Rosetta.  The manual per-release
          # checklist carries the bundle this leaves unproven — `make release-checklist`.
          if [ "${{ matrix.cross }}" = "rosetta" ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning title=Bundle smoke skipped::${{ matrix.target }} is cross-built on an arm64 runner and Rosetta 2 is unavailable — this bundle was NOT executed.  Run it by hand before publishing."
            echo "### :warning: Bundle smoke SKIPPED — ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Cross-built on an arm64 runner with no Rosetta 2.  **This bundle has not been run.**  Smoke it by hand on an Intel Mac before publishing the draft." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          rm -rf smoke && mkdir smoke
          unzip -q "dist/$name.zip" -d smoke
          logs="$PWD/smoke-logs"; mkdir -p "$logs"
          cd "smoke/$name"

          # 1 — the binary runs at all, and it is the version the tag claims.  A bundle
          #     named for one version carrying the binary of another is the failure the
          #     hashes cannot see: every digest would be internally consistent.
          got="$("./$exe" --version)"
          if [ "$got" != "loft $version" ]; then
            echo "version mismatch: tag says 'loft $version', binary says '$got'" >&2
            exit 1
          fi
          echo "  ok  $got"

          # 2 — every file the bundle shipped still hashes to its manifest, and nothing
          #     unlisted sits in default/.  Exit 2 ("nothing to verify") fails here as
          #     surely as exit 1: a bundle with no SHA256SUMS is a packaging bug, and
          #     `set -e` is what keeps "could not check" from reading as a pass.
          "./$exe" verify-self

          # 3 — the programs we ship actually run under the mode QUICKSTART documents.
          #     `--interpret` is the offline runtime: the whole point of the bundle is
          #     that it needs nothing else, and `--native` would shell out to a rustc
          #     the downloading user may not have.
          for f in examples/*.loft; do
            base="$(basename "$f")"
            if ! "./$exe" --interpret "$f" >"$logs/$base.out" 2>"$logs/$base.err"; then
              echo "$base exited non-zero:" >&2
              cat "$logs/$base.err" >&2
              exit 1
            fi
            if [ ! -s "$logs/$base.out" ]; then
              echo "$base produced no output — it ran and did nothing" >&2
              exit 1
            fi
            if [ -s "$logs/$base.err" ]; then
              echo "$base wrote to stderr — a shipped example must be diagnostic-free:" >&2
              cat "$logs/$base.err" >&2
              exit 1
            fi
            echo "  ok  $base ($(wc -c <"$logs/$base.out" | tr -d ' ') bytes)"
          done

          echo "### Bundle smoke passed — ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$got\`, manifest verified, $(ls examples/*.loft | wc -l | tr -d ' ') examples run under \`--interpret\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: loft-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.zip.sha256

  # Assemble the release as a DRAFT with all four platform bundles attached, then
  # STOP.  The owner reviews the draft and clicks Publish — and only that click
  # freezes the release (immutable releases lock assets at publish time).  The old
  # flow published FIRST (publishing the UI draft created the tag, which triggered
  # this build), so the binaries arrived AFTER the freeze and could never attach —
  # `422 Cannot upload assets to an immutable release`.  Building the draft here
  # guarantees the assets exist before the owner's publish click.  Fail-closed: if
  # any build leg fails, `needs: build` skips this job and no draft appears, so the
  # owner never ships a partial release.  See RELEASE.md § Tag & publish.
  draft-release:
    name: Assemble draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The artifact the registry entry names for the version ITSELF.  Built here
      # rather than in the build matrix because all four legs would otherwise emit the
      # same `-src.zip` and whichever uploaded last would silently win.
      - name: Build the source archive
        shell: bash
        run: |
          scripts/make-release.sh --source
          cp dist/*-src.zip dist/*-src.zip.sha256 artifacts/

      # @PLN78 1b — derive the registry entry from the artifacts this run produced.
      # Attached to the release so the entry submitted to loft-lang/registry is a file
      # taken from the release rather than a paragraph retyped per release: the hashes
      # cannot drift from the binaries they describe, because nobody copies them.
      # Verify before submitting:  sha256sum -c loft-<v>-src.zip.sha256
      - name: Generate the registry toolchain entry
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/gen-toolchain-entry.py \
            --version "$version" --dir artifacts \
            --published "$(git log -1 --format=%cI HEAD)" \
            --out "artifacts/loft-$version-registry-entry.json"

      - name: Create draft release with binaries
        uses: softprops/action-gh-release@v2
        with:
          # Never auto-publish: the owner does the final publish from the reviewed
          # draft (RELEASE.md § No Automated Releases).
          draft: true
          files: artifacts/*
          generate_release_notes: true
          # Fail loudly if the glob matches nothing (a build produced no bundle)
          # rather than silently creating an assetless draft.
          fail_on_unmatched_files: true

  docs:
    name: Deploy HTML docs to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # gendoc + the wasm builds compile Rust, which needs a linker (`ld`).
      # Unlike the build jobs (which pull binutils in via musl-tools), this job
      # installs no toolchain, so the runner had none — `cargo run` died with
      # "collect2: cannot find 'ld'".  build-essential supplies gcc + ld.
      - name: Install C toolchain (linker)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # ...and gcc then has to FIND the linker the project asks for.
      # `.cargo/config.toml` pins `-fuse-ld=mold` for x86_64-unknown-linux-gnu,
      # which this job builds — the `build` job targets musl, so it is unaffected
      # and stayed green while this one failed.
      #
      # The link line carries BOTH rustc's `-fuse-ld=lld` (with
      # `-B<sysroot>/lib/rustlib/.../bin/gcc-ld`) and our `-fuse-ld=mold`; the last
      # wins, so gcc looks for mold, finds only `ld.lld` in that `-B` directory,
      # and reports `collect2: fatal error: cannot find 'ld'`.  That message names
      # `ld`, not mold, which is why it reads as a missing toolchain — the
      # build-essential step above was added for it and did not help.  gcc falls
      # back to PATH when the `-B` directory lacks the linker, so installing mold
      # is what actually resolves it.  Every other workflow building this target
      # already does; this job was the only one that did not.
      - name: Install mold
        run: sudo apt-get install -y mold

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      # Two of the four documentation tiers render the EXTRACTED package rather than
      # the registry index: the guide (`docs/*.loft`) and the source browser.  This
      # runner starts with an empty `~/.loft/registry`, and without this step gendoc
      # still succeeds — it publishes 42 "not on this build box" pages OVER the source
      # browsers in the checkout, and every library card reports "no guide" for the
      # packages that ship one.  Nothing goes red; the tier simply is not there.
      - name: Fetch the registry packages the doc build renders
        run: |
          cargo build --release --bin loft
          scripts/fetch-doc-packages.sh target/release/loft

      - name: Generate HTML docs
        run: cargo run --bin gendoc

      # Always rebuild the wasm gallery bundle from the tag's source
      # before deploy — never ship whatever stale doc/pkg/ was in the
      # committed tree.  This is the primary defence against the
      # "Failed to grow table" browser error: users open gallery.html,
      # the JS glue loads loft_bg.wasm, and the two must agree.  By
      # regenerating both here we guarantee they do.
      - name: Install wasm-pack
        run: curl -sSLf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Rebuild gallery assets
        run: make gallery

      # Same story for Brick Buster: the self-contained
      # doc/brick-buster.html embeds a wasm produced by a *different*
      # pipeline (loft --html) than the wasm-pack bundle used by the
      # gallery.  Rebuild it from the tag's source so Pages never
      # ships a stale version.
      - name: Rebuild Brick Buster HTML
        run: make game

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc
          exclude_assets: 'claude/**'

  # The programs built WITH loft, at this commit.  The bundle smoke above proves the
  # artefact runs its own examples; this proves the language the artefact carries against
  # its consumers — every package of moros, dryopea, crawler and the private economy
  # model, on both backends, exactly as the nightly `consumer-main-health` runs them (the
  # same file, called; it takes the tag's commit).  It does not gate the draft: a red here
  # is either loft moving under a consumer or the consumer's own tip, and which it is
  # decides whether the release ships — the owner's call, read from `make
  # release-checklist`'s `A-consumers` row (RELEASE.md § What the tag pipeline proves).
  consumers:
    name: consumer-main-health.yml
    uses: ./.github/workflows/consumer-main-health.yml
    secrets: inherit

  crates-io:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Skip gracefully when the token secret is unset rather than hard-failing
      # the release: a missing CARGO_REGISTRY_TOKEN should not turn the whole
      # tag run red.  cargo reads the token from CARGO_REGISTRY_TOKEN, so no
      # `--token ''` (which errors with "a value is required").
      # `cargo publish` VERIFIES by building for the host target (gnu), so it needs
      # mold for the same reason the docs job does.  This job has stayed green only
      # because the step below skips when the token is unset — it would fail on the
      # first real publish, which is the worst moment to discover it.
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            exit 0
          fi
          cargo publish
