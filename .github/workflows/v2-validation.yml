# @PLAN53 — V2 validation: the aligned-stack-layout (V2) test matrix that must
# pass before flipping V2 to the production default.  Goals + exit criteria:
# doc/claude/plans/finished/53-sanitizer-ci-lever/TESTING.md.
#
# HEAVY + SLOW (3-OS full suite under V2 + the guard sweep + Miri-under-V2) and
# therefore ON DEMAND ONLY — never `pull_request`, and run AFTER a green
# standard PR run (ci.yml).  This workflow is intentionally DORMANT: a normal
# code push does NOT fire it.  To run it, bump the trigger file:
#     echo "run $(date)" >> .github/v2-run.txt && git commit -am 'v2: run' && git push
# (Once this workflow is on the default branch, `workflow_dispatch` also works.)
name: V2 validation (aligned stack layout)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/v2-run.txt'

permissions:
  contents: read

env:
  # @PLN184 D1 — Python decodes files as UTF-8 on every runner (Windows defaults to cp1252).
  PYTHONUTF8: '1'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LOFT_TMPDIR: ${{ github.workspace }}/target/loft-native-cache
  # The layout under test: aligned eval-stack stepping + the V2 slot allocator.
  LOFT_ALIGN: '1'
  LOFT_SLOT_V2: drive

jobs:
  # STEP 2 — full suite under V2 across all 3 OSes.  macOS is ARM64 (strict
  # alignment) — the decisive platform where V1's unaligned reads are real
  # faults and where @P383 hit.  The test assertions encode the expected (V1)
  # output, so "green" is the differential V1==V2 proxy; a true byte-diff
  # against the standard ci.yml run is the stronger follow-up.
  v2-suite:
    name: V2 full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install mold + ALSA + headless GL (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold libasound2-dev xvfb libgl1-mesa-dri
      - name: Cache cargo registry and build
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-v2-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-v2-cargo-
      - name: Build
        run: cargo build --all-targets
      - name: Build (release loft binary + lib for integration tests)
        run: cargo build --release --lib --bin loft
      # Build the wasm rlib on ALL three OS — wasm32-unknown-unknown is
      # host-independent, and Goal C validates the wasm backend across
      # ubuntu/macOS/windows.  Gating to Linux left the --html tests
      # uncovered on mac/win AND produced false reds there: GitHub's macOS
      # image ships the wasm target pre-installed, so `loft --html` got past
      # the "target not installed" self-skip and then failed E0463 because
      # the rlib was never built.  Building it everywhere closes both gaps.
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build wasm rlib
        run: cargo build --release --target wasm32-unknown-unknown --lib --no-default-features --features random
      # The graphics native cdylib stays Linux-only — it feeds the
      # graphics_gold GL-render goldens, which need headless libGL (Linux).
      - name: Build graphics native cdylib (Linux only)
        if: runner.os == 'Linux'
        run: cargo build --release --manifest-path lib/graphics/native/Cargo.toml
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Test (V2)
        run: cargo nextest run --no-fail-fast --profile ci
      - name: Save cargo cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # STEP 3 — the homegrown stack_align_guard sweep under V2.  The guard asserts
  # every typed stack slot lands on its alignment boundary; it is arch-
  # independent (an offset check), so ubuntu suffices to catch ANY residual
  # misalignment corpus-wide.  Under nextest each test is its own process, so a
  # guard fire fails exactly that test and names the site.
  v2-guard:
    name: V2 stack_align_guard sweep (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install mold + ALSA + headless GL
        run: sudo apt-get update && sudo apt-get install -y mold libasound2-dev xvfb libgl1-mesa-dri
      - name: Cache cargo registry and build
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-v2-guard-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-v2-guard-cargo-
      # Build-prep mirrors the v2-suite job: native-compile tests shell out to
      # build generated Rust against the release loft + mmap_storage rlibs, and
      # binary-spawn tests exec target/release/loft — both absent without this,
      # which otherwise fails the lane with E0463 (can't find mmap_storage) /
      # "failed to spawn loft binary", masquerading as guard fires.
      - name: Build
        run: cargo build --all-targets
      - name: Build (release loft binary + lib for integration tests)
        run: cargo build --release --lib --bin loft
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build wasm rlib
        run: cargo build --release --target wasm32-unknown-unknown --lib --no-default-features --features random
      - name: Build graphics native cdylib
        run: cargo build --release --manifest-path lib/graphics/native/Cargo.toml
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Test (V2 + stack_align_guard, zero fires expected)
        run: cargo nextest run --no-fail-fast --profile ci --features stack_align_guard
      - name: Save cargo cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # STEP 4 — Miri hard-UB on a curated subset under V2.  Interpreter-on-Miri is
  # ~15 min/test, so this is a small representative set, not the full suite.
  # -Zmiri-disable-stacked-borrows gates the HARD memory UB (alignment / OOB /
  # UAF / uninit / leak), not the store layer's intentional aliasing.  Grow the
  # curated list as more shapes are validated clean.
  v2-miri:
    name: V2 Miri hard-UB (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 120
    env:
      MIRIFLAGS: '-Zmiri-disable-isolation -Zmiri-disable-stacked-borrows'
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Cache cargo + miri target
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/miri
          key: ${{ runner.os }}-v2-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-v2-miri-
      - name: miri setup (build the Miri sysroot)
        run: cargo +nightly miri setup
      - name: Miri hard-UB curated subset (V2)
        run: cargo +nightly miri test --test issues -- --exact p213_struct_field_basic_int
      - name: Save cargo cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/miri
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
