# @PLN21 Phase 4 (producer) — build a native loft LIBRARY's cdylib for every
# host triple.  A cdylib links the PUBLISHED loft-ffi (the C-ABI), not libloft,
# so it is rustc-independent and valid for any loft on the same loft-ffi version
# (keyed by the `loft_ffi_fp` each build reports).
#
# REUSABLE — a library's OWN CI calls this so prebuilts build automatically:
#   • on a PR        → validation gate (does the cdylib build on every host?),
#   • on a version tag → build + attach each cdylib to the GitHub release.
#
#   # loft-lang/loft-libs-<x>/.github/workflows/prebuild.yml
#   on:
#     pull_request:
#       paths: ['native/**', 'loft.toml']   # only when the native crate changes
#     push:
#       tags: ['*-v*']   # the `<name>-v<version>` release tag
#   jobs:
#     prebuild:
#       uses: loft-lang/loft/.github/workflows/prebuild-native.yml@main
#       with:
#         publish: ${{ startsWith(github.ref, 'refs/tags/') }}
#
# Also runnable standalone (`workflow_dispatch`) against any library repo.
#
# STATUS: producer scaffold.  The per-target `loft build-native` step is
# validated locally; the reusable/cross-repo CI orchestration has NOT been run
# end to end.  The index PR (`binaries[<triple>] = {url, sha256, loft_ffi_fp}`)
# is still the existing registry submit flow — each build prints its entry to the
# job summary for the author to paste (or for `registry_maintain.sh` to collect).
# Linux builds against ubuntu-latest's glibc; a manylinux base for older-system
# portability is a follow-on.

name: Prebuild native cdylibs (@PLN21)

on:
  workflow_call:
    inputs:
      package_subdir:
        type: string
        default: '.'
      publish:
        description: 'Attach the cdylibs to the release for this tag'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      library_repo:
        description: 'Library repo to build (e.g. loft-lang/loft-libs-graphics)'
        required: true
      library_ref:
        description: 'Tag/branch of the library to build'
        default: 'main'
      package_subdir:
        description: 'Package path within the repo (holds loft.toml + native/)'
        default: '.'

permissions:
  contents: write # `publish` attaches release assets to the caller's release

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: cdylib ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Native per-OS runner per target — the build is NATIVE, so the runner's
      # arch IS the target arch (build-native reports the host triple; the
      # matrix `target` label is decorative).  GitHub's macOS runners are all
      # Apple Silicon now (macos-13, the last Intel image, retired Dec 2025), and
      # Apple capped Intel at macOS Tahoe — so there is no native x86_64-apple
      # runner.  Ship arm64 macOS only; an Intel-mac prebuilt would need
      # `macos-15-intel` (sunset Fall 2027) or cross-compilation — add later if a
      # real Intel-Mac user base appears.  Add aarch64-unknown-linux-gnu via
      # cross once the glibc baseline is sorted.
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }

    steps:
      # The library: the CALLING repo on `workflow_call`, or a named repo on
      # `workflow_dispatch` (`inputs.library_repo` is unset for workflow_call, so
      # it falls back to the caller's own repo + ref).
      - name: Checkout library
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.library_repo || github.repository }}
          ref: ${{ inputs.library_ref || github.ref }}
          path: _library

      - name: Checkout loft
        uses: actions/checkout@v5
        with:
          repository: loft-lang/loft
          path: _loft

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Native dev libs some packages need to compile (e.g. graphics → ALSA/GL).
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold libasound2-dev libgl1-mesa-dev

      - name: Build loft (host)
        working-directory: _loft
        run: cargo build --release --bin loft

      # `loft build-native` compiles the package's native crate (no program runs)
      # and reports the cdylib path, host triple, and loft-ffi fp.
      - name: Build the native cdylib + capture metadata
        id: build
        shell: bash
        run: |
          out=$(_loft/target/release/loft build-native "_library/${{ inputs.package_subdir }}")
          echo "$out"
          cdylib=$(echo "$out" | sed -n 's/^cdylib: //p')
          triple=$(echo "$out" | sed -n 's/^triple: //p')
          fp=$(echo "$out"     | sed -n 's/^loft_ffi_fp: //p')
          [ -n "$cdylib" ] && [ -f "$cdylib" ] || { echo "build-native produced no cdylib"; exit 1; }
          asset="$(basename "$cdylib")"
          cp "$cdylib" "$asset"
          if command -v sha256sum >/dev/null; then sha=$(sha256sum "$asset" | cut -d' ' -f1);
          else sha=$(shasum -a 256 "$asset" | cut -d' ' -f1); fi
          echo "asset=$asset"   >> "$GITHUB_OUTPUT"
          echo "triple=$triple" >> "$GITHUB_OUTPUT"
          # The index entry a publish step writes into binaries[<triple>].
          {
            echo "### prebuilt: $triple"
            echo '```json'
            echo "\"$triple\": { \"url\": \"<release-asset-url>\", \"sha256\": \"$sha\", \"loft_ffi_fp\": \"$fp\" }"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cdylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdylib-${{ steps.build.outputs.triple }}
          path: ${{ steps.build.outputs.asset }}
          if-no-files-found: error

      # On a tag (publish=true) attach the cdylib to the GitHub release the
      # author created in their submit flow; the index PR then points at it.
      - name: Attach to release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.build.outputs.asset }}" --clobber
