# @PLN78 step 7 — does the last release rebuild from its own source?
#
# The published sha256 attests that the maintainer uploaded these bytes.  Rebuilding
# them here upgrades the claim to "the SOURCE produces these bytes", which is the one a
# user actually wants and the only one that survives a compromised build machine.
#
# One job per PUBLISHED target, each rebuilding it on the runner that natively builds it in
# release.yml — a cross-compiled binary is not expected to equal a natively built one,
# so pairing them any other way would compare two different things and call the
# difference a regression.
#
# Each job installs the exact rustc that release recorded in its bundle's BUILD-INFO,
# into a throwaway RUSTUP_HOME, and discards it with the workspace.  Nothing here pins
# the repo's toolchain: `rust-toolchain.toml` keeps floating on stable by design
# (@PLAN53), and the verifier pins per release instead.
#
# NOT a required check, for the same reason `browser-threads` is not: a red here is a
# real finding, but it depends on a published release and on network, and neither
# belongs in a PR's critical path.  A release that predates BUILD-INFO exits 3
# ("cannot verify") rather than green — an unverifiable release must never read as a
# verified one.
name: Reproducible build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to verify (default: the latest).'
        required: false
        default: ''
  # Called by `release-gate.yml`: one deliberate run of every nightly against ONE
  # commit, ending in one verdict (the release evidence — RELEASE.md § The nightlies).
  # A called workflow sees its CALLER's event, which is a dispatch or a probe push and
  # never `pull_request`, so it takes the same full path the schedule takes.
  # Under the gate the LATEST release is what gets rebuilt (the candidate has none
  # yet); what the gate proves is that the reproducibility contract still holds on
  # the tree about to be tagged (`roundtrip`) and on the release it succeeds.
  workflow_call:
    inputs:
      version:
        description: 'Release to verify (default: the latest).'
        required: false
        default: ''
        type: string
  # Weekly, not nightly: the answer only changes when a release does, and each job pays
  # a full cold build of loft.
  schedule:
    - cron: '0 6 * * 1'
  # …and on any PR that touches the reproducibility contract itself.  The published-release
  # jobs below cannot run here (there is no release for a PR), but `roundtrip` can, and this
  # is the only moment a break is attributable: the weekly job reports it days later, on a
  # commit that merely inherited it.  Both causes found so far — a timestamped build stamp
  # and an unlocked dependency set — are edits to exactly these files.
  pull_request:
    paths:
      - 'build.rs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.gitignore'
      - 'scripts/repro-flags.sh'
      - 'scripts/repro-verify.sh'
      - 'scripts/repro-roundtrip.sh'
      - 'scripts/make-release.sh'
      - '.github/workflows/repro-build.yml'

permissions:
  contents: read

env:
  # @PLN184 D1 — Python decodes files as UTF-8 on every runner (Windows defaults to cp1252).
  PYTHONUTF8: '1'
  CARGO_TERM_COLOR: always

jobs:
  # Does THIS commit rebuild to the same bytes from an exported tree?  No release, no
  # network — so it can run on a PR, which is where a break is cheapest to attribute.
  #
  # It answers a strictly weaker question than `reproduce` below (same toolchain, same
  # machine, one commit) and catches a strictly earlier failure: both real causes so far
  # were visible here, days before any release existed to verify.
  roundtrip:
    # @windows-exempt: the reproducible-build check of the Linux release artefact
    name: Round trip (this commit)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          # `git archive HEAD` needs the commit, and the probe reads `git rev-parse` —
          # a shallow checkout of a merge ref would export something no release matches.
          fetch-depth: 0
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: repro-roundtrip-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Round-trip this commit
        run: bash scripts/repro-roundtrip.sh
      - name: Save cargo cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  reproduce:
    name: Rebuild ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # No published release to verify on a PR; `roundtrip` covers that case instead.
    if: github.event_name != 'pull_request'
    # Empty on every row but Linux, which then runs on the runner itself.
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # In release.yml's image: its glibc and C toolchain are part of the bytes.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.10.16-1@sha256:1e7b8460ad8fb3fb0fbe1cd818845159ac896b4fd17452d56e892c291f3b97a8
          - os: macos-latest
            target: aarch64-apple-darwin
          # Every triple release.yml PUBLISHES, verified — otherwise we ship a binary
          # nobody ever rebuilds.  Pinned by `repro_matrix_covers_every_published_triple`.
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      # rustup and gh are preinstalled on every runner but not in the manylinux image the
      # Linux row runs in.  rustup comes with no toolchain: the script installs the
      # RELEASE's rustc itself, so a toolchain here would only be the wrong compiler.
      - name: Install rustup and gh (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          # The container's $HOME (/github/home) is not root's passwd home (/root), which
          # rustup-init's anti-sudo check now refuses outright (run 41548936060).  The mismatch
          # is the runner's design, not a sudo: skip that check.
          RUSTUP_INIT_SKIP_SUDO_CHECK=yes timeout 300 curl -fsSL --retry 3 https://sh.rustup.rs | RUSTUP_INIT_SKIP_SUDO_CHECK=yes sh -s -- -y -q --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          timeout 300 curl -fsSL --retry 3 -o /etc/yum.repos.d/gh-cli.repo https://cli.github.com/packages/rpm/gh-cli.repo
          timeout 600 dnf -y -q install gh unzip

      - name: Rebuild the release and compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Where the rebuild works.  Any directory will do: scripts/repro-flags.sh erases the
          # absolute paths on both sides (the release's and this rebuild's), and
          # repro-verify.sh resolves this root's symlinks (not on Windows) before use.
          LOFT_REPRO_ROOT: ${{ runner.os == 'Windows' && 'C:\loft-repro' || '/tmp/loft-repro' }}
          LOFT_REPRO_OUT: ${{ runner.temp }}/repro-out
        run: |
          set +e
          bash scripts/repro-verify.sh --target ${{ matrix.target }} ${{ inputs.version && format('--version {0}', inputs.version) || '' }}
          code=$?
          set -e
          case $code in
            0) echo "::notice title=Reproducible::${{ matrix.target }} rebuilt identically" ;;
            3) echo "::warning title=Cannot verify::${{ matrix.target }} — see the reason above (an unverifiable release is not a verified one)" ;;
            *) echo "::error title=Not reproducible::${{ matrix.target }} rebuilt to different bytes" ;;
          esac
          # Exit 3 ("cannot verify") is not a failure of THIS workflow: it is the honest
          # state until a release ships BUILD-INFO.  A mismatch still fails.
          [ $code -eq 3 ] && exit 0
          exit $code

      - name: Keep the rebuilt binary when it differs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repro-rebuilt-${{ matrix.target }}
          path: ${{ runner.temp }}/repro-out
          if-no-files-found: ignore
          retention-days: 7
