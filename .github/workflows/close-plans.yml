# Close loft-lang/plans issues when a PR that resolves them merges to main.
#
# GitHub's native `Fixes #N` auto-close is SAME-REPO only, so it can never close
# a plan that lives in the separate loft-lang/plans repo.  This workflow is the
# cross-repo closer: on a merge to `main`, it scans the PR body for plan-close
# directives (`Closes @PLN22` / `Fixes loft-lang/plans#22`) and runs
# scripts/close-shipped-plans.sh, which sets each plan `status:finished` + closes
# it.  Idempotent — safe if a plan is referenced by more than one PR.
#
# REQUIRES a repo/org secret `PLANS_TOKEN`: a fine-grained PAT or GitHub App
# token with **Issues: write** on loft-lang/plans (the default GITHUB_TOKEN is
# scoped to THIS repo and cannot touch the plans repo).  Without it the job
# logs a warning and no-ops, so it never blocks a merge.
name: close plans on merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  # Cargo 1.100 (stable since 2026-11-09) builds into a new build-dir layout with no
  # target/<profile>/deps/, which the native toolchain (src/toolchain.rs), make-release.sh
  # and the cdylib builds still read.  Its temporary opt-out keeps the old layout until they
  # read the new one; cargo drops the opt-out one release later (rust-lang/cargo#17182).
  __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT: "1"
  # @PLN184 D1 — Python decodes files as UTF-8 on every runner (Windows defaults to cp1252).
  PYTHONUTF8: '1'

jobs:
  close-plans:
    # @windows-exempt: platform-free — closes plan issues
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The C backend's compiler on Windows: MSYS2 gcc 16, not the runner's MinGW-Builds 15.2.
      # A no-op on this Linux job; the `if` keeps an older checkout's missing action unread.
      - if: runner.os == 'Windows'
        uses: ./.github/actions/windows-gcc
      - name: Close referenced plan issues
        env:
          GH_TOKEN: ${{ secrets.PLANS_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PLANS_TOKEN not set — skipping cross-repo plan auto-close."
            exit 0
          fi
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          scripts/close-shipped-plans.sh --body-file /tmp/pr_body.txt --yes
