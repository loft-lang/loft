#
# library-ci-reusable — the ONE library CI gate, called by every loft-lang/loft-libs-*
# repo.  Replaces the per-repo copies of library-ci.yml, which had drifted (stale
# `jjstwerff/loft` checkout URL in 5 of 6 repos, an incomplete package matrix in
# some, and no CI at all in loft-libs-docs).  A lib repo's own workflow becomes a
# ~10-line caller passing its package list; the build logic + the loft URL live
# here, so they stay in lockstep across all libraries.
#
# Called as:
#   jobs:
#     ci:
#       uses: loft-lang/loft/.github/workflows/library-ci-reusable.yml@main
#       with:
#         packages: '["shapes","gridmesh"]'
name: library-ci-reusable

on:
  workflow_call:
    inputs:
      packages:
        description: 'JSON array of package dirs in the repo, e.g. ["shapes","gridmesh"]'
        required: true
        type: string
      loft-ref:
        description: 'loft ref to build + validate against (default: main)'
        required: false
        default: main
        type: string
      stale-days:
        description: 'days without activity before unreleased work is red (default: 14)'
        required: false
        default: 14
        type: number

# ⚠ A CALLED workflow can only REDUCE what the caller lends it — never elevate.  Asking
# for a scope the caller has not granted is a STARTUP FAILURE: no job, no annotation, no
# log, and GitHub says only "This run likely failed because of a workflow file issue".
# Adding `pull-requests: read` here (for the `unreleased work` job) did exactly that in
# every loft-libs-* repo for five days, because those repos default to `read`, which is
# `contents` + `packages` and nothing else (loft#1492).  So the PR scope is lent by the
# CALLER — `scripts/deploy-library-ci.sh` writes it into each stub — and this block stays
# at what every caller already has.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                       # one broken package must not hide the others
      matrix:
        package: ${{ fromJson(inputs.packages) }}
    name: ${{ matrix.package }}
    steps:
      - name: Checkout the library
        uses: actions/checkout@v4

      - name: Install mold (loft's pinned linker)
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Checkout loft (loft-lang/loft — the current org URL)
        uses: actions/checkout@v4
        with:
          repository: loft-lang/loft          # was `jjstwerff/loft` in the drifted copies
          ref: ${{ inputs.loft-ref }}
          path: loft-src

      # ⚠⚠ THE KEY MUST CARRY LOFT'S COMMIT, NOT ITS BRANCH NAME.
      #
      # It used to be `loft-ref` + `hashFiles(Cargo.lock)`.  `loft-ref` is a BRANCH
      # (`main`), and `Cargo.lock` does not change when loft's *source* does — so every
      # commit to loft `main` produced the SAME key.  The cache then restored a
      # `loft-src/target` built against the previous `libloft.rlib`, and a library's
      # native cdylib linked against it failed at run time with `native function not
      # loaded` — which reads as a stale local build and is nothing of the kind.
      #
      # Measured 2026-08-21: after loft#1057 merged, loft-libs-graphics' next PR run
      # failed five `--deps` tests this way, while the identical suite passed locally
      # against the same loft commit with freshly built cdylibs.  The `restore-keys:`
      # prefix made it worse, not better — it is a deliberate fallback to ANY older
      # entry, which is exactly the stale artefact we must not take.
      #
      # A cache key has to name everything the cached artefact was built FROM.  This one
      # omitted the only input that actually varies.
      - name: Resolve the loft commit (for the cache key)
        id: loftsha
        run: echo "sha=$(git -C loft-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo + loft build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            loft-src/target
          key: library-ci-loft-${{ steps.loftsha.outputs.sha }}-${{ hashFiles('loft-src/Cargo.lock') }}
          # ⚠ Restore-keys deliberately narrowed to the REGISTRY dimension only — see
          # above.  A prefix that can restore another commit's `target/` is the defect.
          restore-keys: |
            library-ci-loft-${{ steps.loftsha.outputs.sha }}-

      - name: Build loft
        working-directory: loft-src
        run: |
          cargo build --release --lib --bin loft
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # System libraries the package's native crate links against, declared as
      # `build-deps` in loft.toml (graphics → libgl-dev, libasound2-dev).  Needed on
      # BOTH gates: the cdylib is built even under --interpret, because #native fns
      # are called through it.
      #
      # The package's OWN loft.toml is not enough.  `input` declares no build-deps
      # yet depends on `graphics`, whose cdylib is what actually needs GL/ALSA — so
      # a scan of the package alone leaves it red for a reason its manifest never
      # mentions.  Resolving the deps first and scanning THEIR manifests too makes
      # this correct for the whole tree without hard-coding a package list.
      - name: Install system build-deps (this package and its resolved deps)
        working-directory: ${{ matrix.package }}
        run: |
          set -u
          loft install > /dev/null 2>&1 || true      # populate ~/.loft/registry for the scan
          # DISCOVERY is best-effort: "nothing found" is an ordinary answer, not a
          # failure.  GitHub runs this with `bash -e`, so every component's exit
          # status matters, and on a normal package THREE of them are non-zero —
          # the registry glob matches nothing (`cat` → 1) when a package has no
          # deps, and a filter that removes every line (`grep -v` → 1) when nobody
          # declares build-deps.  Under `pipefail` any one of those killed the step,
          # which is what reddened seven of the eight adoption PRs.  So: no
          # pipefail, `sed` instead of `grep`, and `|| true` on the whole thing.
          # apt-get below still fails loudly — that one IS a real error.
          deps=$( { sed -n 's/^ *build-deps *= *"\(.*\)"/\1/p' loft.toml 2>/dev/null
                    cat ~/.loft/registry/*/loft.toml 2>/dev/null \
                      | sed -n 's/^ *build-deps *= *"\(.*\)"/\1/p'
                  } | tr ',' '\n' | tr -d ' ' | sed '/^$/d' | sort -u | tr '\n' ' ') || true
          if [ -n "$deps" ]; then
            echo "installing build-deps: $deps"
            sudo apt-get install -y $deps
          else
            echo "no build-deps declared by this package or its deps"
          fi

      # A library's OWN CI denies warnings on its own code by default (a package may
      # opt out with a `.allow_warnings` file in its dir) — distinct from the loft-side
      # revalidate-libs gate, which tolerates warnings (a new loft warning must not fail
      # an already-shipped lib).
      #
      # LOFT_STORE_GUARD arms loft's own store-lifetime checks on the library's code
      # while its tests run: the Goal-E reclaim assertion (a store the model calls dead
      # but that outlives a later allocation — a hard failure) plus the advisory
      # confinement report on stderr.  It costs no new test and needs no consumer, so a
      # brand-new package passes it on day one.  Verified across all 25 published
      # packages on both backends before it was turned on: zero failures, one advisory
      # note (`cbor`).
      # Both legs below report WHY they failed into the run summary, not only into
      # their own job log.
      #
      # `fail-fast: false` above already keeps every package's verdict — but the run
      # page then shows N red dots and nothing else, so telling two failures apart
      # means opening two logs and scrolling each.  That is the difference between
      # "regex and random are red" and the actionable version: regex is two
      # `shadowed-by-method` warnings on free functions no bare call can reach, while
      # random is one `never-read` variable in a test file.  Same colour, unrelated
      # work, and the summary is what says so at a glance.
      #
      # The gated lines are the ones a reader acts on — `FAIL` (which file, and the
      # gate that rejected it), `Warning[...]` (what `--deny-warnings` tripped on) and
      # `error`.  Capped, because a summary that dumps a whole log is a log.
      - name: Interpret — ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        env:
          LOFT_DENY_WARNINGS: ${{ hashFiles(format('{0}/.allow_warnings', matrix.package)) != '' && '0' || '1' }}
          LOFT_STORE_GUARD: 1
        run: |
          set -o pipefail
          loft --interpret --tests tests 2>&1 | tee "$RUNNER_TEMP/interpret.log" && exit 0
          status=$?
          {
            echo "### ❌ \`${{ matrix.package }}\` — interpret"
            echo
            echo '```'
            grep -E '^[[:space:]]*(FAIL|Warning\[|error)' "$RUNNER_TEMP/interpret.log" | head -40 \
              || echo "(no FAIL/Warning line — see the job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Native — ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        env:
          LOFT_DENY_WARNINGS: ${{ hashFiles(format('{0}/.allow_warnings', matrix.package)) != '' && '0' || '1' }}
          LOFT_STORE_GUARD: 1
        run: |
          set -o pipefail
          LOFT_TIMEOUT=240 loft --native --tests tests 2>&1 | tee "$RUNNER_TEMP/native.log" && exit 0
          status=$?
          {
            echo "### ❌ \`${{ matrix.package }}\` — native"
            echo
            echo '```'
            grep -E '^[[:space:]]*(FAIL|Warning\[|error)' "$RUNNER_TEMP/native.log" | head -40 \
              || echo "(no FAIL/Warning line — see the job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # ── The guide, which is a program ──────────────────────────────────────
      #
      # `docs/*.loft` is the package's getting-started guide (LIBRARY_AUTHORING § 2c):
      # prose in comments, code between, and `fn main` calling every section.  It is a
      # RUNNING loft program, which is the only reason its examples cannot rot — so it
      # has to be run, and the two steps above do not reach it.  `loft test` scans
      # `tests/`; a guide is a program, not a suite.
      #
      # This step is what retired loft's hardcoded delegation list.  `tests/wrap.rs` and
      # `tests/doc_lib_examples.rs` used to name `14-image.loft` and `21-random.loft` as
      # string literals, so a library's guide was covered only if someone remembered to
      # edit two files in another repo, and the prose lived there too — one home for the
      # text, two for the coverage, and both drifted.  A guide that lives in its package
      # is run by its package, by the rule that it is a `.loft` file under `docs/`, and
      # there is no list to forget (loft @PLN149 step 9).
      #
      # Both backends AND a comparison, not either alone: a guide that prints one thing
      # under the interpreter and another under `--native` is a defect in the language
      # that the guide is the first to see, and each backend on its own says nothing
      # about the other.  That agreement check is the property inherited from
      # `doc_lib_examples.rs`, which is deleted in the same change.
      #
      # A package with no guide says so and passes.  Writing `docs/01-getting-started.loft`
      # is the whole of what it takes to be covered here and to appear on the doc site.
      - name: Guide — ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        env:
          LOFT_DENY_WARNINGS: ${{ hashFiles(format('{0}/.allow_warnings', matrix.package)) != '' && '0' || '1' }}
          LOFT_STORE_GUARD: 1
        run: |
          set -u
          shopt -s nullglob
          guides=(docs/*.loft)
          if [ ${#guides[@]} -eq 0 ]; then
            echo "no docs/*.loft — this package ships no guide (LIBRARY_AUTHORING § 2c)"
            exit 0
          fi
          rc=0
          for g in "${guides[@]}"; do
            echo "guide $g"
            for mode in --interpret --native; do
              out="$RUNNER_TEMP/guide-$(basename "$g" .loft)${mode}.out"
              if ! LOFT_TIMEOUT=240 loft "$mode" "$g" > "$out" 2>"$out.err"; then
                rc=1
                {
                  echo "### ❌ \`${{ matrix.package }}\` — guide \`$g\` failed on \`$mode\`"
                  echo
                  echo '```'
                  grep -E '^[[:space:]]*(error|assertion|Warning\[|advice\[)' "$out.err" | head -30 \
                    || tail -20 "$out.err"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                cat "$out.err"
              fi
            done
            i="$RUNNER_TEMP/guide-$(basename "$g" .loft)--interpret.out"
            n="$RUNNER_TEMP/guide-$(basename "$g" .loft)--native.out"
            if [ -f "$i" ] && [ -f "$n" ] && ! diff -u "$i" "$n" > "$RUNNER_TEMP/guide.diff"; then
              rc=1
              {
                echo "### ❌ \`${{ matrix.package }}\` — guide \`$g\`: the backends disagree"
                echo
                echo "The same program printed different things under \`--interpret\` and"
                echo "\`--native\`.  That is a language defect the guide is the first to see."
                echo
                echo '```diff'
                head -40 "$RUNNER_TEMP/guide.diff"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              cat "$RUNNER_TEMP/guide.diff"
            fi
          done
          exit $rc

      # ── The wasm target, which nothing measured ────────────────────────────
      #
      # A `[native] crate` is cross-built AS A WHOLE for `wasm32-wasip2`, so ONE
      # dependency without a wasm32 target takes the entire package off
      # `--native-wasm` — including the parts that never wanted a device.
      # `graphics` shipped that way for months: `winit` and `glutin` were
      # unconditional, cargo failed before reaching any of the package's own code,
      # and its software canvas, mesh maths and PNG encoder went down with the
      # window layer they have nothing to do with.
      #
      # Nothing here could have caught it.  The two gates above are `--interpret`
      # and `--native`; there was no wasm target in this workflow at all, and
      # `loft test` has no `--native-wasm` mode — it compiles a program, and a
      # suite is not one.  So a library reporting a green suite had said nothing
      # about whether it cross-builds, and @PLN111 recorded graphics as "passes
      # native-wasm 68/68" for something that could not be BUILT for it.  That is
      # the specific false green this step closes.
      #
      # Cheap: a package with no `[native] crate` has nothing to cross-build and
      # says so; the heaviest one that has (graphics — image, fontdue, png, rodio,
      # gl) is 13 s cold against a warm registry.
      #
      # Measured 2026-08-25 across all 44 packages: 8 have a native crate, and
      # `server` / `ssh` / `web` cannot cross-build because their TLS stack
      # (`ring`, `aws-lc-sys`) has C build scripts with no wasm32 target.  Each
      # of those carries a `.wasm_exempt` file — the same per-package marker
      # shape `.allow_warnings` already uses above, so there is one convention
      # here rather than two.
      #
      # A marker, not a default: a package is gated unless it carries one, so the
      # next package added is covered without anyone remembering to opt it in.
      # And the exemption is loud — it prints and writes to the job summary on
      # every run, with the reason read out of the file — because the failure
      # mode of a quiet exemption is that it outlives its reason.  Putting it in
      # the library repo also means it can be committed BEFORE this gate reaches
      # `main`, so no package is ever red for a rule that arrived without it.
      #
      # What a red here means, and the shape that fixes it:
      # WASM.md § When the crate needs a device the target does not have.
      - name: WASM cross-build — ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: |
          set -u
          if [ ! -f native/Cargo.toml ]; then
            echo "no [native] crate — nothing to cross-build (the loft half is target-independent)"
            exit 0
          fi
          if [ -f .wasm_exempt ]; then
            echo "declared wasm-exempt — NOT cross-built.  Stated reason:"
            sed 's/^/    /' .wasm_exempt
            {
              echo "### ⚠ \`${{ matrix.package }}\` — wasm cross-build skipped (declared exempt)"
              echo
              echo "Its native crate is declared unable to target wasm32, so this package"
              echo "does not ship on \`--native-wasm\`.  Delete \`${{ matrix.package }}/.wasm_exempt\`"
              echo "once that stops being true.  The reason it gives:"
              echo
              echo '```'
              cat .wasm_exempt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rustup target add wasm32-wasip2
          set -o pipefail
          cargo build --release --target wasm32-wasip2 \
            --manifest-path native/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/wasm.log" && exit 0
          status=$?
          {
            echo "### ❌ \`${{ matrix.package }}\` — wasm cross-build"
            echo
            echo "The native crate no longer builds for \`wasm32-wasip2\`, so the package"
            echo "is off \`--native-wasm\` entirely — its pure halves included."
            echo "See WASM.md § When the crate needs a device the target does not have."
            echo
            echo '```'
            grep -E '^error' "$RUNNER_TEMP/wasm.log" | head -20 \
              || echo "(no error line — see the job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Worked-example citations resolve (@PLN141) — the SAME shared gate loft runs on
      # its own tree, pointed at this package.  Every `// Example: @AAA-###` on a fn must
      # resolve to exactly one `// @AAA-###`-tagged fn in the repo the acronym names
      # (dangling / duplicate / unregistered = drift, red).  The logic + the acronym
      # registry live in loft-src, so all libraries share ONE gate — no per-repo copy to
      # drift.  Vacuously green for a package with no citations, so it is safe on every
      # library from day one and only begins gating once the package opts in by authoring
      # a citation.  REPO_ROOT is the library checkout; the acronym resolves in place.
      # Two checks, vacuously green until the package authors tags:
      #   examples       — every `// Example: @AAA-###` citation resolves to a tagged fn
      #   examples-index — the committed examples-index.tsv (tag -> file:line -> blob link)
      #                    is current.
      #
      # ⚠ ADVISORY HERE, GATING INSIDE LOFT — and that asymmetry is the point.  These are
      # the only two checks that span repositories: this job runs LOFT's script against
      # THIS library, so the rules arrive from whatever loft `main` happens to be.  It bit
      # in both directions before being tiered: `exindex` landed in loft 2026-08-18 and
      # reddened loft-libs-game's next PR for a file it never touched (last green run
      # 2026-08-17), and switching a library CHECKOUT's branch turned loft's own run red
      # with two dangling tags — a failure with no bad commit in either repo.  A gate whose
      # rules change under you, from a repo you do not control, lands its red on whoever
      # opens the next PR.
      #
      # It follows the repo's own diagnostic rule (CLAUDE.md): a diagnostic gates if and
      # only if ignoring it can produce a WRONG RESULT.  A dangling doc citation is a broken
      # link — it cannot.  So it advises, LOUDLY: the findings go to the job summary in full,
      # the same place a failing test writes its excerpt.  `EXAMPLES_GATE=hard` restores the
      # blocking behaviour for a repo that wants it.
      - name: Worked-example tags resolve — ${{ matrix.package }}
        env:
          EXAMPLES_REPO_ROOT: ${{ github.workspace }}
          EXAMPLES_CITE_ROOTS: ${{ matrix.package }}/src ${{ matrix.package }}/tests
        run: |
          log="$RUNNER_TEMP/examples-${{ matrix.package }}.log"
          bash loft-src/scripts/check_doc_drift.sh examples       2>&1 | tee    "$log"
          bash loft-src/scripts/check_doc_drift.sh examples-index 2>&1 | tee -a "$log"
          # The index is DERIVED and this repo commits nothing: build it here, every run,
          # so it cannot be stale.  Published below and uploaded as an artifact.
          bash loft-src/scripts/check_doc_drift.sh emit-examples-index \
            > "$RUNNER_TEMP/examples-index.tsv"
          # `warning(s)` is the advisory summary line; anything else is clean.  The script
          # exits 0 in this mode, so the summary block is the ONLY signal — which is why it
          # carries the whole finding and the runnable cure, not a pointer to the log.
          if grep -q 'warning(s)' "$log"; then
            {
              echo "### ⚠️ \`${{ matrix.package }}\` — worked-example docs need attention"
              echo
              echo "Advisory: this does **not** fail the build.  It is the documentation gate"
              echo "loft owns, run against this library."
              echo
              echo "Reproduce locally with a real exit code, from a loft checkout:"
              echo '`make examples-preflight REPO=/path/to/${{ github.event.repository.name }}`'
              echo
              echo '```'
              sed -e 's/\x1b\[[0-9;]*m//g' "$log" \
                | grep -vE '^\s*ok( |$)' | grep -vE '^clean \(' | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # The index itself, always — this is what replaces the committed file.  Folded so
          # it costs a reader nothing until they want it.
          if [ -s "$RUNNER_TEMP/examples-index.tsv" ] \
             && grep -qE '^@' "$RUNNER_TEMP/examples-index.tsv"; then
            {
              echo "<details><summary>📇 <code>${{ matrix.package }}</code> — worked-example index"
              echo "($(grep -cE '^@' "$RUNNER_TEMP/examples-index.tsv") tag(s), generated)</summary>"
              echo
              echo '```'
              cat "$RUNNER_TEMP/examples-index.tsv"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload worked-example index — ${{ matrix.package }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examples-index-${{ matrix.package }}
          path: ${{ runner.temp }}/examples-index.tsv
          if-no-files-found: ignore

      # Library compatibility contract, step 4 — ADVISORY, never gating.
      #
      # Compares this package against a sample of its own published releases: the latest, the
      # declared `api_compatible_with` floor, and one RANDOM release in between.  O(1) per run
      # whatever the history, and the random draw is what makes it mean — a break cannot hide
      # in a version nobody ever looks at.  The draw is printed and can be pinned with
      # LOFT_COMPAT_SAMPLE, so a red reproduces instead of reshuffling into green.
      #
      # GATING, but only for a package that DECLARES `api_compatible_with`.  Declaring a floor
      # is the act of entering the contract: a package that declares nothing has promised
      # nothing, so this stays advisory for it and cannot fail its build.  No published package
      # declares one today, which is what makes turning this into a gate safe — it can only
      # start failing a build after its author opts in.
      #
      # Raising the floor is the supported way to break, and it does NOT buy silence: the
      # sub-floor releases are still compared and reported as a DECLARED BREAK.  Keeping the
      # promise is the quiet path; withdrawing one is the loud path.  Design:
      # doc/claude/plans/library-compat-contract/README.md.
      - name: Compatibility with published releases — ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: loft compat check

      - name: Rust integration tests (if present)
        if: hashFiles(format('{0}/native/tests/*.rs', matrix.package)) != ''
        working-directory: ${{ matrix.package }}/native
        run: cargo test --release

      # Phase 6t Tier 4 — run each declared dependency's own tests against the loft
      # built here.  Catches "we shipped a dep version that breaks this consumer" at
      # the consumer, which is the only place it is visible.  The drifted per-repo
      # copies in graphics/world/game already gated on this; keeping it means the
      # unified workflow is a SUPERSET of every copy it replaces, so adopting it
      # cannot quietly lose coverage a repo already had.
      - name: Transitive dep tests
        working-directory: ${{ matrix.package }}
        run: LOFT_TIMEOUT=240 loft test --deps

  # Does this repo carry work that never reached anyone?  A branch ahead of the default
  # branch with no PR, a PR nobody has touched, or a loft.toml version the registry has
  # never seen.  All three are invisible from inside a package's own test run, and the
  # maintainer's `registry_maintain.sh` only surfaces the first two during a publish —
  # by which time a branch has typically been sitting for months.
  #
  # Its own job, not a step in the matrix: the question is about the REPO, and asking it
  # once per package would multiply the API calls by the package count and report the
  # same finding fourteen times.  It also runs whatever the tests do, because a red test
  # and a forgotten branch are unrelated problems and hiding the second behind the first
  # helps nobody.
  #
  # The threshold is days since last ACTIVITY (`stale-days`, default 14).  A gate that
  # counts age-since-creation reddens long-running work that is actively moving, which is
  # how a step gets ignored.  What it cannot read — a `gh` call that fails, an
  # unreachable index — it reports and never counts as clean.
  unreleased:
    runs-on: ubuntu-latest
    name: unreleased work
    steps:
      - name: Checkout the library
        uses: actions/checkout@v4

      # One file, not the whole engine: this job builds nothing, and a full loft checkout
      # to read a single script is minutes of clone for seconds of work.
      - name: Fetch the checker from loft
        uses: actions/checkout@v4
        with:
          repository: loft-lang/loft
          ref: ${{ inputs.loft-ref }}
          path: loft-src
          sparse-checkout: scripts/unreleased-work.py
          sparse-checkout-cone-mode: false

      - name: Branches, PRs and versions that never shipped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 loft-src/scripts/unreleased-work.py \
            --repo "${{ github.repository }}" \
            --packages '${{ inputs.packages }}' \
            --stale-days "${{ inputs.stale-days }}" \
            --summary "$GITHUB_STEP_SUMMARY"
