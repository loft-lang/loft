# The DAILY BUILD — a downloadable loft for people who cannot or should not build it.
#
# Named "daily" because that is the term users know; the real cadence is PER PR plus every
# push to `main`, which in practice is one or two a day (CLAUDE.md § Branch policy sets that
# cadence).  Calling it "per-PR build" would be more literal and less understood.
#
# Why it exists: the release bundles are attached to `v*` tags only, so between monthly
# releases there was nothing to download and the only way to run this month's loft was to
# compile it — which needs a machine that can survive `-C codegen-units=1` on a crate this
# size.  A laptop that runs out of memory there is exactly the case this serves.
#
# It builds the SAME artefact as a release, through the same script, deliberately:
# `scripts/make-release.sh` emits a self-contained bundle (bin/loft + default/ + examples +
# reference PDF + BUILD-INFO + SHA256SUMS).  A separate artefact shape would need its own
# install instructions and its own verification story, and would drift from the release one.
#
# NOT a required check, and it must not become one: it is a convenience, and a red bundle
# leg should never block a merge that the gate itself passed.
name: Daily build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which targets: all, or one triple (e.g. x86_64-pc-windows-msvc)'
        required: false
        default: 'all'

permissions:
  contents: read

# One bundle set per ref.  A rapid re-push should replace its predecessor rather than
# queue behind it — this job is never the thing anyone is waiting on.
concurrency:
  group: daily-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # @PLN184 D1 — Python decodes files as UTF-8 on every runner (Windows defaults to cp1252).
  PYTHONUTF8: '1'
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Empty on every leg but Linux, which then runs on the runner itself.
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same image as release.yml's Linux row (glibc 2.28): the reason is there.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.10.16-1@sha256:1e7b8460ad8fb3fb0fbe1cd818845159ac896b4fd17452d56e892c291f3b97a8
            glibc: '2.28'
          - target: x86_64-apple-darwin
            # macos-15 is Apple Silicon, so this leg CROSS-builds — the bundle it
            # produces cannot run on the runner that made it.  Same note as release.yml.
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A daily build answers `<last release>.<yyyymmdd>` (build.rs `effective_version`),
          # which needs the release tags.
          fetch-tags: true

      # A dispatch naming one triple builds only that leg; `all` (the default, and what a
      # PR or a push always does) builds every leg.
      - name: Should this leg run?
        id: want
        shell: bash
        run: |
          want='${{ github.event.inputs.targets }}'
          if [ -z "$want" ] || [ "$want" = all ] || [ "$want" = '${{ matrix.target }}' ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "skipped: dispatch asked for '$want'"
          fi

      - name: Install Rust stable
        if: steps.want.outputs.run == 'yes'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Mirrors release.yml: make-release.sh needs `zip`; the Linux leg runs as root in the
      # manylinux image (dnf, no sudo); macOS ships zip; Windows takes it from chocolatey.
      - name: Install packaging tools (Linux)
        if: steps.want.outputs.run == 'yes' && runner.os == 'Linux'
        run: timeout 600 dnf -y -q install zip unzip

      - name: Install packaging tools (Windows)
        if: steps.want.outputs.run == 'yes' && runner.os == 'Windows'
        # Chocolatey's feed answers 503 for hours at a time, and `choco` then reports
        # "installed 0/0" with exit 0.  The install is retried; when the feed stays down the
        # runner's preinstalled 7-Zip stands in (make-release.sh and the smoke test both take
        # `7z`), and the step fails only when neither is there.
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install zip unzip -y --no-progress
            if (Get-Command zip -ErrorAction SilentlyContinue) { exit 0 }
            Write-Host "zip not installed (attempt $i of 3)"
            Start-Sleep -Seconds (15 * $i)
          }
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            Write-Host "chocolatey is unavailable - 7-Zip packs and unpacks the bundle"
            exit 0
          }
          Write-Error "neither zip nor 7z is available"
          exit 1

      - name: Cache cargo
        if: steps.want.outputs.run == 'yes'
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: daily-${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the self-contained bundle
        if: steps.want.outputs.run == 'yes'
        shell: bash
        run: scripts/make-release.sh ${{ matrix.target }}

      # Which COMMIT a bundle came from is the question a daily build gets asked most, and
      # the zip's own BUILD-INFO records version + target + rustc but not the sha.  Stamped
      # beside it rather than into it, so the bundle stays byte-identical to a release one.
      - name: Stamp the source it came from
        if: steps.want.outputs.run == 'yes'
        shell: bash
        run: |
          {
            echo "commit:  ${{ github.sha }}"
            echo "ref:     ${{ github.ref }}"
            echo "event:   ${{ github.event_name }}"
            echo "pr:      ${{ github.event.pull_request.number || '-' }}"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "target:  ${{ matrix.target }}"
            echo
            echo "This is a DAILY BUILD, not a release: it is whatever the source said at"
            echo "that commit, and it has not been through the release checklist."
          } > dist/DAILY-BUILD-INFO.txt
          ls -la dist/

      # A bundle that cannot run is worse than no bundle, so each leg that CAN execute its
      # own artefact does.  The two cross legs (x86_64 macOS on Apple Silicon) cannot, and
      # say so rather than skipping silently.
      - name: Smoke-test the bundle
        if: steps.want.outputs.run == 'yes'
        shell: bash
        run: |
          set -e
          zip=$(ls dist/*.zip | head -1)
          case "${{ matrix.target }}" in
            x86_64-apple-darwin)
              echo "cross leg (Apple Silicon runner builds x86_64): not executing $zip"
              exit 0 ;;
          esac
          rm -rf _smoke && mkdir _smoke
          if command -v unzip >/dev/null; then unzip -q "$zip" -d _smoke; else 7z x -bso0 -bsp0 -o_smoke "$zip"; fi
          root=$(ls -d _smoke/*/ | head -1)
          exe="${root}bin/loft"
          case "${{ matrix.target }}" in *windows*) exe="${root}bin/loft.exe";; esac
          chmod +x "$exe" 2>/dev/null || true
          echo 'fn main() { println("daily build ok"); }' > _smoke/hello.loft
          out=$("$exe" --interpret _smoke/hello.loft)
          echo "$out"
          [ "$out" = "daily build ok" ] || { echo "the bundle did not run its own program"; exit 1; }
          # The components ship and load (loft#2274): the same check as release.yml's smoke.
          scripts/smoke-components.sh "$exe"
          # The same artefact checks as release.yml's smoke: dynamically linked, so it can
          # load a library's native code, and no glibc newer than the row's floor.
          if [ -n "${{ matrix.glibc }}" ]; then
            readelf -l "$exe" | grep -q 'program interpreter' \
              || { echo "$exe is statically linked, so it cannot load a library's native code"; exit 1; }
            newest=$(objdump -T "$exe" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            [ "$(printf '%s\n%s\n' "$newest" "${{ matrix.glibc }}" | sort -V | tail -1)" = "${{ matrix.glibc }}" ] \
              || { echo "$exe needs glibc $newest, newer than ${{ matrix.glibc }}"; exit 1; }
            echo "dynamically linked, glibc $newest at most"
          fi

      - name: Upload the bundle
        if: steps.want.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: loft-daily-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/DAILY-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      # The runtime library the bundle deliberately leaves out — `libloft.rlib`, its `deps/`
      # and the standard library, in the installed layout (scripts/runtime_bundle.sh) — so
      # `make install-main` installs main's loft with `--native` working, without compiling it
      # (scripts/install_main_ci.sh).  The same target directory as the bundle's binary: the
      # library is already built as that binary's dependency, and the pair must be one build.
      - name: Package the runtime library
        # Not the cross leg: its proc-macros are the runner's architecture (runtime_bundle.sh).
        # Not Windows: an installed loft there cannot link `--native` yet — the import
        # libraries a dependency's build script names (`windows.0.48.5.lib`) live in build-script
        # output directories only a build tree has (LNK1181 in the smoke).
        if: steps.want.outputs.run == 'yes' && matrix.target != 'x86_64-apple-darwin' && matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          CARGO_INCREMENTAL=0 scripts/lean_build.sh --lib --bin loft --target ${{ matrix.target }}
          scripts/runtime_bundle.sh ${{ matrix.target }} dist

      # A runtime that cannot link a program is the one failure the download exists to avoid,
      # so each leg that can run its own artefact compiles one with `--native` against it.
      - name: Smoke-test the runtime (--native)
        # Not the cross leg: its proc-macros are the runner's architecture (runtime_bundle.sh).
        # Not Windows: an installed loft there cannot link `--native` yet — the import
        # libraries a dependency's build script names (`windows.0.48.5.lib`) live in build-script
        # output directories only a build tree has (LNK1181 in the smoke).
        if: steps.want.outputs.run == 'yes' && matrix.target != 'x86_64-apple-darwin' && matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -e
          case "${{ matrix.target }}" in
            x86_64-apple-darwin)
              echo "cross leg (Apple Silicon runner builds x86_64): not executing the runtime"
              exit 0 ;;
          esac
          rm -rf _rt && mkdir _rt
          tar -C _rt -xzf dist/loft-runtime-${{ matrix.target }}.tar.gz
          root="_rt/loft-runtime-${{ matrix.target }}"
          exe="$root/bin/loft"
          case "${{ matrix.target }}" in *windows*) exe="$root/bin/loft.exe";; esac
          echo 'fn main() { println("daily runtime ok"); }' > _rt/hello.loft
          out=$(LOFT_TIMEOUT=600 "$exe" --native _rt/hello.loft)
          echo "$out"
          [ "$out" = "daily runtime ok" ] || { echo "the runtime did not compile and run its own program"; exit 1; }

      - name: Upload the runtime
        # Not the cross leg: its proc-macros are the runner's architecture (runtime_bundle.sh).
        # Not Windows: an installed loft there cannot link `--native` yet — the import
        # libraries a dependency's build script names (`windows.0.48.5.lib`) live in build-script
        # output directories only a build tree has (LNK1181 in the smoke).
        if: steps.want.outputs.run == 'yes' && matrix.target != 'x86_64-apple-darwin' && matrix.target != 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: loft-daily-runtime-${{ matrix.target }}
          path: dist/loft-runtime-*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Save cargo cache (main only)
        if: steps.want.outputs.run == 'yes' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
