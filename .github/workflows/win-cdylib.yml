# Fast, manually-triggered Windows-only pass for the native-cdylib link path.
#
# WHY THIS EXISTS: the full `CI / Test (windows-latest)` job builds everything
# and runs the entire ~2000-test nextest suite (~15 min on top of the rest of
# the PR matrix) just to surface a handful of cdylib link failures (e.g.
# `LNK1181: cannot open input file 'windows.0.48.5.lib'`).  When iterating on a
# Windows-specific cdylib/link fix, that round-trip is far too slow.
#
# This workflow runs ONLY on `workflow_dispatch` (never on push/PR, so it adds
# zero load to the normal matrix), on Windows only, and runs ONLY the
# cdylib/native test binaries.  It restores the same cargo cache the main CI
# job populates, so the build is incremental.
name: Win cdylib (manual)

# Build-and-test only — the token never writes anywhere.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "nextest filter expression for the subset to run"
        required: false
        default: "binary(n2_cdylib) or binary(n3_use_native) or binary(n3_parity) or binary(native)"

env:
  # @PLN184 D1 — Python decodes files as UTF-8 on every runner (Windows defaults to cp1252).
  PYTHONUTF8: '1'

jobs:
  # @PLN26 phase 4 is FLIPPED: the C-ABI link is now the default on every host,
  # incl. Windows.  This job pins `LOFT_NATIVE_CABI=0` so it keeps exercising the
  # legacy rlib-link ESCAPE HATCH on Windows (the `win-cdylib-cabi` job covers
  # the C-ABI default).
  win-cdylib:
    name: Win cdylib subset (rlib escape hatch)
    runs-on: windows-latest
    env:
      LOFT_NATIVE_CABI: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Reuse the cache key the main CI `test` job writes, so this incremental
      # build starts warm.  restore-keys lets it fall back to any recent
      # Windows cargo cache when the exact Cargo.lock hash hasn't been seen yet.
      - name: Restore cargo registry and build cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The cdylib tests link a hand-driven rustc against the canonical
      # `target/debug/libloft.rlib`; `--all-targets` builds it plus every test
      # binary.  `CARGO_BIN_EXE_loft` (used by n3_use_native) comes from the
      # nextest build below.
      - name: Build test targets
        run: cargo build --all-targets

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The `||` fallback guards an empty `inputs.filter` (e.g. an API dispatch
      # that omits inputs).  `shell: bash` — Windows runners default to
      # PowerShell, where `$FILTER` is not an env-var reference, so nextest
      # would get an empty `-E ""`.
      - name: Run cdylib / native subset
        shell: bash
        env:
          FILTER: ${{ github.event.inputs.filter || 'binary(n2_cdylib) or binary(n3_use_native) or binary(n3_parity) or binary(native)' }}
        run: cargo nextest run --profile ci -E "$FILTER"
      - name: Save cargo cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # @PLN26 phase 4 — the Windows C-ABI link path (import-library linking, no
  # RPATH, DLL staged beside the binary), now the DEFAULT.  `LOFT_NATIVE_CABI=1`
  # is a no-op post-flip (it already matches the default) but pins the intent:
  # this job is the C-ABI regression guard for Windows; the `win-cdylib` job
  # above guards the rlib escape hatch.  `native_crate_package_links_and_runs_via_cabi`
  # (in `binary(native)`) is the non-vacuous check that actually links a
  # `[native] crate` cdylib by C-ABI.
  win-cdylib-cabi:
    name: Win cdylib subset (C-ABI default)
    runs-on: windows-latest
    env:
      LOFT_NATIVE_CABI: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo registry and build cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build test targets
        run: cargo build --all-targets

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run cdylib / native subset (C-ABI)
        shell: bash
        env:
          FILTER: ${{ github.event.inputs.filter || 'binary(n2_cdylib) or binary(n3_use_native) or binary(n3_parity) or binary(native)' }}
        run: cargo nextest run --profile ci -E "$FILTER"
      - name: Save cargo cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
