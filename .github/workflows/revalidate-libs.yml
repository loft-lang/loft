#
# revalidate-libs — compile + test every PUBLISHED registry library against THIS
# loft.  A language change (a new stdlib function, a new error/warning, a cast
# rule) can silently break a shipped library — exactly how adding `floor_mod`
# (C94) + the no-silent-redefinition rule (C95) broke shapes/time, caught only by
# a manual "compile every lib" sweep.  This makes that sweep a gate.
#
# @PLN102 freeze-critical: the stdlib may only grow if growth can't retro-break a
# shipped lib.  This job proves it, per change and nightly.
name: revalidate-libs

on:
  workflow_dispatch:
  # Called by `release-gate.yml`: one deliberate run of every nightly against ONE
  # commit, ending in one verdict (the release evidence — RELEASE.md § The nightlies).
  # A called workflow sees its CALLER's event, which is a dispatch or a probe push and
  # never `pull_request`, so it takes the same full path the schedule takes.
  workflow_call:
  schedule:
    - cron: '17 6 * * *'          # nightly, off the hour
  push:
    branches: [main]
    paths:                        # only the loft surface a library compiles against
      - 'default/**'              # the stdlib
      - 'src/**'                  # the compiler / type system
      - '.github/workflows/revalidate-libs.yml'
  pull_request:                   # catch a lib-breaking language change BEFORE it merges
    paths:
      - 'default/**'
      - 'src/**'
      - '.github/workflows/revalidate-libs.yml'

permissions:
  contents: read

# The group carries the CALLER's workflow name so a leg of `release-gate.yml` neither
# collides with nor cancels a standalone run on the same ref.
concurrency:
  group: revalidate-libs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Read the registry index (source of truth for what is installable) and emit one
  # matrix leg per published package at its latest version → (repo, tag, subpath).
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      # The matrix policy — which packages are checked, at which version, and which are
      # deliberately skipped — lives in `scripts/revalidate_matrix.py` and is read from
      # there by BOTH this job and `scripts/revalidate_libs_local.sh`, the same gate on a
      # work branch.  It used to be inlined here and re-implemented there, and the two
      # drifted on four questions: the compiler's own package (skipped here, checked
      # there, which made the local gate permanently red — loft#1315), the known-broken
      # map, the `subpath` default, and whether a YANKED version may be validated (it may
      # not; this copy had no such filter and could have reported on a version nobody can
      # install).  A policy with two readers gets one home.
      - name: Checkout loft (for the matrix policy)
        uses: actions/checkout@v4
      - id: m
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/loft-lang/registry/main/index.json -o index.json
          python3 scripts/revalidate_matrix.py index.json --format github >> "$GITHUB_OUTPUT"
          echo "discovered $(grep -oP 'count=\K\d+' "$GITHUB_OUTPUT" | tail -1) published libraries"

  revalidate:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one broken lib must not hide the others
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    name: ${{ matrix.name }} ${{ matrix.version }}
    steps:
      - name: Checkout loft (the version under validation)
        uses: actions/checkout@v4
        with:
          path: loft-src

      - name: Install mold (loft's pinned linker)
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Cache cargo + loft build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            loft-src/target
          key: revalidate-loft-${{ hashFiles('loft-src/Cargo.lock') }}
          restore-keys: revalidate-loft-

      - name: Build loft
        working-directory: loft-src
        run: |
          cargo build --release --lib --bin loft
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Checkout ${{ matrix.name }} @ ${{ matrix.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.tag }}
          path: lib

      # HARD GATE — does this published lib still work against THIS loft?  Warnings
      # are NON-contractual (a new deprecation must not fail a shipped lib), so
      # LOFT_DENY_WARNINGS stays off.  Run the full interpret suite first.  If it
      # fails, a #native lib's failure may be its Rust crate's system deps (e.g.
      # graphics -> ALSA / a display) rather than a language break — a generic runner
      # lacks those, but they are IRRELEVANT to language compatibility.  So on failure
      # we RE-CLASSIFY: compile every .loft against this loft with `--dump` (bytecode
      # only — no native crate build, no execution; a lib's tests import its whole
      # source, so this type-checks the public surface too).  Still compiles => the
      # failure was environment/deps (best-effort PASS; the full run is hard-gated in
      # the lib's own CI where its deps exist).  FAILS to compile => a genuine language
      # break (C95 redefinition, DN cast rules, a type change) retro-broke a shipped
      # lib => FAIL the gate.
      - name: Test against this loft — ${{ matrix.name }}  (hard gate)
        working-directory: lib/${{ matrix.sub }}
        run: |
          set -uo pipefail
          # Capture the suite output (pipefail makes the pipe carry loft's exit).
          if LOFT_TIMEOUT=240 loft --interpret --tests tests 2>&1 | tee suite.log; then
            echo "✅ ${{ matrix.name }} — full interpret suite green against this loft"
            exit 0
          fi
          echo "── full suite failed; re-classifying: language-break vs environment/native-deps ──"
          # Distil the runtime failure once — the assertion + the test's own context
          # prints — so BOTH branches below (best-effort PASS and hard FAIL) can name
          # the real cause instead of the bland "environment" verdict that let a real
          # runtime regression (e.g. the @PLN110 len/size flip corrupting multi-byte
          # text) hide behind a green.
          loft_sha="$(git -C "$GITHUB_WORKSPACE/loft-src" rev-parse --short HEAD 2>/dev/null || echo '?')"
          detail="$(grep -aiE 'FAIL |assertion|Error:|panic|expected|got |haystack|needle|mismatch' suite.log \
                    | grep -aviE 'Compiling|Downloaded|Updating|Finished' | tail -30)"
          [ -n "$detail" ] || detail="$(tail -20 suite.log)"
          rc=0; n=0
          while IFS= read -r f; do
            n=$((n+1))
            if ! loft --dump "$f" >/dev/null 2>dump.err; then
              echo "::error::COMPILE-BREAK in $f — a language change retro-broke ${{ matrix.name }}"
              sed 's/^/    /' dump.err
              rc=1
            fi
            # `-type f` is load-bearing: `loft --dump` WRITES a `tests/.loft` cache
            # directory beside the file it compiles, and the glob `*.loft` matches that
            # name.  `find` streams through the process substitution, so the directory
            # THIS loop creates can be handed straight back to it, `--dump` fails on a
            # directory, and a runtime/environment failure is then reported as
            # "COMPILE-BREAK" — a shipped library falsely accused of a freeze violation.
            # Reachable on any package with two or more test files.
          done < <(find tests -type f -name '*.loft' 2>/dev/null)
          {
            echo "### ${{ matrix.name }} ${{ matrix.version }} — interpret suite FAILED against loft \`$loft_sha\`"
            echo "_re-classified as: $([ "$n" -eq 0 ] && echo 'no .loft to check' || { [ "$rc" -eq 0 ] && echo 'runtime failure, still COMPILES → best-effort PASS (VERIFY not a real regression)' || echo 'COMPILE break → hard FAIL'; })_"
            echo '```'; echo "$detail"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -eq 0 ]; then
            echo "::error::${{ matrix.name }}: suite failed and no .loft found to re-classify — failing conservatively."
            echo "$detail" | sed 's/^/    /'
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::warning::${{ matrix.name }}: full suite failed at RUNTIME but every .loft still COMPILES against loft@$loft_sha — classified environment/native-deps (ALSA, a display, …), best-effort PASS. VERIFY the detail below is not a real regression:"
            echo "$detail" | sed 's/^/    /'
            exit 0
          fi
          echo "::error::${{ matrix.name }}: a published library FAILS to compile against this loft — the freeze forbids a language change retro-breaking a shipped lib."
          echo "$detail" | sed 's/^/    /'
          exit 1

      # Native adds codegen/divergence coverage but needs each lib's own system deps
      # (e.g. graphics → ALSA), which a generic runner lacks — so it is BEST-EFFORT
      # here and hard-gated in each lib's own library-ci.yml (where its deps are set
      # up).  A red here is a signal to look, not an automatic freeze-gate failure.
      - name: Native — ${{ matrix.name }}  (best-effort)
        continue-on-error: true
        working-directory: lib/${{ matrix.sub }}
        run: LOFT_TIMEOUT=240 loft --native --tests tests

      # RELEASE-READY — one pass, and it is RED when that pass warned.
      #
      # ⚠ ONE pass.  This used to take two readings of the same question — the published
      # tag, then a second CHECKOUT of the library's default branch with the whole suite
      # RUN AGAIN — on the theory that "what a user sees today" and "what the library's own
      # CI does next PR" are different.  They are the same answer often enough not to be
      # worth 42 extra suite runs and 42 extra clones on every PR: the tag is what is
      # published and what a release is cut from, and a source tree that differs is the
      # library repo's own CI's business, where it is already gated.  The reading below
      # re-reads the log the pass above already wrote, so it costs nothing.
      #
      # RED on any warning, because the question is *can this library be built and released
      # as it stands* — and a library carrying warnings cannot: its own CI runs
      # `LOFT_DENY_WARNINGS=1`, so a release cut from it fails and the next PR to that repo
      # is red before its author has typed anything.  The absolute state is the answer to
      # "can it ship"; a delta answers a different question.
      #
      # ⚠ This never blocks a loft PR, and that is not an accident of settings alone:
      # `revalidate-libs` is outside `main`'s required contexts (Test ×3, Clippy, Format)
      # and must stay outside them.  Warnings are non-contractual — a new deprecation must
      # never fail an already-shipped artifact (COMPATIBILITY.md) — so a red here is a fact
      # about the ecosystem, never a veto on a change to the compiler.
      #
      # The step is SEPARATE from the hard gate so a reader of a red leg can see which
      # question failed from the step name alone: `Test against this loft` is a language
      # change retro-breaking a shipped library; this one is warning debt.
      - name: Release-ready — ${{ matrix.name }}  (advisory, never blocks)
        if: always()
        run: |
          set -uo pipefail
          scan="$GITHUB_WORKSPACE/loft-src/scripts/lib_warning_scan.py"
          mkdir -p "$GITHUB_WORKSPACE/warn"
          tag_log="$GITHUB_WORKSPACE/lib/${{ matrix.sub }}/suite.log"
          if [ ! -f "$tag_log" ]; then
            echo "no suite log for ${{ matrix.name }} — the pass above did not run; nothing to read"
            exit 0
          fi
          python3 "$scan" scan --from-log "$tag_log" \
            --root "$GITHUB_WORKSPACE/lib/${{ matrix.sub }}" \
            --name '${{ matrix.name }}' --ref '${{ matrix.version }}' --label published \
            --json "$GITHUB_WORKSPACE/warn/${{ matrix.name }}-published.json"
          n=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["count"])' \
                "$GITHUB_WORKSPACE/warn/${{ matrix.name }}-published.json")
          if [ "$n" -gt 0 ]; then
            echo "::error title=${{ matrix.name }} is not release-ready::$n warning(s) against this loft — its own LOFT_DENY_WARNINGS CI fails as it stands, so it cannot be released."
            exit 1
          fi
          echo "✅ ${{ matrix.name }} ${{ matrix.version }} is release-ready — no warnings against this loft"

      - name: Upload the warning report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: warnings-${{ matrix.name }}
          path: warn/
          if-no-files-found: ignore
          retention-days: 14

  # Fail the workflow if any published library broke — that is a language change
  # retro-breaking a shipped lib, which the freeze forbids.
  gate:
    needs: revalidate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # for scripts/lib_warning_scan.py

      - name: Collect the per-library warning reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: warnings-*
          path: warn
          merge-multiple: true

      # The one TABLE for the ecosystem — which libraries warn, and what kind.  Report
      # only: the red already happened, once, in each library's own leg.  Repeating it
      # here would be the second verdict on one question, which is what the second suite
      # run was.
      - name: Warning dashboard
        continue-on-error: true
        run: python3 scripts/lib_warning_scan.py collect warn >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verdict
        run: |
          r='${{ needs.revalidate.result }}'
          echo "revalidation: $r" >> "$GITHUB_STEP_SUMMARY"
          if [ "$r" = "success" ] || [ "$r" = "skipped" ]; then
            # Say what was actually checked.  This line used to read "every published
            # library still compiles + tests green against this loft", one line under an
            # annotation naming nine libraries that warn — a reader takes that as an
            # all-clear for the ecosystem, and it never was one.  Whether those libraries
            # can be RELEASED is the `release-ready` job's question, and it has its own
            # verdict.
            echo "✅ every published library compiles, tests green AND is release-ready against this loft"
          else
            # A leg is red for one of two reasons and its STEP NAME says which, so the
            # verdict names both rather than asserting the graver one.  It used to claim a
            # retro-break outright, which would now misread every warning-debt leg as a
            # freeze violation.
            echo "::error::a published library leg is RED. `Test against this loft` = a language change retro-broke a shipped lib (fix the lib, or reconsider the change — the stdlib may only grow additively). `Release-ready` = warning debt: the library cannot be released as it stands, which is the ecosystem's state and not this PR's fault. Open the red leg; the step name says which."
            exit 1
          fi
