# The C compiler the C backend drives on a Windows runner: MSYS2's UCRT gcc (16 or newer),
# named in `LOFT_CC`.  The runner's `cc` on `PATH` is MinGW-Builds gcc 15.2, which
# miscompiles loft's C (its modref pass rates a function that reads a record as reading no
# memory, so a call on a reused record is merged with the one before it: WINDOWS.md § The C
# compiler on a Windows runner).  Only `LOFT_CC` changes: MSYS2's `bin` is not put on
# `PATH`, where it would hide the runner's own python and other tools.  A step that sets
# `LOFT_CC` itself (`cl`) still wins.  Does nothing off Windows.
name: MSYS2 gcc for the C backend on Windows
description: Points LOFT_CC at C:/msys64/ucrt64/bin/gcc.exe (gcc 16+) on a Windows runner
runs:
  using: composite
  steps:
    - name: Point LOFT_CC at MSYS2 gcc
      if: runner.os == 'Windows'
      shell: bash
      run: |
        gcc=/c/msys64/ucrt64/bin/gcc.exe
        if [ ! -x "$gcc" ]; then
          timeout 600 /c/msys64/usr/bin/pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc
        fi
        # gcc 16.2.0 is held at package revision 6: with revision 7 the net component's TLS
        # client does not compile, while every job on revision 6 builds it (main's CI run
        # 44433835724: four Windows shards on -6 green, the one on -7 red).  Lift the pin once
        # a later revision builds `loft-components` on a windows-probe.  Every package of the
        # gcc set is held together: an image that ships revision 7 has `libstdc++` -7, which
        # requires `libgcc` -7, so a pin that leaves it out cannot install.
        # binutils is held at 2.47-4 beside it: with 2.47-5 the assembler fails every compile
        # without a word (`gcc -c` of a one-line file exits 1; windows-probe 45664462285, the
        # daily build's msvc leg and CI's rest-c shard on 7c6972f86), where 2.47-4 builds
        # `loft-components` (windows-probe 45662353357).
        want=16.2.0-6
        binutils=2.47-4
        have=$(/c/msys64/usr/bin/pacman -Q mingw-w64-ucrt-x86_64-gcc | cut -d' ' -f2)
        have_bu=$(/c/msys64/usr/bin/pacman -Q mingw-w64-ucrt-x86_64-binutils | cut -d' ' -f2)
        if [ "$have_bu" != "$binutils" ]; then
          timeout 600 /c/msys64/usr/bin/pacman -U --noconfirm \
            "https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-binutils-$binutils-any.pkg.tar.zst"
        fi
        if [ "$have" != "$want" ]; then
          repo=https://repo.msys2.org/mingw/ucrt64
          timeout 600 /c/msys64/usr/bin/pacman -U --noconfirm \
            "$repo/mingw-w64-ucrt-x86_64-gcc-$want-any.pkg.tar.zst" \
            "$repo/mingw-w64-ucrt-x86_64-libgcc-$want-any.pkg.tar.zst" \
            "$repo/mingw-w64-ucrt-x86_64-cc-libs-$want-any.pkg.tar.zst" \
            "$repo/mingw-w64-ucrt-x86_64-libstdc++-$want-any.pkg.tar.zst"
        fi
        "$gcc" --version | head -1
        /c/msys64/usr/bin/pacman -Q mingw-w64-ucrt-x86_64-binutils
        major=$("$gcc" -dumpversion | cut -d. -f1)
        if [ "$major" -lt 16 ]; then
          echo "::error::MSYS2 gcc is $("$gcc" -dumpversion); the C backend needs 16 or newer on Windows (gcc 15.2 miscompiles it)"
          exit 1
        fi
        echo "LOFT_CC=C:/msys64/ucrt64/bin/gcc.exe" >> "$GITHUB_ENV"
