# What loft ships, links or builds in that it did not write — one table per dependency.
# `scripts/thirdparty.py` checks this against the tree and asks each named advisory register;
# the format is THIRDPARTY.md, the same a library writes in its loft.toml.

# Files loft embeds or compiles that are ours but carry no licence header.
[own]
paths = ["src/c/loft_*.h", "src/c/tls/loft_*.c", "doc/loft-*.js", "index/*.json",
         "src/native_release_args.txt"]

[thirdparty.bearssl]
kind       = "vendored"
path       = "src/c/tls/bearssl"
upstream   = "https://www.bearssl.org/git/BearSSL"
commit     = "7bea48e5e850ab4cafbe68d3765cdaba13a86d6f"
version    = "0.6+"
digest     = "sha256:bd789853c394f011ffb425b0a000526d4dc5e9d84551539117128daaae35af7d"
advisories = ["nvd:bearssl", "osv:commit"]

[thirdparty.esp-idf]
kind       = "sdk"
source     = "https://github.com/espressif/esp-idf"
version    = "v6.0.2"
pinned     = "src/esp_app.rs:IDF_VERSION"
advisories = ["github:espressif/esp-idf"]

[thirdparty.esp-idf.reviewed]
CVE-2025-55297  = "not-reached: the BluFi example program; no app is built from it"
CVE-2026-113781 = "not-reached: BLE Mesh, and the app's sdkconfig sets CONFIG_BT_ENABLED=n"
CVE-2026-113782 = "not-reached: the OpenThread Border Router, which no app enables"
CVE-2026-113783 = "applies: lwIP's dns_lookup() overflows on a cache entry with several addresses, and the socket layer resolves names through lwIP; fixed in v6.0.3"

[thirdparty.badge-bsp]
kind       = "sdk"
source     = "esp-registry:badgeteam/badge-bsp"
version    = "1.6.4"
pinned     = "src/esp_app.rs:BSP"
advisories = ["github:badgeteam/esp32-component-badge-bsp"]

[thirdparty.libc]
kind     = "system"
names    = ["c", "m", "dl", "pthread", "gcc_s", "ld-linux-x86-64"]
provider = "the platform's C library and compiler runtime (glibc or musl and libgcc on Linux, libSystem on macOS)"

[thirdparty.windows]
kind     = "system"
names    = ["ws2_32", "crypt32", "advapi32", "bcrypt", "kernel32", "user32", "gdi32", "shell32",
            "ole32", "oleaut32", "windows"]
provider = "Windows: Winsock, the certificate store, the random source, the console and clipboard (rustyline), the API import library (windows-targets)"

[thirdparty.macos]
kind     = "system"
names    = ["Security", "ServiceManagement", "CoreFoundation", "bsm"]
provider = "macOS: the keychain trust store (rustls-native-certs), CoreFoundation, the audit library (nix through zip)"

[thirdparty.wasi-libc]
kind     = "system"
names    = ["setjmp", "wasi-emulated-signal", "wasi-emulated-process-clocks"]
provider = "wasi-libc, from the WASI SDK the wasm C build links against"

[thirdparty.sqlite]
kind     = "system"
names    = ["sqlite3", "winsqlite3"]
provider = "the OS's SQLite (libsqlite3; winsqlite3 ships with Windows), opened when a program reads a `sqlite:` source"

[thirdparty.rust]
kind     = "cargo"
lockfile = ["Cargo.lock", "loft-ffi/Cargo.lock", "loft-ffi-build/Cargo.lock",
            "loft-ffi-macros/Cargo.lock", "wasm-sync/Cargo.lock"]
# ring compiles BoringSSL-derived C and assembly (rustls' crypto); its advisories are RustSec's.
compiles-c = ["ring"]

[thirdparty.rust.reviewed]
RUSTSEC-2020-0077 = "applies: memmap 0.7 is unmaintained, so a flaw found in it gets no fix; loft maps store files through it directly (src/store.rs, src/database/io.rs) and through mmap-storage 0.10 — replace with memmap2"
RUSTSEC-2026-0192 = "applies: ttf-parser 0.21 is unmaintained; fontdue 0.9 (the `fontdue` feature) parses font files through it — a font from outside reaches it"
